<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Audition Submission</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',-apple-system,sans-serif;background:#f7f7f5;color:#1c1917;line-height:1.5}
.wrap{max-width:640px;margin:0 auto;padding:0 20px 60px}
header{background:linear-gradient(135deg,#0d3d4d,#145466);padding:36px 24px;text-align:center;margin-bottom:-1px}
header img{height:64px;margin-bottom:18px;mix-blend-mode:screen}
header h1{color:#fff;font-size:26px;font-weight:800}
.card{background:#fff;border:1px solid #e7e2d9;border-radius:14px;padding:24px;margin-top:20px}
.card.hero-card{padding:0;overflow:hidden}
.card-body{padding:22px 24px}
.card h2{font-size:15px;font-weight:700;color:#145466;margin-bottom:10px}
.banner-photo{width:100%;display:block;aspect-ratio:16/6;object-fit:cover;background:#e7e2d9}
.hero-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px}
.hero-title{font-size:21px;font-weight:800;color:#1c1917}
.status-pill{background:#dcfce7;color:#166534;padding:5px 14px;border-radius:20px;font-size:12px;font-weight:700;white-space:nowrap;flex-shrink:0}
.status-pill.closed{background:#fee2e2;color:#991b1b}
.meta-list{display:flex;flex-direction:column;gap:7px;margin-bottom:16px}
.meta-line{font-size:14px;color:#44403c;display:flex;gap:8px}
.meta-line .meta-tag{font-weight:700;color:#78716c;font-size:11px;text-transform:uppercase;letter-spacing:0.4px;min-width:108px;flex-shrink:0;padding-top:2px}
.divider{border-top:1px solid #e7e2d9;margin:16px 0}
.section-label{font-size:11.5px;font-weight:700;color:#145466;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:8px}
.desc-box{font-size:13.5px;line-height:1.65;white-space:pre-wrap;color:#44403c}
.material-item{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;background:#f7f7f5;border-radius:8px;margin-bottom:6px;font-size:13.5px}
.material-item a{color:#145466;font-weight:600;text-decoration:none}
.form-group{margin-bottom:16px}
label{display:block;font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;color:#78716c;margin-bottom:6px}
input[type=text],input[type=email],input[type=url],textarea,select{
  width:100%;padding:11px 13px;border:1.5px solid #d6d3ce;border-radius:9px;font-family:inherit;font-size:14px;outline:none;background:#fff
}
input:focus,textarea:focus,select:focus{border-color:#145466}
textarea{resize:vertical}
.hint{font-size:11.5px;color:#a8a29e;margin-top:4px}
.role-grid{display:flex;flex-direction:column;gap:8px;padding:12px 14px;border:1.5px solid #d6d3ce;border-radius:9px;background:#faf9f7}
.role-grid label{display:flex;align-items:center;gap:9px;font-size:13.5px;font-weight:500;text-transform:none;letter-spacing:0;color:#1c1917;cursor:pointer}
.role-grid input[type=checkbox]{width:16px;height:16px;accent-color:#145466}
.toggle-row{display:flex;gap:8px;margin-bottom:10px}
.toggle-btn{flex:1;padding:9px;border:1.5px solid #d6d3ce;border-radius:8px;background:#fff;font-size:12.5px;font-weight:700;cursor:pointer;text-align:center;color:#57534e}
.toggle-btn.active{border-color:#145466;background:#f0f8fa;color:#145466}
.file-drop{border:1.5px dashed #d6d3ce;border-radius:9px;padding:14px;text-align:center;font-size:12.5px;color:#78716c;cursor:pointer;background:#faf9f7}
.file-drop.has-file{border-color:#16a34a;color:#166534;background:#f0fdf4;font-weight:600}
.crew-toggle{display:flex;align-items:center;gap:10px;padding:14px;background:#faf9f7;border-radius:10px;cursor:pointer;margin-bottom:14px}
.crew-toggle input{width:17px;height:17px;accent-color:#7c3aed}
.slot-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-bottom:4px}
.slot-btn{padding:10px 8px;border:1.5px solid #d6d3ce;border-radius:8px;font-size:12.5px;font-weight:600;cursor:pointer;text-align:center;background:#fff}
.date-pill-row{display:flex;gap:8px;flex-wrap:wrap}
.date-pill{padding:9px 14px;border:1.5px solid #d6d3ce;border-radius:20px;font-size:12.5px;font-weight:700;cursor:pointer;background:#fff;color:#57534e}
.date-pill.active{border-color:#145466;background:#145466;color:#fff}
.slot-btn.selected{border-color:#145466;background:#145466;color:#fff}
.slot-btn.full{opacity:0.4;cursor:not-allowed;text-decoration:line-through}
.btn-primary{width:100%;padding:14px;background:#145466;color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit}
.btn-primary:disabled{opacity:0.6;cursor:default}
.status-msg{font-size:13px;margin-top:10px;text-align:center}
.status-msg.error{color:#dc2626}
.status-msg.success{color:#166534}
.empty-msg{text-align:center;color:#a8a29e;padding:60px 20px;font-size:15px}
.confirm-box{text-align:center;padding:40px 24px}
.confirm-box .check{width:56px;height:56px;border-radius:50%;background:#dcfce7;color:#16a34a;font-size:28px;font-weight:800;display:flex;align-items:center;justify-content:center;margin:0 auto 16px}
.confirm-box h2{font-size:19px;margin-bottom:8px;color:#145466}
.confirm-box p{font-size:14px;color:#57534e}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:999;display:flex;align-items:center;justify-content:center;padding:20px}
.modal-box{background:#fff;border-radius:14px;width:100%;max-width:480px;max-height:82vh;display:flex;flex-direction:column;overflow:hidden}
.modal-hdr{padding:18px 22px;border-bottom:1px solid #e7e2d9;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.modal-hdr h3{font-size:16px;font-weight:800;color:#145466}
.modal-close{background:none;border:none;font-size:22px;cursor:pointer;color:#78716c;line-height:1;padding:2px}
.modal-notice{margin:16px 20px 0;padding:10px 14px;background:#fffbeb;border:1px solid #fde68a;border-radius:9px;font-size:12.5px;color:#92400e;font-weight:600}
.modal-body{overflow-y:auto;padding:6px 0 16px}
.sched-event{padding:12px 22px;border-bottom:1px solid #f0eee9}
.sched-event:last-child{border-bottom:none}
.sched-date{font-size:11px;font-weight:700;color:#145466;text-transform:uppercase;letter-spacing:0.4px}
.sched-name{font-size:14.5px;font-weight:700;margin-top:2px}
.sched-meta{font-size:12.5px;color:#78716c;margin-top:2px}
</style>
</head>
<body>
<div id="app">
  <header><div class="empty-msg" style="color:rgba(255,255,255,0.7)">Loading…</div></header>
</div>

<script>
var pathParts = window.location.pathname.split('/').filter(Boolean)
// Two URL shapes are supported: the simple /audition/<slug> (matching the
// existing /register/<slug> style) and the older /audition/<type>/<id>.
// CONTEXT_TYPE/CONTEXT_ID start out possibly wrong for the slug style —
// boot() corrects them from the settings response once it resolves.
var IS_SLUG_URL = pathParts.length === 2
var CONTEXT_TYPE = IS_SLUG_URL ? null : pathParts[1]
var CONTEXT_ID = IS_SLUG_URL ? pathParts[1] : pathParts[2]
var SETTINGS = null
var SELECTED_SLOT = null
var UPLOADED = { resume: null, headshot: null, video_clip: null }

function escH(s){ var d=document.createElement('div'); d.textContent=s==null?'':String(s); return d.innerHTML }

function fmtTimeRange(start, end){
  function fmt(t){
    if(!t) return ''
    var p = String(t).split(':')
    var h = parseInt(p[0]), m = p[1]||'00'
    var ap = h>=12?'PM':'AM'
    h = h%12||12
    return h+(m!=='00'?':'+m:'')+' '+ap
  }
  var s = fmt(start)
  var e = fmt(end)
  return e ? (s+' – '+e) : s
}

function fmtEventDate(d){
  try{ return new Date(d+'T12:00:00').toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'}) }
  catch(e){ return d }
}

async function openScheduleModal(){
  var existing = document.getElementById('schedule-modal-overlay')
  if(existing) existing.remove()
  var overlay = document.createElement('div')
  overlay.id = 'schedule-modal-overlay'
  overlay.className = 'modal-overlay'
  overlay.innerHTML = `<div class="modal-box">
    <div class="modal-hdr"><h3>Rehearsal Schedule</h3><button class="modal-close" onclick="document.getElementById('schedule-modal-overlay').remove()">×</button></div>
    <div class="modal-notice">This schedule reflects what's currently planned and is subject to change.</div>
    <div class="modal-body" id="schedule-modal-body"><div class="empty-msg" style="padding:30px 20px">Loading…</div></div>
  </div>`
  overlay.addEventListener('click', function(e){ if(e.target===overlay) overlay.remove() })
  document.body.appendChild(overlay)

  var body = document.getElementById('schedule-modal-body')
  var res
  try{
    // By the time this runs, boot() has already resolved CONTEXT_TYPE/
    // CONTEXT_ID to real values regardless of which URL shape was used.
    res = await fetch('/api/public/audition-schedule/'+encodeURIComponent(CONTEXT_TYPE)+'/'+encodeURIComponent(CONTEXT_ID))
    res = await res.json()
  } catch(e){
    body.innerHTML = '<div class="empty-msg" style="padding:30px 20px">Couldn\'t load the schedule.</div>'
    return
  }
  if(res.error){
    body.innerHTML = '<div class="empty-msg" style="padding:30px 20px">'+escH(res.error)+'</div>'
    return
  }
  var events = res.events||[]
  if(!events.length){
    body.innerHTML = '<div class="empty-msg" style="padding:30px 20px">No rehearsals scheduled yet — check back soon.</div>'
    return
  }
  body.innerHTML = events.map(function(e){
    return '<div class="sched-event">'
      + '<div class="sched-date">'+fmtEventDate(e.event_date)+'</div>'
      + '<div class="sched-name">'+escH(e.name||'Rehearsal')+'</div>'
      + '<div class="sched-meta">'+(e.start_time?fmtTimeRange(e.start_time, e.end_time):'')+(e.location?((e.start_time?' \u00b7 ':'')+escH(e.location)):'')+'</div>'
      + '</div>'
  }).join('')
}

async function boot(){
  var res
  try{
    var url = IS_SLUG_URL
      ? `/api/public/audition-settings-by-slug/${encodeURIComponent(CONTEXT_ID)}`
      : `/api/auditions/settings/${CONTEXT_TYPE}/${CONTEXT_ID}`
    res = await fetch(url)
    res = await res.json()
  } catch(e){
    renderError("Couldn't load this audition page.")
    return
  }
  if(res.error || !res.is_open){
    renderError(res.is_open===false ? "Auditions aren't currently open." : (res.error || 'Not found.'))
    return
  }
  // The settings response carries the real context_type/context_id (from
  // the audition_settings row itself), which is what submission and file
  // uploads need — important for the slug URL, where we didn't know the
  // type going in.
  if(res.context_type) CONTEXT_TYPE = res.context_type
  if(res.context_id) CONTEXT_ID = res.context_id
  SETTINGS = res
  render()
}

function renderError(msg){
  document.getElementById('app').innerHTML = `
    <header>
      <img src="https://rolecall.hwtco.org/static/images/hwtc_logo_white.png" alt="Horizon West Theater Company"/>
      <h1>Auditions</h1>
    </header>
    <div class="wrap"><div class="card"><div class="card-body"><div class="empty-msg">${escH(msg)}</div></div></div></div>`
}

function render(){
  var s = SETTINGS
  var html = `
    <header>
      <img src="https://rolecall.hwtco.org/static/images/hwtc_logo_white.png" alt="Horizon West Theater Company"/>
      <h1>${escH(s.title||'Auditions')}</h1>
    </header>
    <div class="wrap">`

  // Hero card — banner photo (if set) at the top of the card, then title +
  // status pill, clean meta lines, a divider, and an About section —
  // matching the look of the existing program registration pages.
   html += '<div class="card hero-card">'
  if(s.banner_image_url) html += `<img class="banner-photo" src="${s.banner_image_url}" alt=""/>`
  html += '<div class="card-body">'
  html += '<div class="hero-top"><div class="hero-title">'+escH(s.context_name||s.title||'Auditions')+'</div>'
    + '<div class="status-pill">Open</div></div>'

  html += '<div class="meta-list">'
  var metaRows = [
    ['Director', s.director],
    ['Audition Date', s.audition_date ? escH(s.audition_date)+(s.audition_time?' \u00b7 '+fmtTimeRange(s.audition_time, s.audition_time_end):'') : null],
    ['Location', s.location_name],
    ['Address', s.location_address],
    ['Performance', s.performance_dates],
    ['Show Venue', s.performance_location],
  ]
  metaRows.forEach(function(r){
    if(r[1]) html += '<div class="meta-line"><span class="meta-tag">'+r[0]+'</span><span>'+(r[0]==='Audition Date'?r[1]:escH(r[1]))+'</span></div>'
  })
  html += '</div>'

  if(s.show_rehearsal_schedule){
    html += '<div style="margin-bottom:14px"><button type="button" onclick="openScheduleModal()" style="background:none;border:none;padding:0;color:#145466;font-weight:700;font-size:13px;cursor:pointer;font-family:inherit">View Rehearsal Schedule (subject to change) →</button></div>'
  }

  if(s.description || s.instructions){
    html += '<div class="divider"></div>'
    html += '<div class="section-label">About This Audition</div>'
    if(s.description) html += '<div class="desc-box">'+escH(s.description)+'</div>'
    if(s.instructions) html += '<div class="desc-box" style="margin-top:10px">'+escH(s.instructions)+'</div>'
  }
  html += '</div></div>'

  // Materials
  if((s.materials||[]).length){
    html += '<div class="card"><h2>Audition Materials</h2>'
    html += s.materials.map(m=>`<div class="material-item"><a href="${m.file_url}" target="_blank">${escH(m.filename)}</a>${m.description?'<span style="color:#78716c">'+escH(m.description)+'</span>':''}</div>`).join('')
    html += '</div>'
  }

  // How would you like to audition? — an explicit choice instead of two
  // unlabeled, disconnected sections (a slot grid and a video field) that
  // left people unsure which one applied to them.
  var hasSlots = s.allow_slots && (s.slots||[]).length
  var hasVideo = s.allow_video_link!==false
  if(hasSlots && hasVideo){
    html += `<div class="card"><h2>How Would You Like to Audition?</h2>
      <div class="toggle-row" style="margin-top:10px">
        <div class="toggle-btn" id="mode-tab-inperson" onclick="setAuditionMode('inperson')">In-Person — Pick a Time</div>
        <div class="toggle-btn" id="mode-tab-virtual" onclick="setAuditionMode('virtual')">Virtual — Submit a Video</div>
      </div>
      <div id="mode-area-inperson" style="display:none;margin-top:14px"></div>
      <div id="mode-area-virtual" style="display:none;margin-top:14px"></div>
    </div>`
  }

  // Main form
  html += '<div class="card"><h2>Submit Your Audition</h2><div style="display:flex;flex-direction:column">'
  html += `
    <div class="form-group"><label>Your Name *</label><input type="text" id="f-name"/></div>
    <div class="form-group"><label>Email (for confirmation)</label><input type="email" id="f-email"/></div>`

   // Roles — staff can turn this whole section off for shows with no
  // distinct roles to ask about
  if(s.ask_roles!==false){
    if((s.roles||[]).length){
      html += '<div class="form-group"><label>Roles Interested In <span style="font-weight:400;text-transform:none;color:#a8a29e">(optional)</span></label><div class="role-grid">'
      html += s.roles.map(r=>`<label><input type="checkbox" class="role-cb" value="${escH(r.name)}"/> <span><strong>${escH(r.name)}</strong>${r.description?'<br><span style="font-weight:400;color:#78716c;font-size:12px">'+escH(r.description)+'</span>':''}</span></label>`).join('')
      html += '<label><input type="checkbox" class="role-cb" value="Other / Not sure yet"/> Other / Not sure yet</label></div></div>'
    } else {
      html += '<div class="form-group"><label>Roles Interested In <span style="font-weight:400;text-transform:none;color:#a8a29e">(optional)</span></label><input type="text" id="f-role-text" placeholder="e.g. Lead, Ensemble"/></div>'
    }
  }

  // Age check
  if(s.collect_age_check){
    html += `<div class="form-group"><label>Are you under or over 18?</label>
      <select id="f-age-status" onchange="document.getElementById('birthday-field').style.display=this.value==='under'?'':'none'">
        <option value="">Select…</option>
        <option value="over">18 or older</option>
        <option value="under">Under 18</option>
      </select>
      <div id="birthday-field" style="display:none;margin-top:8px"><label>Birthday</label><input type="date" id="f-birthday"/></div>
    </div>`
  }

  // Pronouns
  if(s.collect_pronouns){
    html += '<div class="form-group"><label>Pronouns</label><input type="text" id="f-pronouns" placeholder="e.g. she/her, he/him, they/them"/></div>'
  }

  // Phone
  if(s.collect_phone){
    html += '<div class="form-group"><label>Phone</label><input type="text" id="f-phone" placeholder="(555) 555-5555"/></div>'
  }

  // How heard
  if(s.collect_how_heard){
    html += '<div class="form-group"><label>How Did You Hear About Us?</label><input type="text" id="f-how-heard" placeholder="e.g. Friend, social media, past show…"/></div>'
  }

  // Video — shown inline only when there's no in-person slot option to
  // choose between (otherwise it's rendered into the toggle area below).
  if(hasVideo && !hasSlots){
    html += auditionVideoFieldHtml()
  }

  // Resume — upload only, no link fallback
  if(s.allow_resume_link!==false){
    html += `<div class="form-group"><label>Resume</label>
      <input type="file" id="f-resume-file" accept=".pdf,.doc,.docx" style="display:none" onchange="handleFileUpload('resume', this)"/>
      <div class="file-drop" id="drop-resume" onclick="document.getElementById('f-resume-file').click()">Click to upload (PDF or Word doc)</div>
    </div>`
  }

  // Headshot — upload only, no link fallback
  if(s.allow_headshot_link!==false){
    html += `<div class="form-group"><label>Headshot</label>
      <input type="file" id="f-headshot-file" accept=".png,.jpg,.jpeg" style="display:none" onchange="handleFileUpload('headshot', this)"/>
      <div class="file-drop" id="drop-headshot" onclick="document.getElementById('f-headshot-file').click()">Click to upload (PNG or JPG)</div>
    </div>`
  }

  // Custom questions
  if((s.custom_questions||[]).length){
    html += s.custom_questions.map((q,i)=>`<div class="form-group"><label>${escH(q.question)}</label><textarea class="f-custom-answer" data-q="${escH(q.question)}" rows="2"></textarea></div>`).join('')
  }

  html += '<div class="form-group"><label>Anything Else?</label><textarea id="f-notes" rows="3" placeholder="Conflicts, questions, anything we should know…"></textarea></div>'
  html += '</div></div>'

  // Crew/tech section
  if(s.allow_crew_interest!==false){
    html += `<div class="card">
      <label class="crew-toggle">
        <input type="checkbox" id="f-crew-interest" onchange="document.getElementById('crew-fields').style.display=this.checked?'':'none'"/>
        <span><strong>I'm also interested in Crew / Tech</strong><br><span style="font-weight:400;color:#78716c;font-size:12.5px">Stage management, costumes, sets, lighting, sound, and more.</span></span>
      </label>
      <div id="crew-fields" style="display:none">
        ${s.crew_instructions?'<div class="desc-box">'+escH(s.crew_instructions)+'</div>':''}
        ${(s.crew_roles||[]).length?`<div class="form-group"><label>Crew / Tech Areas</label><div class="role-grid">`+
          s.crew_roles.map(r=>`<label><input type="checkbox" class="crew-role-cb" value="${escH(r.name)}"/> ${escH(r.name)}</label>`).join('')+
          `</div></div>`:''}
        <div class="form-group"><label>Relevant Skills / Experience</label><textarea id="f-crew-exp" rows="3" placeholder="Anything you'd like us to know — prior experience is not required."></textarea></div>
      </div>
    </div>`
  }

  html += `<div class="card">
    <button class="btn-primary" id="submit-btn" onclick="submitAudition()">Submit Audition</button>
    <div class="status-msg" id="submit-status"></div>
  </div></div>`

  document.getElementById('app').innerHTML = html
  // If both in-person and virtual are options, default to in-person
  // (booking a real time is usually the stronger preference) but leave it
  // an explicit, visible choice either way.
  if(document.getElementById('mode-tab-inperson')) setAuditionMode('inperson')
}

function selectSlot(id){
  SELECTED_SLOT = id
  document.querySelectorAll('.slot-btn').forEach(el=>{
    el.classList.toggle('selected', el.dataset.slot===id)
  })
}

function auditionVideoFieldHtml(){
  return `<div class="form-group"><label>Audition Video</label>
      <div class="toggle-row">
        <div class="toggle-btn active" id="vid-tab-clip" onclick="setVidMode('clip')">Upload a Short Clip</div>
        <div class="toggle-btn" id="vid-tab-link" onclick="setVidMode('link')">Link to Full Video</div>
      </div>
      <div id="vid-clip-area"><input type="file" id="f-video-file" accept=".mp4,.mov,.webm" style="display:none" onchange="handleFileUpload('video_clip', this)"/>
        <div class="file-drop" id="drop-video_clip" onclick="document.getElementById('f-video-file').click()">Click to upload a short clip (MP4/MOV/WEBM, up to 15MB)</div>
        <div class="hint">For a longer performance, use "Link to Full Video" instead.</div></div>
      <div id="vid-link-area" style="display:none"><input type="url" id="f-video-link" placeholder="YouTube, Google Drive, Vimeo…"/></div>
    </div>`
}

function dateGroupedSlotPickerHtml(){
  var byDate = {}
  var order = []
  ;(SETTINGS.slots||[]).forEach(function(sl){
    if(!byDate[sl.slot_date]){ byDate[sl.slot_date] = []; order.push(sl.slot_date) }
    byDate[sl.slot_date].push(sl)
  })
  var html = '<div class="hint" style="margin-bottom:10px">Pick a date, then a time.</div>'
  html += '<div class="date-pill-row" id="date-pill-row">'
  html += order.map(function(d, i){
    var dObj = new Date(d+'T12:00:00')
    var label = dObj.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'})
    return `<div class="date-pill${i===0?' active':''}" data-date="${d}" onclick="selectAuditionDate('${d}')">${label}</div>`
  }).join('')
  html += '</div><div class="slot-grid" id="slot-grid" style="margin-top:10px"></div>'
  // Stash for selectAuditionDate to use
  window._SLOT_BY_DATE = byDate
  window._SLOT_DATE_ORDER = order
  return html
}

function selectAuditionDate(date){
  document.querySelectorAll('.date-pill').forEach(function(el){ el.classList.toggle('active', el.dataset.date===date) })
  var grid = document.getElementById('slot-grid')
  var slots = (window._SLOT_BY_DATE||{})[date] || []
  grid.innerHTML = slots.map(function(sl){
    var full = (sl.booked_count||0) >= (sl.capacity||1)
    return `<div class="slot-btn${full?' full':''}" data-slot="${sl.id}" onclick="${full?'':'selectSlot(this.dataset.slot)'}">${escH(sl.start_time)}${sl.end_time?' – '+escH(sl.end_time):''}</div>`
  }).join('') || '<div class="hint">No times available this date.</div>'
}

function setAuditionMode(mode){
  document.getElementById('mode-tab-inperson').classList.toggle('active', mode==='inperson')
  document.getElementById('mode-tab-virtual').classList.toggle('active', mode==='virtual')
  var ipArea = document.getElementById('mode-area-inperson')
  var vArea = document.getElementById('mode-area-virtual')
  ipArea.style.display = mode==='inperson' ? '' : 'none'
  vArea.style.display = mode==='virtual' ? '' : 'none'
  if(mode==='inperson'){
    if(!ipArea.dataset.built){
      ipArea.dataset.built = '1'
      ipArea.innerHTML = dateGroupedSlotPickerHtml()
      if((window._SLOT_DATE_ORDER||[]).length) selectAuditionDate(window._SLOT_DATE_ORDER[0])
    }
    // Switching to in-person clears any video selection, since only one mode applies
    var linkEl = document.getElementById('f-video-link'); if(linkEl) linkEl.value = ''
    UPLOADED.video_clip = null
  } else {
    if(!vArea.dataset.built){
      vArea.dataset.built = '1'
      vArea.innerHTML = auditionVideoFieldHtml()
    }
    SELECTED_SLOT = null
  }
}

function setVidMode(mode){
  document.getElementById('vid-tab-clip').classList.toggle('active', mode==='clip')
  document.getElementById('vid-tab-link').classList.toggle('active', mode==='link')
  document.getElementById('vid-clip-area').style.display = mode==='clip' ? '' : 'none'
  document.getElementById('vid-link-area').style.display = mode==='link' ? '' : 'none'
}

async function handleFileUpload(kind, inputEl){
  var file = inputEl.files?.[0]
  if(!file) return
  var dropEl = document.getElementById('drop-'+kind)
  var originalText = dropEl.textContent
  dropEl.textContent = 'Uploading…'
  var fd = new FormData()
  fd.append('file', file)
  fd.append('kind', kind)
  try{
    var res = await fetch('/api/auditions/submit-file', {method:'POST', body: fd})
    var d = await res.json()
    if(!d.ok){
      dropEl.textContent = originalText
      alert(d.error || 'Upload failed')
      inputEl.value = ''
      return
    }
    UPLOADED[kind] = d.url
    dropEl.textContent = ' ' + d.filename
    dropEl.classList.add('has-file')
  } catch(e){
    dropEl.textContent = originalText
    alert('Upload failed')
  }
}

async function submitAudition(){
  var statusEl = document.getElementById('submit-status')
  var name = document.getElementById('f-name')?.value.trim()
  if(!name){ statusEl.textContent = 'Please enter your name.'; statusEl.className = 'status-msg error'; return }

  var rolesRequested = Array.from(document.querySelectorAll('.role-cb:checked')).map(el=>el.value)
  var roleText = document.getElementById('f-role-text')?.value.trim()
  if(roleText) rolesRequested = [roleText]

  var crewInterest = !!document.getElementById('f-crew-interest')?.checked
  var crewRoles = Array.from(document.querySelectorAll('.crew-role-cb:checked')).map(el=>el.value)

  var payload = {
    context_type: CONTEXT_TYPE, context_id: CONTEXT_ID,
    submitter_name: name,
    submitter_email: document.getElementById('f-email')?.value.trim()||null,
    roles_requested: rolesRequested,
    video_url: document.getElementById('f-video-link')?.value.trim()||null,
    video_clip_url: UPLOADED.video_clip,
    resume_url: document.getElementById('f-resume-link')?.value.trim()||null,
    resume_file_url: UPLOADED.resume,
    headshot_url: document.getElementById('f-headshot-link')?.value.trim()||null,
    headshot_file_url: UPLOADED.headshot,
    notes: document.getElementById('f-notes')?.value.trim()||null,
    slot_id: SELECTED_SLOT,
    audition_type: SELECTED_SLOT ? 'in_person' : 'virtual',
    crew_interest: crewInterest,
    crew_roles_requested: crewRoles,
    crew_experience: document.getElementById('f-crew-exp')?.value.trim()||null,
    is_minor: (function(){ var v=document.getElementById('f-age-status')?.value; return v ? v==='under' : null })(),
    birthday: document.getElementById('f-birthday')?.value||null,
    pronouns: document.getElementById('f-pronouns')?.value.trim()||null,
    phone: document.getElementById('f-phone')?.value.trim()||null,
    how_heard: document.getElementById('f-how-heard')?.value.trim()||null,
    custom_answers: (function(){
      var out = {}
      document.querySelectorAll('.f-custom-answer').forEach(function(el){
        var v = el.value.trim()
        if(v) out[el.dataset.q] = v
      })
      return out
    })(),
  }

  var btn = document.getElementById('submit-btn')
  btn.disabled = true; btn.textContent = 'Submitting…'
  statusEl.textContent = ''

  try{
    var res = await fetch('/api/auditions/submit', {
      method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(payload)
    })
    var d = await res.json()
    if(!d.ok){
      statusEl.textContent = d.error || 'Something went wrong — please try again.'
      statusEl.className = 'status-msg error'
      btn.disabled = false; btn.textContent = 'Submit Audition'
      return
    }
    document.getElementById('app').innerHTML = `
      <header>
        <img src="https://rolecall.hwtco.org/static/images/hwtc_logo_white.png" alt="Horizon West Theater Company"/>
        <h1>${escH(SETTINGS.title||'Auditions')}</h1>
      </header>
      <div class="wrap"><div class="card confirm-box">
        <div class="check">✓</div>
        <h2>You're all set!</h2>
        <p>Thank you for submitting${document.getElementById('f-email')?.value.trim()?' — a confirmation email has been sent to you.':'.'}</p>
      </div></div>`
  } catch(e){
    statusEl.textContent = 'Something went wrong — please try again.'
    statusEl.className = 'status-msg error'
    btn.disabled = false; btn.textContent = 'Submit Audition'
  }
}

boot()
</script>
