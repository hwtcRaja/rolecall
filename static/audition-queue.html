<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Audition Check-In</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:'DM Sans',-apple-system,sans-serif;
  background:linear-gradient(160deg,#0d3d4d,#0a2a35 65%);
  color:#fff;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:100vh;padding:40px 24px;text-align:center
}
.eyebrow{font-size:14px;font-weight:700;letter-spacing:0.15em;text-transform:uppercase;color:rgba(255,255,255,0.55);margin-bottom:6px}
.show-name{font-size:22px;font-weight:700;color:rgba(255,255,255,0.85);margin-bottom:48px}
.now-label{font-size:20px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:#5eead4;margin-bottom:8px}
.now-number{font-size:min(28vw,220px);font-weight:800;line-height:1;letter-spacing:-0.02em;margin-bottom:56px;font-variant-numeric:tabular-nums}
.now-number.empty{font-size:44px;font-weight:700;color:rgba(255,255,255,0.4)}
.row{display:flex;gap:56px;align-items:flex-start;justify-content:center;flex-wrap:wrap}
.block-label{font-size:14px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:rgba(255,255,255,0.55);margin-bottom:10px}
.on-deck-number{font-size:80px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.on-deck-number.empty{font-size:24px;font-weight:600;color:rgba(255,255,255,0.35)}
.next-up-list{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;max-width:440px}
.next-up-chip{font-size:26px;font-weight:700;background:rgba(255,255,255,0.1);border-radius:12px;padding:8px 18px;font-variant-numeric:tabular-nums}
.next-up-empty{font-size:18px;font-weight:600;color:rgba(255,255,255,0.35);padding-top:14px}
.footer{margin-top:64px;font-size:13px;color:rgba(255,255,255,0.35)}
.error-box{font-size:22px;color:rgba(255,255,255,0.7)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.55}}
.now-number:not(.empty){animation:pulse 2.4s ease-in-out infinite}
@keyframes flash{0%,100%{background:transparent}20%,60%{background:rgba(94,234,212,0.35)}}
body.flash{animation:flash 1.4s ease-out 1}
.sound-gate{position:fixed;inset:0;background:#0a2a35;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;z-index:50;cursor:pointer;text-align:center;padding:40px}
.sound-gate-icon{font-size:56px}
.sound-gate-title{font-size:22px;font-weight:800}
.sound-gate-sub{font-size:14px;color:rgba(255,255,255,0.6);max-width:360px}
</style>
</head>
<body>
<div class="sound-gate" id="sound-gate" onclick="enableSound()">
  <div class="sound-gate-icon"></div>
  <div class="sound-gate-title">Tap to Start Display</div>
  <div class="sound-gate-sub">Enables the announcement sound so this screen can call out numbers as they come up. Leave this running on the lobby TV or tablet.</div>
</div>
<div id="app"><div class="error-box">Loading…</div></div>

<script>
var pathParts = window.location.pathname.split('/').filter(Boolean)
// Two URL shapes, matching the rest of the audition pages: /audition/<slug>/queue
// and /audition-queue/<type>/<id>.
var IS_SLUG_URL = pathParts[0] === 'audition' && pathParts.length === 3
var CONTEXT_TYPE = IS_SLUG_URL ? null : pathParts[1]
var CONTEXT_ID = IS_SLUG_URL ? pathParts[1] : pathParts[2]
var SLUG = IS_SLUG_URL ? pathParts[1] : null
var lastShowName = null
var lastNowServing = undefined // undefined = haven't polled yet; distinct from null (polled, no one called)
var soundEnabled = false

function escH(s){ var d=document.createElement('div'); d.textContent=s==null?'':String(s); return d.innerHTML }

// ── HWTC Announcer: a soft three-note chime, then the number spoken ──────
// Browsers only allow audio after a tap, so unlock() must run inside a
// click handler once; after that the page can announce unattended.
var HwtcAnnouncer = (function(){
  var ctx = null, unlocked = false, voice = null
  function pickVoice(){
    try{
      var vs = speechSynthesis.getVoices() || []
      var en = vs.filter(function(v){ return /^en(-|_|$)/i.test(v.lang) })
      var prefer = [/Google US English/i, /Samantha/i, /Natural/i, /Aria/i, /Jenny/i, /Zira/i, /Google UK English Female/i]
      for(var i=0;i<prefer.length;i++){
        var m = en.find(function(v){ return prefer[i].test(v.name) })
        if(m){ voice = m; return }
      }
      voice = en.find(function(v){ return /en-US/i.test(v.lang) }) || en[0] || null
    }catch(e){}
  }
  try{ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice }catch(e){}

  function unlock(){
    try{
      if(!ctx) ctx = new (window.AudioContext||window.webkitAudioContext)()
      if(ctx.state === 'suspended') ctx.resume()
      // a silent blip inside the tap keeps iOS/TV browsers happy
      var o = ctx.createOscillator(), g = ctx.createGain(); g.gain.value = 0
      o.connect(g); g.connect(ctx.destination); o.start(); o.stop(ctx.currentTime + 0.01)
    }catch(e){}
    try{ var p = new SpeechSynthesisUtterance(' '); p.volume = 0; speechSynthesis.speak(p) }catch(e){}
    unlocked = true
  }

  // Warm bell: sine fundamental + a quiet octave partial, quick attack,
  // long ring-out, with a soft echo so it doesn't sound like a beep.
  function bell(freq, at, dur){
    var out = ctx.createGain(); out.gain.value = 0.9
    var echo = ctx.createDelay(); echo.delayTime.value = 0.18
    var fb = ctx.createGain(); fb.gain.value = 0.25
    out.connect(ctx.destination); out.connect(echo); echo.connect(fb); fb.connect(echo); fb.connect(ctx.destination)
    ;[[1, 0.28], [2, 0.07], [3.01, 0.025]].forEach(function(p){
      var o = ctx.createOscillator(), g = ctx.createGain()
      o.type = 'sine'; o.frequency.value = freq * p[0]
      g.gain.setValueAtTime(0.0001, at)
      g.gain.exponentialRampToValueAtTime(p[1], at + 0.015)
      g.gain.exponentialRampToValueAtTime(0.0001, at + dur)
      o.connect(g); g.connect(out); o.start(at); o.stop(at + dur + 0.05)
    })
  }
  function chime(){
    if(!ctx) return 0
    if(ctx.state === 'suspended') ctx.resume()
    var t = ctx.currentTime + 0.05
    bell(659.25, t, 1.6)          // E5
    bell(830.61, t + 0.28, 1.6)   // G#5
    bell(987.77, t + 0.56, 2.2)   // B5
    return 1500                   // ms until the chime has mostly rung out
  }
  function say(text){
    try{
      speechSynthesis.cancel(); speechSynthesis.resume()
      var u = new SpeechSynthesisUtterance(text)
      if(voice) u.voice = voice
      u.rate = 0.92; u.pitch = 1; u.volume = 1
      speechSynthesis.speak(u)
    }catch(e){}
  }
  function announce(number){
    if(!unlocked) return
    var wait = 0
    try{ wait = chime() }catch(e){}
    setTimeout(function(){
      say('Now auditioning, number ' + number + '. Number ' + number + ', please come to the audition room.')
    }, wait)
  }
  return { unlock: unlock, announce: announce, isUnlocked: function(){ return unlocked } }
})()

// Inside /tv the parent page owns the sound (so one tap there covers every
// display it switches between); this page just tells it what to announce.
var EMBEDDED_IN_TV = new URLSearchParams(location.search).get('embed') === 'tv' && window.parent !== window
if(EMBEDDED_IN_TV){ var _gate = document.getElementById('sound-gate'); if(_gate) _gate.style.display = 'none' }

function enableSound(){
  soundEnabled = true
  document.getElementById('sound-gate').style.display = 'none'
  HwtcAnnouncer.unlock()
}

function announce(number){
  document.body.classList.remove('flash')
  void document.body.offsetWidth // restart the CSS animation
  document.body.classList.add('flash')
  if(EMBEDDED_IN_TV){
    try{ window.parent.postMessage({type: 'hwtc-announce', number: number}, location.origin) }catch(e){}
    return
  }
  if(soundEnabled) HwtcAnnouncer.announce(number)
}

function render(data){
  if(data.context_name) lastShowName = data.context_name
  var nowHtml = (data.now_serving != null)
    ? '<div class="now-number">#'+data.now_serving+'</div>'
    : '<div class="now-number empty">No one called yet</div>'

  var onDeckHtml = (data.on_deck != null)
    ? '<div class="on-deck-number">#'+data.on_deck+'</div>'
    : '<div class="on-deck-number empty">—</div>'

  var nextUpHtml
  if(data.next_up && data.next_up.length){
    nextUpHtml = '<div class="next-up-list">' + data.next_up.map(function(n){ return '<div class="next-up-chip">#'+n+'</div>' }).join('') + '</div>'
  } else {
    nextUpHtml = '<div class="next-up-empty">—</div>'
  }

  document.getElementById('app').innerHTML = `
    <div class="eyebrow">Now Checking In</div>
    ${lastShowName ? '<div class="show-name">'+escH(lastShowName)+'</div>' : ''}
    <div class="now-label">Now Auditioning</div>
    ${nowHtml}
    <div class="row">
      <div>
        <div class="block-label">On Deck</div>
        ${onDeckHtml}
      </div>
      <div>
        <div class="block-label">Up Next</div>
        ${nextUpHtml}
      </div>
    </div>
    <div class="footer">${(data.waiting_count||0)} waiting &middot; Horizon West Theater Company</div>
  `
}

async function poll(){
  try{
    var url = IS_SLUG_URL
      ? '/api/public/audition-queue-by-slug/'+encodeURIComponent(SLUG)
      : '/api/public/audition-queue/'+encodeURIComponent(CONTEXT_TYPE)+'/'+encodeURIComponent(CONTEXT_ID)
    var res = await fetch(url)
    var data = await res.json()
    if(data.error){
      document.getElementById('app').innerHTML = '<div class="error-box">'+escH(data.error)+'</div>'
      return
    }
    // Announce only on an actual change to a new, real number — not on the
    // very first poll (which would announce whoever's already up whenever
    // this screen happens to load or reload) and not when it goes back to
    // null (nothing to call out).
    if(lastNowServing !== undefined && data.now_serving != null && data.now_serving !== lastNowServing){
      announce(data.now_serving)
    }
    lastNowServing = data.now_serving
    render(data)
  } catch(e){
    // Transient network hiccup on an unattended screen — don't blank it out,
    // just try again on the next poll.
  }
}

poll()
setInterval(poll, 4000)
</script>
</body>
</html>
