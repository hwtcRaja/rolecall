<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Rehearsal Schedule</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',-apple-system,sans-serif;background:#f7f7f5;color:#1c1917;line-height:1.5}
.wrap{max-width:640px;margin:0 auto;padding:0 20px 60px}
header{background:linear-gradient(135deg,#0d3d4d,#145466);padding:28px 24px;margin-bottom:-1px}
header .hdr-inner{max-width:640px;margin:0 auto;display:flex;flex-direction:column;align-items:flex-start}
header img{height:80px;margin-bottom:14px;mix-blend-mode:screen}
header h1{color:#fff;font-size:22px;font-weight:800}
header .sub{color:rgba(255,255,255,0.75);font-size:14px;margin-top:6px}
.notice{margin:20px 0;padding:12px 16px;background:#fffbeb;border:1px solid #fde68a;border-radius:10px;font-size:13px;color:#92400e;font-weight:600}
.card{background:#fff;border:1px solid #e7e2d9;border-radius:14px;padding:0;margin-top:0;overflow:hidden}
.event-row{padding:14px 20px;border-bottom:1px solid #e7e2d9}
.event-row:last-child{border-bottom:none}
.event-date{font-size:11px;font-weight:700;color:#145466;text-transform:uppercase;letter-spacing:0.5px}
.event-name{font-size:15px;font-weight:700;margin-top:3px}
.event-meta{font-size:12.5px;color:#78716c;margin-top:2px}
.empty-msg{text-align:center;color:#a8a29e;padding:60px 20px;font-size:15px}
</style>
</head>
<body>
<div id="app">
  <header><div class="hdr-inner"><div class="empty-msg" style="color:rgba(255,255,255,0.7);padding:0">Loading…</div></div></header>
</div>
<script>
var pathParts = window.location.pathname.split('/').filter(Boolean)
// Two URL shapes: /audition/<slug>/schedule (matching the simple
// /audition/<slug> submission page) and the older /audition-schedule/<type>/<id>.
var IS_SLUG_URL = pathParts[0] === 'audition'
var SLUG = IS_SLUG_URL ? pathParts[1] : null
var CONTEXT_TYPE = IS_SLUG_URL ? null : pathParts[1]
var CONTEXT_ID = IS_SLUG_URL ? null : pathParts[2]

function escH(s){ var d=document.createElement('div'); d.textContent=s==null?'':String(s); return d.innerHTML }

function fmtTime(t){
  if(!t) return ''
  var parts = String(t).split(':')
  var h = parseInt(parts[0]), m = parts[1]||'00'
  var ap = h>=12?'PM':'AM'
  h = h%12||12
  return h+(m!=='00'?':'+m:'')+' '+ap
}

function fmtDate(d){
  try{ return new Date(d+'T12:00:00').toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'}) }
  catch(e){ return d }
}

async function boot(){
  var res
  try{
    var url = IS_SLUG_URL
      ? '/api/public/audition-schedule-by-slug/'+encodeURIComponent(SLUG)
      : '/api/public/audition-schedule/'+CONTEXT_TYPE+'/'+CONTEXT_ID
    res = await fetch(url)
    res = await res.json()
  } catch(e){
    render(null, [], "Couldn't load this schedule.")
    return
  }
  if(res.error){ render(null, [], res.error); return }
  render(res.context_name, res.events||[], null)
}

function render(contextName, events, errMsg){
  var html = `
    <header><div class="hdr-inner">
      <img src="https://rolecall.hwtco.org/static/images/hwtc_logo_white.png" alt="Horizon West Theater Company"/>
      <h1>Rehearsal Schedule</h1>
      ${contextName?'<div class="sub">'+escH(contextName)+'</div>':''}
    </div></header>
    <div class="wrap">
    <div class="notice">This schedule reflects what's currently planned and is subject to change.</div>`

  if(errMsg){
    html += '<div class="card"><div class="empty-msg">'+escH(errMsg)+'</div></div>'
  } else if(!events.length){
    html += '<div class="card"><div class="empty-msg">No rehearsals scheduled yet — check back soon.</div></div>'
  } else {
    html += '<div class="card">'
    html += events.map(function(e){
      return '<div class="event-row">'
        + '<div class="event-date">'+fmtDate(e.event_date)+'</div>'
        + '<div class="event-name">'+escH(e.name||'Rehearsal')+'</div>'
        + '<div class="event-meta">'+(e.start_time?fmtTime(e.start_time)+(e.end_time?' – '+fmtTime(e.end_time):''):'')+(e.location?(e.start_time?' · ':'')+escH(e.location):'')+'</div>'
        + '</div>'
    }).join('')
    html += '</div>'
  }
  html += '</div>'
  document.getElementById('app').innerHTML = html
}

boot()
</script>
</body>
</html>
