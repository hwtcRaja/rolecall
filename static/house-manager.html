<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="robots" content="noindex"/>
<title>House Manager · HWTC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<style>
:root{--bg:#0d1f26;--panel:#13303a;--panel2:#173a46;--line:rgba(255,255,255,.12);--muted:rgba(255,255,255,.62);
  --in:#22c55e;--sold:#64748b;--open:#16728b;--held:#8b5cf6;--cart:#f59e0b;--bad:#ef4444;--gold:#f4b740}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',-apple-system,sans-serif;background:var(--bg);color:#fff;min-height:100vh}
button,input,select{font-family:inherit;font-size:14px}
a{color:#7dd3fc}
.top{display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.live{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:800;letter-spacing:.1em;color:#fca5a5}
.live i{width:9px;height:9px;border-radius:50%;background:#ef4444;animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.3}}
.top h1{font-size:17px;font-weight:800}
select,.inp{background:var(--panel2);color:#fff;border:1.5px solid var(--line);border-radius:9px;padding:8px 10px}
.btn{border:none;border-radius:9px;padding:9px 13px;font-weight:700;cursor:pointer;background:var(--panel2);color:#fff;text-decoration:none;display:inline-block}
.btn.p{background:#22a6c4;color:#06222a}
.btn.g{background:var(--in);color:#052e16}
.btn.r{background:transparent;border:1.5px solid rgba(239,68,68,.6);color:#fca5a5}
.clock{margin-left:auto;text-align:right;font-size:13px;color:var(--muted)}
.clock b{display:block;font-size:20px;color:#fff}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;padding:14px 18px}
.m{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.m .k{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.m .v{font-size:28px;font-weight:800;margin-top:2px}
.m .s{font-size:12px;color:var(--muted)}
.m.big{grid-column:span 2}
.bar{height:8px;border-radius:6px;background:rgba(255,255,255,.1);overflow:hidden;margin-top:8px}
.bar div{height:100%;background:var(--in);transition:width .4s}
.main{display:grid;grid-template-columns:1fr 380px;gap:14px;padding:0 18px 18px;min-height:0}
@media(max-width:980px){.main{grid-template-columns:1fr}.m.big{grid-column:span 1}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;min-height:0}
.map{height:62vh;min-height:320px}
.map svg{width:100%;height:100%;display:block}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px;align-items:center}
.switch{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-weight:700;color:#fff;user-select:none}
.switch input{position:absolute;opacity:0;width:0;height:0}
.switch .track{position:relative;width:38px;height:22px;border-radius:999px;background:#334155;transition:background .15s;flex-shrink:0}
.switch .knob{position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .15s}
.switch input:checked + .track{background:var(--in)}
.switch input:checked + .track .knob{transform:translateX(16px)}
.switch input:focus-visible + .track{outline:2px solid var(--gold);outline-offset:2px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:50%;display:inline-block}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tab{flex:1;border:none;border-radius:8px;padding:8px;font-weight:700;cursor:pointer;background:transparent;color:var(--muted)}
.tab.on{background:var(--panel2);color:#fff}
.list{max-height:56vh;overflow:auto}
.item{padding:9px 6px;border-top:1px solid var(--line);cursor:pointer;border-radius:6px}
.item:hover{background:rgba(255,255,255,.04)}
.item .n{font-weight:700}
.item .d{font-size:12px;color:var(--muted)}
.chip{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:10px;margin:3px 4px 0 0}
.c-in{background:rgba(34,197,94,.2);color:#86efac}.c-out{background:rgba(255,255,255,.1);color:#fff}
.c-bad{background:rgba(239,68,68,.2);color:#fca5a5}.c-warn{background:rgba(245,158,11,.2);color:#fcd34d}
.arr{display:flex;align-items:flex-end;gap:3px;height:40px;margin-top:8px}
.arr div{flex:1;background:#22a6c4;border-radius:2px 2px 0 0;min-height:2px}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);background:#0f2830;border-left:1px solid var(--line);z-index:30;padding:18px;overflow:auto;box-shadow:-10px 0 40px rgba(0,0,0,.4)}
.drawer h2{font-size:20px;margin-bottom:4px}
.kv{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid var(--line);font-size:14px}
.kv span:first-child{color:var(--muted)}
.seatbtn{border:none;border-radius:8px;padding:7px 10px;margin:4px 6px 0 0;font-weight:700;cursor:pointer}
.empty{color:var(--muted);font-size:13px;padding:10px 4px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="top">
  <span class="live"><i></i>LIVE</span>
  <h1 id="title">House Manager</h1>
  <select id="perf" onchange="choose(this.value)"></select>
  <button class="btn p" onclick="openScanner()">Scan tickets</button>
  <button class="btn g" onclick="openDoorSale()">Sell tickets</button>
  <button class="btn" id="vol-top-btn" onclick="openVolunteers()">Volunteers</button>
  <button class="btn" onclick="openSales()">Sales</button>
  <button class="btn" onclick="startVolSeats()" title="Hold unsold seats for ushers and volunteers">Seat volunteers</button>
  <button class="btn" onclick="openUsherLink()">Usher scanner link</button>
  <div class="clock" id="clock"></div>
</div>
<div id="root"><div class="empty" style="padding:30px 18px">Loading…</div></div>
<div id="drawer" class="drawer" style="display:none"></div>
<div id="overlay" style="display:none;position:fixed;inset:0;z-index:40;background:rgba(5,15,19,.92);align-items:center;justify-content:center;padding:18px"></div>

<script>
var PERF = '', DATA = null, TAB = 'waiting', FIND = '', TIMER = null, OPEN_TICKET = null, VOLS = null
var SELL = null   // door sale in progress: {info, tt, qty, seats:{id:label}, method, received}
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;') }
async function api(path, method, body){
  var r = await fetch(path, {method: method||'GET', credentials:'same-origin', headers: body?{'Content-Type':'application/json'}:{}, body: body?JSON.stringify(body):undefined})
  var d = null; try{ d = await r.json() }catch(e){}
  if(r.status===401 || r.status===403) return {authError:true, error:(d&&d.error)||'Please log in to RoleCall first.'}
  return d || {error:'Something went wrong.'}
}
function t12(t){ t=(t||'').slice(0,5); if(t.length<5) return ''; var h=+t.slice(0,2), m=t.slice(3,5); return ((h%12)||12)+(m!=='00'?':'+m:'')+(h>=12?' PM':' AM') }
function ago(s){ if(s==null) return ''; return s<60?'just now':s<3600?Math.round(s/60)+' min ago':Math.round(s/3600)+' hr ago' }
function fmtPerf(p){
  var dt = new Date(String(p.performance_date).slice(0,10)+'T12:00:00')
  return (p.is_today?'Today · ':'')+dt.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'})+(p.performance_time?' '+t12(p.performance_time):'')+' · '+p.production_name
}
async function boot(){
  var perfs = await api('/api/door/performances')
  if(perfs.authError){ document.getElementById('root').innerHTML = '<div class="empty" style="padding:30px 18px">'+esc(perfs.error)+' <a href="/">Log in</a>, then come back.</div>'; return }
  if(!Array.isArray(perfs) || !perfs.length){ document.getElementById('root').innerHTML = '<div class="empty" style="padding:30px 18px">No upcoming performances.</div>'; return }
  var q = new URLSearchParams(location.search).get('performance') || ''
  var pick = perfs.find(function(p){ return p.id===q }) || perfs.find(function(p){ return p.is_today }) || perfs[0]
  document.getElementById('perf').innerHTML = perfs.map(function(p){ return '<option value="'+p.id+'"'+(p.id===pick.id?' selected':'')+'>'+esc(fmtPerf(p))+'</option>' }).join('')
  choose(pick.id)
}
function choose(id){
  PERF = id; DATA = null; closeDrawer()
  history.replaceState(null, '', '?performance='+encodeURIComponent(id))
  clearInterval(TIMER); tick(); TIMER = setInterval(tick, 5000)
}
async function tick(){
  // volunteers who signed up for this performance's event(s)
  api('/api/house/'+PERF+'/volunteers').then(function(v){ if(v && !v.error){ VOLS = v; updateVolTopBtn(); drawVolunteers(); if(TAB==='vols' && DATA){ var l = document.getElementById('list'); if(l) l.innerHTML = listHTML() } } })
  var d = await api('/api/house/'+PERF)
  if(d.error){ if(!DATA) document.getElementById('root').innerHTML = '<div class="empty" style="padding:30px 18px">'+esc(d.error)+'</div>'; return }
  DATA = d; render()
  if(OPEN_TICKET) openTicket(OPEN_TICKET, true)
  if(PICK){
    // keep the picker live: drop picked seats that just got taken
    (d.seats||[]).forEach(function(s){ if(PICK.seats[s.id] && s.status !== 'open' && !(PICK.mode==='move' && s.status==='held')) delete PICK.seats[s.id] })
    var ae2 = document.activeElement
    if(!(ae2 && ae2.closest && ae2.closest('#drawer') && ae2.tagName === 'INPUT')) drawPick()
  }
  if(SELL && SELL.info && SELL.info.reserved){
    // drop picked seats someone else just bought
    (d.seats||[]).forEach(function(s){ if(SELL.seats[s.id] && s.status !== 'open') delete SELL.seats[s.id] })
    var ae = document.activeElement
    if(!(ae && ae.closest && ae.closest('#drawer') && ae.tagName === 'INPUT')) drawDoorSale()
  }
}
function clockHTML(p){
  var s = p.seconds_to_curtain, txt
  if(s == null) return ''
  if(s > 0){ var h = Math.floor(s/3600), m = Math.floor(s%3600/60); txt = (h?h+'h ':'')+m+'m to curtain' }
  else txt = 'Started '+Math.round(-s/60)+' min ago'
  return '<b>'+txt+'</b>'+(p.doors_time?'Doors '+t12(p.doors_time)+' · ':'')+'Curtain '+t12(p.time)
}
function render(){
  var d = DATA, p = d.performance, m = d.metrics
  document.getElementById('title').textContent = p.production_name
  document.getElementById('clock').innerHTML = clockHTML(p)
  var pct = m.sold ? Math.round(m.checked_in*100/m.sold) : 0
  var maxA = Math.max.apply(null, d.arrivals.concat([1]))
  var html = '<div class="metrics">'
    + '<div class="m big"><div class="k">Checked in</div><div class="v">'+m.checked_in+' <span style="font-size:16px;color:var(--muted)">of '+m.sold+' · '+pct+'%</span></div><div class="bar"><div style="width:'+pct+'%"></div></div>'
    + '<div class="arr" title="Arrivals per 5 minutes, last hour">'+d.arrivals.map(function(n){ return '<div style="height:'+Math.max(4, n*100/maxA)+'%" title="'+n+'"></div>' }).join('')+'</div><div class="s">Arrivals, last hour (5-min bars)</div></div>'
    + '<div class="m"><div class="k">Not here yet</div><div class="v">'+m.not_arrived+'</div><div class="s">'+m.parties_waiting+' of '+m.parties+' parties</div></div>'
    + (p.reserved ? '<div class="m"><div class="k">Open seats</div><div class="v">'+m.open_seats+'</div><div class="s">of '+m.capacity+'</div></div>' : '<div class="m"><div class="k">Capacity</div><div class="v">'+(m.capacity||'—')+'</div><div class="s">general admission</div></div>')
    + '<div class="m"><div class="k">Comps</div><div class="v">'+m.comps+'</div><div class="s">'+m.box_office+' box office</div></div>'
    // volunteers who signed up for roles tonight: tap to see and check them in
    + (VOLS && VOLS.volunteers && VOLS.volunteers.length
        ? '<div class="m" style="cursor:pointer" onclick="TAB=\'vols\';render();var l=document.getElementById(\'list\');if(l)l.scrollIntoView({behavior:\'smooth\'})"><div class="k">Volunteers here</div><div class="v">'
          + VOLS.volunteers.filter(function(v){ return v.status!=='waiting' }).length+' <span style="font-size:16px;color:var(--muted)">of '+VOLS.volunteers.length+'</span></div><div class="s">Tap to check them in</div></div>'
        : '')
    + (m.wheelchair_total ? '<div class="m"><div class="k">Wheelchair spaces</div><div class="v">'+m.wheelchair_sold+'<span style="font-size:16px;color:var(--muted)"> / '+m.wheelchair_total+'</span></div><div class="s">booked</div></div>' : '')
    + '</div><div class="main">'
  // map
  if(p.reserved && d.seats.length){
    var col = {'in':'var(--in)', sold:'var(--sold)', open:'var(--open)', held:'var(--held)', cart:'var(--cart)'}
    var xs = d.seats.map(function(s){ return +s.x }), ys = d.seats.map(function(s){ return +s.y })
    var minX=Math.min.apply(null,xs)-1, maxX=Math.max.apply(null,xs)+1, minY=Math.min.apply(null,ys)-(SHOW_LABELS?1.8:1), maxY=Math.max.apply(null,ys)+1
    var svg = '<svg viewBox="'+minX+' '+minY+' '+(maxX-minX)+' '+(maxY-minY)+'" preserveAspectRatio="xMidYMid meet">'
    d.seats.forEach(function(s){
      var tip = esc(s.seat_label||'')+(s.who?' — '+esc(s.who):'')+(s.status==='in'?' (here)':s.status==='sold'?' (not here yet)':s.status==='held'?' (held)':s.status==='cart'?' (in a cart)':' (open)')
      var click = s.ticket_id ? ' onclick="openTicket(\''+s.ticket_id+'\')" style="cursor:pointer"' : ''
      var ring = OPEN_TICKET && s.ticket_id===OPEN_TICKET ? ' stroke="var(--gold)" stroke-width="0.14"' : ''
      if(SELL && SELL.info && SELL.info.reserved && s.status==='open'){
        click = ' onclick="doorToggleSeat(\''+s.id+'\',\''+esc(s.seat_label||'').replace(/'/g,"\\'")+'\')" style="cursor:pointer"'
        if(SELL.seats[s.id]) ring = ' stroke="var(--gold)" stroke-width="0.18"'
      }
      svg += '<circle cx="'+s.x+'" cy="'+s.y+'" r="0.4" fill="'+col[s.status]+'"'+ring+click+'><title>'+tip+'</title></circle>'
      if(SHOW_LABELS && s.seat_label){
        var lab = String(s.seat_label), fs = lab.length <= 2 ? 0.32 : lab.length === 3 ? 0.27 : 0.22
        svg += '<text x="'+s.x+'" y="'+(+s.y + fs*0.36)+'" font-size="'+fs+'" text-anchor="middle" font-weight="700" fill="'+(s.status==='sold'||s.status==='in'?'#052e16':'#fff')+'" style="pointer-events:none"'
          + (lab.length > 4 ? ' textLength="0.72" lengthAdjust="spacingAndGlyphs"' : '') + '>'+esc(lab)+'</text>'
      }
    })
    // section names, above each section
    if(SHOW_LABELS){
      var secs = {}
      d.seats.forEach(function(s){ if(s.section){ var g = secs[s.section] = secs[s.section] || {x:0, n:0, minY:Infinity}; g.x += +s.x; g.n++; g.minY = Math.min(g.minY, +s.y) } })
      Object.keys(secs).forEach(function(k){
        var g = secs[k]
        svg += '<text x="'+(g.x/g.n)+'" y="'+(g.minY - 0.75)+'" font-size="0.5" text-anchor="middle" font-weight="800" fill="#e2e8f0" stroke="#0b1d23" stroke-width="0.18" paint-order="stroke" style="pointer-events:none">'+esc(k)+'</text>'
      })
    }
    svg += '</svg>'
    html += '<div class="panel"><div class="map">'+svg+'</div><div class="legend">'
      + [['in','Here'],['sold','Sold, not here yet'],['open','Open'],['held','Held by staff'],['cart','In a cart']].map(function(l){ return '<span><i style="background:'+col[l[0]]+'"></i>'+l[1]+'</span>' }).join('')
      + '<span>Click a seat for details</span>'
      + '<label class="switch" style="margin-left:auto"><input type="checkbox" '+(SHOW_LABELS?'checked':'')+' onchange="setShowLabels(this.checked)"/><span class="track"><span class="knob"></span></span>Seat &amp; section numbers</label></div></div>'
  } else {
    html += '<div class="panel"><div class="empty">General admission: no seat map. Use the lists to find people.</div></div>'
  }
  // side panel
  html += '<div class="panel"><div class="tabs">'
    + [['waiting','Not here ('+m.parties_waiting+')'],['vols','Volunteers'+(VOLS&&VOLS.volunteers.length?' ('+VOLS.volunteers.filter(function(v){ return v.status==='in' }).length+'/'+VOLS.volunteers.length+')':'')],['log','Scan log'],['find','Find']].map(function(t){ return '<button class="tab'+(TAB===t[0]?' on':'')+'" onclick="TAB=\''+t[0]+'\';render()">'+t[1]+'</button>' }).join('')
    + '</div><div class="list" id="list">'+listHTML()+'</div></div></div>'
  var keep = document.getElementById('find-q'); var hadFocus = keep && document.activeElement === keep
  document.getElementById('root').innerHTML = html
  if(hadFocus){ var f = document.getElementById('find-q'); if(f){ f.focus(); f.setSelectionRange(f.value.length, f.value.length) } }
}
function partyRow(p){
  return '<div class="item" onclick="openTicket(\''+p.tickets[0].id+'\')"><div class="n">'+esc(p.name||'Guest')+'</div>'
    + '<div class="d">'+esc(p.email||'')+(p.phone?' · '+esc(p.phone):'')+(p.channel!=='public'?' · '+esc(p.channel.replace('_',' ')):'')+'</div>'
    + '<div>'+p.tickets.map(function(t){ return '<span class="chip '+(t.checked_in?'c-in':'c-out')+'">'+(t.checked_in?'✓ ':'')+esc(t.seat_label)+'</span>' }).join('')+'</div></div>'
}
function listHTML(){
  var d = DATA
  if(TAB==='vols'){
    if(!VOLS) return '<div class="empty">Loading volunteers…</div>'
    if(!VOLS.events.length){
      // couldn't match an event: let them pick that day's sign-up event
      if(VOLS.choices && VOLS.choices.length) return '<div class="empty" style="text-align:left">Which sign-up event goes with this performance?</div>'
        + VOLS.choices.map(function(c){ return '<div class="item" onclick="linkVolEvent(\''+c.id+'\')"><div class="n">'+esc(c.name)+'</div><div class="d">'+esc(c.time||'')+' · tap to use this one</div></div>' }).join('')
      return '<div class="empty">No volunteer sign-up event found for this date. Volunteers sign up through an event\'s roles (Events → the event → Sign-ups). Create one on this date for the show, or link it to the production.</div>'
    }
    var lab = {in:'<span class="chip c-in">Signed in'+'</span>', done:'<span class="chip c-in">✓ Done</span>', waiting:'<span class="chip c-out">Not here</span>'}
    var groups = {}
    VOLS.volunteers.forEach(function(v){ (groups[v.role] = groups[v.role] || []).push(v) })
    // roles summary first: spots, signed up, here
    var rolesHTML = (VOLS.roles||[]).length ? '<div style="display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 10px">' + VOLS.roles.map(function(ro){
        var over = ro.slots && ro.filled > ro.slots, short = ro.slots && ro.filled < ro.slots
        var col = over ? 'var(--bad)' : short ? 'var(--cart)' : 'var(--in)'
        return '<span title="'+esc(ro.block||'')+'" style="font-size:12px;border:1px solid var(--line);border-left:4px solid '+col+';border-radius:8px;padding:5px 9px;background:var(--panel2)">'
          + '<strong>'+esc(ro.name)+'</strong> · '+ro.filled+(ro.slots?'/'+ro.slots:'')+' signed up'+(over?' (over)':short?' ('+(ro.slots-ro.filled)+' open)':'')+' · '+ro.here+' here</span>'
      }).join('') + '</div>' : ''
    if(!VOLS.volunteers.length) return rolesHTML + '<div class="empty">Nobody has signed up to volunteer for '+esc(VOLS.events.map(function(e){ return e.name }).join(', '))+' yet.</div>'
    return rolesHTML + Object.keys(groups).map(function(role){
      return '<div style="font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:10px 0 4px">'+esc(role)+'</div>'
        + groups[role].map(function(v){
          var btn = v.status==='in'
            ? '<button class="btn r" onclick="volAct(\''+v.rsvp_id+'\',\'signout\')">Sign out</button>'
            : v.status==='waiting' ? '<button class="btn g" onclick="volAct(\''+v.rsvp_id+'\',\'signin\')">Sign in</button>' : ''
          return '<div class="item" style="display:flex;align-items:center;gap:10px;cursor:default"><div style="flex:1;min-width:0">'
            + '<div class="n">'+esc(v.name)+' '+lab[v.status]+'</div>'
            + (VOLS.events.length > 1 && v.event_name ? '<div class="d" style="color:var(--muted)">'+esc(v.event_name)+'</div>' : '')
            + '<div class="d">'+(v.block?esc(v.block)+' · ':'')+(v.status==='in'&&v.since?'here '+esc(v.since)+' · ':'')+(v.hours?v.hours+' h logged':'')+'</div>'
            + '<div class="d">'+(v.phone?'<a href="tel:'+esc(v.phone)+'">'+esc(v.phone)+'</a>':'<span style="color:var(--bad)">no phone</span>')+' · '
            + (v.email?'<a href="mailto:'+esc(v.email)+'">'+esc(v.email)+'</a>':'<span style="color:var(--bad)">no email</span>')+'</div></div>'+btn+'</div>'
        }).join('')
    }).join('') + '<div class="empty" style="padding:10px 4px;text-align:left">Signing in starts their volunteer time for the event; signing out sends the hours for approval.</div>'
  }
  if(TAB==='waiting'){
    return d.not_arrived.length ? d.not_arrived.map(partyRow).join('') : '<div class="empty">Everyone is here. 🎉</div>'
  }
  if(TAB==='log'){
    var cls = {ok:'c-in', manual:'c-in', already:'c-warn', wrong_show:'c-warn', invalid:'c-bad', undo:'c-warn'}

    + '<div style="color:var(--muted);font-size:13px;margin-bottom:10px">'+(t.guardian_email?'<a href="mailto:'+esc(t.guardian_email)+'">'+esc(t.guardian_email)+'</a>':'')+(t.guardian_phone?' · <a href="tel:'+esc(t.guardian_phone)+'">'+esc(t.guardian_phone)+'</a>':'')+'</div>'
    + '<div class="kv"><span>Seat</span><strong>'+esc(t.seat_label||'GA')+(t.section?' · '+esc(t.section):'')+'</strong></div>'
    + '<div class="kv"><span>Ticket</span><strong>'+esc(t.type_name||'')+' · $'+((t.price_cents||0)/100).toFixed(2)+'</strong></div>'
    + '<div class="kv"><span>Code</span><strong style="font-family:monospace;letter-spacing:1px">'+esc(t.confirmation_code||'')+'</strong></div>'
    + '<div class="kv"><span>Status</span><strong style="color:'+(t.checked_in_at?'var(--in)':'#fff')+'">'+(t.checked_in_at?'Checked in'+(t.checked_in_by?' by '+esc(t.checked_in_by):''):'Not here yet')+'</strong></div>'
    + (t.sale_channel!=='public'?'<div class="kv"><span>Sold via</span><strong>'+esc(t.sale_channel.replace('_',' '))+'</strong></div>':'')
    + '<div style="margin-top:12px"><button class="btn '+(t.checked_in_at?'r':'g')+'" onclick="toggleIn(\''+t.id+'\','+(!!t.checked_in_at)+')">'+(t.checked_in_at?'Undo check-in':'Check in')+'</button></div>'
    + (t.party.length > 1 ? '<div style="margin-top:16px;font-size:13px;font-weight:700">Their party ('+t.party.length+')</div><div>'
        + t.party.map(function(x){ return '<button class="seatbtn" style="background:'+(x.checked_in?'var(--in)':'var(--panel2)')+';color:'+(x.checked_in?'#052e16':'#fff')+'" onclick="toggleIn(\''+x.id+'\','+x.checked_in+')">'+(x.checked_in?'✓ ':'')+esc(x.seat_label||'GA')+'</button>' }).join('')
        + '</div><div style="font-size:11.5px;color:var(--muted);margin-top:4px">Tap a seat to check it in or undo.</div>' : '')
    + '<div style="margin-top:16px;display:flex;gap:8px;flex-wrap:wrap">'
    + (t.tickets_url?'<a class="btn" href="'+esc(t.tickets_url)+'" target="_blank">Show their tickets</a>':'')
    + '<button class="btn" onclick="resend(\''+t.order_id+'\',\''+esc(t.guardian_email||'').replace(/'/g,"\\'")+'\')">Resend tickets email</button>'
    + (t.seat_label && DATA && (DATA.seats||[]).length ? '<button class="btn" onclick="startMove(\''+t.id+'\')">Move seats</button>' : '') + '</div>'
    + '<div style="margin-top:18px;font-size:13px;font-weight:700">Scan history</div>'
    + (t.scans.length ? t.scans.map(function(s){ return '<div class="kv"><span>'+esc(lab[s.result]||s.result)+'</span><span style="color:#fff">'+ago(s.ago_s)+(s.scanned_by?' · '+esc(s.scanned_by):'')+'</span></div>' }).join('') : '<div class="empty">Not scanned yet.</div>')
  dr.style.display = 'block'
  if(!quiet && DATA) render()
}
// ── Pick seats on a map: move a party, or seat volunteers ──
// PICK = {mode:'move'|'vol', need, tickets:[{id,label}], seats:{id:label}, zoom, name, notify}
var PICK = null
// map labels: seat numbers on each seat and section names (remembered on this device)
var SHOW_LABELS = (function(){ try{ return localStorage.getItem('hm_labels') === '1' }catch(e){ return false } })()
function setShowLabels(on){ SHOW_LABELS = on; try{ localStorage.setItem('hm_labels', on ? '1' : '0') }catch(e){} if(DATA) render() }
function pickMapSVG(){
  var seats = (DATA && DATA.seats) || []
  if(!seats.length) return '<div class="empty">Seat map not loaded yet.</div>'
  var xs = seats.map(function(s){ return +s.x }), ys = seats.map(function(s){ return +s.y })
  var minX=Math.min.apply(null,xs)-1, maxX=Math.max.apply(null,xs)+1, minY=Math.min.apply(null,ys)-1, maxY=Math.max.apply(null,ys)+1
  var col = {'in':'var(--sold)', sold:'var(--sold)', open:'var(--open)', held:'var(--held)', cart:'var(--cart)'}
  var moving = {}; (PICK.tickets||[]).forEach(function(t){ moving[t.id] = 1 })
  var svg = '<svg viewBox="'+minX+' '+minY+' '+(maxX-minX)+' '+(maxY-minY)+'" style="width:'+Math.round(100*PICK.zoom)+'%;display:block" preserveAspectRatio="xMidYMid meet">'
  seats.forEach(function(s){
    var mine = PICK.seats[s.id], own = s.ticket_id && moving[s.ticket_id]
    var ok = s.status==='open' || (PICK.mode==='move' && s.status==='held' && !s.volunteer) || own
    var lab = esc(s.seat_label||'').replace(/'/g,"\\'")
    svg += '<g'+(ok||mine?' onclick="pickToggle(\''+s.id+'\',\''+lab+'\')" style="cursor:pointer"':'')+'>'
      + '<circle cx="'+s.x+'" cy="'+s.y+'" r="0.44" fill="'+(mine?'var(--gold)':own?'#a78bfa':col[s.status]||'var(--sold)')+'" opacity="'+(ok||mine?1:0.4)+'"'+(s.volunteer?' stroke="#a78bfa" stroke-width="0.1"':'')+'/>'
      + (PICK.zoom >= 2 ? '<text x="'+s.x+'" y="'+(+s.y+0.13)+'" font-size="0.32" text-anchor="middle" fill="#fff" style="pointer-events:none">'+esc(s.seat_label||'')+'</text>' : '')
      + '<title>'+esc(s.seat_label||'')+(s.who?' — '+esc(s.who):'')+'</title></g>'
  })
  return '<div class="pick-map" style="overflow:auto;max-height:46vh;border:1px solid var(--line);border-radius:10px;background:#0b1d23;padding:6px;-webkit-overflow-scrolling:touch">'+svg+'</svg></div>'
}
function pickToggle(id, label){
  if(PICK.seats[id]) delete PICK.seats[id]
  else {
    if(PICK.mode==='move' && Object.keys(PICK.seats).length >= PICK.need){ alert('You\'ve picked '+PICK.need+' seat'+(PICK.need===1?'':'s')+'. Tap one to unpick it first.'); return }
    PICK.seats[id] = label
  }
  drawPick()
}
function pickZoom(z){ PICK.zoom = Math.max(1, Math.min(4, z)); drawPick() }
function drawPick(){
  var dr = document.getElementById('drawer'), keep = dr.scrollTop
  var box = document.querySelector('#drawer .pick-map'); var ms = box ? [box.scrollLeft, box.scrollTop] : null
  var picked = Object.keys(PICK.seats).map(function(k){ return PICK.seats[k] })
  var h = '<div style="display:flex;align-items:center;margin-bottom:10px"><h2 style="flex:1;margin:0">'+(PICK.mode==='move'?'Move seats':'Seat volunteers')+'</h2><button class="btn" onclick="PICK=null;closeDrawer()">✕ Cancel</button></div>'
  if(PICK.mode==='move'){
    h += '<div style="font-size:13px;color:var(--muted);margin-bottom:6px">Moving <strong style="color:#fff">'+esc(PICK.who)+'</strong>: '
      + PICK.tickets.map(function(t){ return '<label style="display:inline-flex;gap:4px;align-items:center;margin-right:8px"><input type="checkbox" '+(t.on?'checked':'')+' onchange="pickTicketOn(\''+t.id+'\',this.checked)"/>'+esc(t.label)+'</label>' }).join('')+'</div>'
      + '<div style="font-size:13px;margin-bottom:8px">Tap <strong>'+PICK.need+'</strong> open seat'+(PICK.need===1?'':'s')+' (blue). Picked: <strong style="color:var(--gold)">'+(picked.join(', ')||'none yet')+'</strong></div>'
  } else {
    var names = (VOLS && VOLS.volunteers ? VOLS.volunteers : []).map(function(v){ return v.name })
    h += '<div style="font-size:13px;color:var(--muted);margin-bottom:6px">Tap open seats (blue) to hold them tonight for ushers and volunteers. Held seats can\'t be sold online or at the door.</div>'
      + '<input class="inp" id="pk-name" list="pk-names" placeholder="Who (optional), e.g. Ushers or a name" value="'+esc(PICK.name||'')+'" oninput="PICK.name=this.value" style="width:100%;margin-bottom:8px"/>'
      + '<datalist id="pk-names">'+names.map(function(n){ return '<option value="'+esc(n)+'">' }).join('')+'</datalist>'
      + '<div style="font-size:13px;margin-bottom:8px">Picked: <strong style="color:var(--gold)">'+(picked.join(', ')||'none yet')+'</strong></div>'
  }
  h += '<div style="display:flex;gap:6px;margin-bottom:6px"><button class="btn" onclick="pickZoom(PICK.zoom-0.5)">−</button><button class="btn" onclick="pickZoom(PICK.zoom+0.5)">+</button>'
    + '<span style="font-size:12px;color:var(--muted);align-self:center">Zoom in to see seat numbers'+(PICK.mode==='move'?' · purple = their current seats':'')+'</span></div>'
    + pickMapSVG()
  if(PICK.mode==='move'){
    h += '<label style="display:flex;gap:8px;align-items:center;margin:12px 0;font-size:14px"><input type="checkbox" '+(PICK.notify?'checked':'')+' onchange="PICK.notify=this.checked"/> Email them their new seats</label>'
      + '<button class="btn g" style="width:100%;padding:14px" '+(picked.length===PICK.need&&PICK.need?'':'disabled')+' onclick="doMove()">Move '+PICK.need+' seat'+(PICK.need===1?'':'s')+'</button>'
  } else {
    h += '<button class="btn g" style="width:100%;padding:14px;margin-top:12px" '+(picked.length?'':'disabled')+' onclick="doVolHold()">Hold '+picked.length+' seat'+(picked.length===1?'':'s')+' for volunteers</button>'
    var mine = (DATA.seats||[]).filter(function(s){ return s.volunteer })
    if(mine.length) h += '<div style="margin-top:16px;font-weight:800">Held for volunteers tonight</div>'
      + mine.map(function(s){ return '<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);font-size:13px"><span>'+esc(s.seat_label)+' · '+esc((s.who||'').replace(/^Volunteer:\s*/,''))+'</span><button class="btn" style="padding:4px 10px" onclick="releaseVolSeat(\''+s.id+'\')">Release</button></div>' }).join('')
  }
  dr.innerHTML = h; dr.dataset.kind = 'pick'; dr.style.display = 'block'; dr.scrollTop = keep
  if(ms){ var nb = document.querySelector('#drawer .pick-map'); if(nb){ nb.scrollLeft = ms[0]; nb.scrollTop = ms[1] } }
}
function pickTicketOn(id, on){
  PICK.tickets.forEach(function(t){ if(t.id===id) t.on = on })
  PICK.need = PICK.tickets.filter(function(t){ return t.on }).length
  var keys = Object.keys(PICK.seats); while(keys.length > PICK.need){ delete PICK.seats[keys.pop()] }
  drawPick()
}
async function startMove(ticketId){
  var t = await api('/api/house/ticket/'+ticketId)
  if(t.error){ alert(t.error); return }
  var party = (t.party && t.party.length ? t.party : [{id: t.id, seat_label: t.seat_label}])
  OPEN_TICKET = null; VOL_DRAWER = false; SALES_DRAWER = false; SELL = null
  PICK = {mode:'move', who: t.guardian_name || 'Guest', tickets: party.map(function(p){ return {id:p.id, label:p.seat_label||'GA', on:true} }), seats:{}, zoom:1.5, notify:true}
  PICK.need = PICK.tickets.length
  drawPick()
}
function startVolSeats(){
  OPEN_TICKET = null; VOL_DRAWER = false; SALES_DRAWER = false; SELL = null
  PICK = {mode:'vol', seats:{}, zoom:1.5, name:''}
  drawPick()
}
async function doMove(){
  var on = PICK.tickets.filter(function(t){ return t.on }), to = Object.keys(PICK.seats)
  var body = {moves: on.map(function(t, i){ return {ticket_id: t.id, to_seat_id: to[i]} }), notify: PICK.notify}
  var r = await api('/api/house/'+PERF+'/move-seats','POST', body)
  if(r.held && confirm(r.error)){ body.use_held = true; r = await api('/api/house/'+PERF+'/move-seats','POST', body) }
  if(r.error){ alert(r.error); return }
  alert('Moved: '+r.moved.map(function(c){ return c.from+' → '+c.to }).join(', ')+(r.emailed?'\nThey were emailed their new seats.':''))
  PICK = null; closeDrawer(); tick()
}
async function doVolHold(){
  var r = await api('/api/house/'+PERF+'/volunteer-seats','POST',{seat_ids: Object.keys(PICK.seats), name: PICK.name})
  if(r.error){ alert(r.error); return }
  if(r.skipped && r.skipped.length) alert('Held '+r.held.length+'. Skipped: '+r.skipped.join(', '))
  PICK.seats = {}; await tick(); drawPick()
}
async function releaseVolSeat(id){
  var r = await api('/api/house/'+PERF+'/volunteer-seats','DELETE',{seat_ids:[id]})
  if(r.error){ alert(r.error); return }
  await tick(); if(PICK) drawPick()
}

function closeDrawer(){ OPEN_TICKET = null; SALES_DRAWER = false; PICK = null; var d = document.getElementById('drawer'); if(d){ d.style.display = 'none'; delete d.dataset.kind } if(DATA) render() }
async function toggleIn(id, isIn){
  var r = await api('/api/door/checkin-ticket','POST',{ticket_id:id, undo:!!isIn})
  if(r.error){ alert(r.error); return }
  tick()
}
async function resend(oid, email){
  var to = prompt('Send their tickets to:', email || ''); if(to === null) return
  var r = await api('/api/ticket-orders/'+oid+'/resend','POST',{email: to.trim()})
  alert(r.error ? r.error : 'Tickets sent to '+(to.trim()||email)+'.')
}
// ── Scan from the house manager screen (same check-in as the door) ──
var SC = {stream:null, on:false, last:'', at:0, busy:false}
function overlay(html){ var o = document.getElementById('overlay'); o.innerHTML = html; o.style.display = html ? 'flex' : 'none' }
async function openScanner(){
  overlay('<div style="width:min(460px,100%)"><div style="display:flex;align-items:center;margin-bottom:10px"><div style="font-weight:800;font-size:17px;flex:1">Scan tickets</div><button class="btn" onclick="closeScanner()">✕ Close</button></div>'
    + '<div style="position:relative;background:#000;border-radius:14px;overflow:hidden;aspect-ratio:1/1"><video id="sc-v" playsinline muted style="width:100%;height:100%;object-fit:cover"></video><canvas id="sc-c" style="display:none"></canvas>'
    + '<div style="position:absolute;inset:16%;border:3px solid rgba(244,183,64,.8);border-radius:14px;pointer-events:none"></div></div>'
    + '<div id="sc-res" style="margin-top:12px;min-height:60px"></div></div>')
  try{
    SC.stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}}, audio:false})
    var v = document.getElementById('sc-v'); v.srcObject = SC.stream; await v.play(); SC.on = true; requestAnimationFrame(scLoop)
  }catch(e){ document.getElementById('sc-res').innerHTML = '<div class="empty">Camera unavailable on this device. Use Find to check people in by name.</div>' }
}
function closeScanner(){ SC.on = false; if(SC.stream) SC.stream.getTracks().forEach(function(t){ t.stop() }); SC.stream = null; overlay(''); tick() }
function scLoop(){
  if(!SC.on) return
  var v = document.getElementById('sc-v'), c = document.getElementById('sc-c')
  if(v && c && v.readyState === v.HAVE_ENOUGH_DATA && !SC.busy){
    c.width = v.videoWidth; c.height = v.videoHeight
    var ctx = c.getContext('2d'); ctx.drawImage(v, 0, 0, c.width, c.height)
    var code = jsQR(ctx.getImageData(0,0,c.width,c.height).data, c.width, c.height)
    if(code && code.data && (code.data !== SC.last || Date.now() - SC.at > 4000)){ SC.last = code.data; SC.at = Date.now(); scScan(code.data) }
  }
  requestAnimationFrame(scLoop)
}
async function scScan(code){
  SC.busy = true
  var r = await api('/api/door/scan','POST',{performance_id: PERF, code: code})
  var bg = r.result==='ok' ? 'var(--in)' : (r.result==='already'||r.result==='wrong_show') ? 'var(--cart)' : 'var(--bad)'
  var head = r.result==='ok' ? '✓ Checked in' : r.result==='already' ? 'Already in' : r.result==='wrong_show' ? 'Wrong date' : '✕ Not valid'
  document.getElementById('sc-res').innerHTML = '<div style="background:'+bg+';color:#06150b;border-radius:12px;padding:12px 14px">'
    + '<div style="font-size:20px;font-weight:800">'+head+'</div>'
    + '<div style="font-weight:700">'+esc(r.name||'')+(r.seat_label?' · '+esc(r.seat_label):'')+'</div>'
    + '<div style="font-size:13px">'+esc(r.message||r.error||'')+'</div>'
    + (r.rush_note ? '<div style="font-size:13px;font-weight:800;margin-top:4px">⚡ '+esc(r.rush_note)+'</div>' : '')
    + (r.ticket_id ? '<button class="btn" style="margin-top:8px;background:rgba(0,0,0,.2);color:#fff" onclick="closeScanner();openTicket(\''+r.ticket_id+'\')">Open their details</button>' : '')
    + '</div>'
  setTimeout(function(){ SC.busy = false }, 1200)
}

// ── Usher link: ushers scan at the door with no RoleCall account ──
async function openUsherLink(){
  var r = await api('/api/house/usher-link')
  if(r.error){ alert(r.error); return }

    + '<img src="/api/house/usher-link/qr.png?t='+Date.now()+'" alt="QR code for the usher scanner link" style="width:220px;height:220px;background:#fff;border-radius:10px;padding:6px"/>'
    + '<input class="inp" readonly value="'+esc(r.url)+'" onclick="this.select()" style="width:100%;margin-top:12px;font-size:12px"/>'
    + '<div style="display:flex;gap:8px;margin-top:10px"><button class="btn" style="flex:1" onclick="navigator.clipboard.writeText(\''+esc(r.url)+'\');this.textContent=\'Copied!\'">Copy link</button>'
    + '<button class="btn r" style="flex:1" onclick="newUsherLink()">Make a new link</button></div>'

    + '<button class="btn" style="margin-top:12px" onclick="overlay(\'\')">Done</button></div>')
}
async function newUsherLink(){
  if(!confirm('Make a new usher link? Ushers on the old link will need the new one.')) return

document.addEventListener('keydown', function(e){ if(e.key==='Escape'){ if(document.getElementById('overlay').style.display==='flex'){ if(SC.on) closeScanner(); else overlay('') } else closeDrawer() } })
boot();

// Handheld USB / Bluetooth scanners (e.g. NETUM NT-1228BL) act like a
// keyboard: they type the ticket code very fast and press Enter. Catch
// that anywhere on the page (except while typing in a search box).
(function(){
  var buf = '', last = 0
  document.addEventListener('keydown', function(e){
    var t = e.target
    if(t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return
    var now = Date.now()
    if(now - last > 100) buf = ''        // people type slower than scanners
    last = now
    if(e.key === 'Enter'){
      if(buf.length >= 4){ e.preventDefault(); var code = buf; buf = ''; onHandheldScan(code) }
      buf = ''
      return
    }
    if(e.key && e.key.length === 1) buf += e.key
  })
})()
async function onHandheldScan(code){
  if(!PERF) return
  var r = await api('/api/door/scan','POST',{performance_id: PERF, code: code})
  var ok = r.result === 'ok', warn = r.result === 'already' || r.result === 'wrong_show'
  var b = document.getElementById('hh-banner')
  if(!b){ b = document.createElement('div'); b.id = 'hh-banner'; b.style.cssText = 'position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:99;border-radius:12px;padding:12px 18px;min-width:280px;box-shadow:0 10px 30px rgba(0,0,0,.4);font-family:inherit'; document.body.appendChild(b) }
  b.style.background = ok ? 'var(--in)' : warn ? 'var(--cart)' : 'var(--bad)'; b.style.color = '#06150b'
  b.innerHTML = '<div style="font-size:18px;font-weight:800">'+(ok ? '✓ Checked in' : r.result === 'already' ? 'Already in' : r.result === 'wrong_show' ? 'Wrong date' : '✕ Not valid')+'</div>'
    + '<div style="font-weight:700">'+esc(r.name||'')+(r.seat_label ? ' · '+esc(r.seat_label) : '')+'</div><div style="font-size:13px">'+esc(r.message||r.error||'')+'</div>'
  b.style.display = ''
  clearTimeout(window._hhT); window._hhT = setTimeout(function(){ b.style.display = 'none' }, 4000)
  try{ tick() }catch(e){}
}
</script>
