<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>HWTC Lobby Display</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg-base:#09151e;
  --hdr-grad-1:#0d3d4d;
  --hdr-grad-2:#145466;
  --hdr-grad-3:#1b708d;
  --hdr-border:#1b708d;
  --accent:#1b708d;
  --accent-bright:#4ade80;
  --accent-warm:#fbbf24;
  --sched-bg:#0d1e2e;
  --sched-border:#1b3a4d;
  --sched-hdr-bg:#0d3d4d;
}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg-base)}
body{
  font-family:'DM Sans',system-ui,sans-serif;
  color:#fff;
  display:grid;
  grid-template-rows:130px 1fr;
  grid-template-columns:1fr 380px;
  grid-template-areas:
    "header header"
    "carousel schedule";
  height:100vh;
  position:relative;
}

/* ── HEADER ── */
header{
  grid-area:header;
  background:linear-gradient(135deg,var(--hdr-grad-1) 0%,var(--hdr-grad-2) 60%,var(--hdr-grad-3) 100%);
  background-size:cover;background-position:center;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 40px;
  border-bottom:3px solid var(--hdr-border);
  position:relative;z-index:10;
}
header.has-banner::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(90deg,rgba(0,0,0,0.55) 0%,rgba(0,0,0,0.15) 55%,rgba(0,0,0,0.45) 100%);
  z-index:-1;
}
.hdr-logo{display:flex;align-items:center;gap:16px}
.hdr-logo img{height:58px;filter:brightness(0) invert(1)}
.hdr-title{font-size:30px;font-weight:800;letter-spacing:-0.5px}
.hdr-sub{font-size:13px;color:rgba(255,255,255,0.6);margin-top:2px}
.hdr-clock{text-align:right}
.hdr-time{font-size:44px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-1px;line-height:1}
.hdr-date{font-size:14px;color:rgba(255,255,255,0.65);margin-top:4px}

/* ── CAROUSEL ── */
#carousel-area{
  grid-area:carousel;
  position:relative;overflow:hidden;background:#000;
}
#carousel-area .slide{
  position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
  opacity:0;transition:opacity 1s ease;
}
#carousel-area .slide.active{opacity:1}
#carousel-area .slide img{
  width:100%;height:100%;object-fit:cover;
}
#carousel-area .slide .slide-caption{
  position:absolute;bottom:0;left:0;right:0;
  background:linear-gradient(transparent,rgba(0,0,0,0.7));
  padding:32px 32px 20px;
  font-size:18px;font-weight:600;color:#fff;
}
#carousel-dots{
  position:absolute;bottom:16px;right:20px;
  display:flex;gap:6px;z-index:5;
}
#carousel-dots span{
  width:8px;height:8px;border-radius:50%;
  background:rgba(255,255,255,0.35);
  transition:background 0.3s;cursor:pointer;
}
#carousel-dots span.active{background:#fff}

/* Empty carousel state */
#carousel-empty{
  display:none;position:absolute;inset:0;
  align-items:center;justify-content:center;flex-direction:column;gap:16px;
  background:linear-gradient(135deg,#0d2233,#0d3d4d);
  color:rgba(255,255,255,0.4);font-size:18px;text-align:center;
}
#carousel-empty.show{display:flex}
.empty-logo{font-size:72px;font-weight:900;color:rgba(255,255,255,0.08);letter-spacing:-3px}

/* ── SCHEDULE SIDEBAR ── */
#schedule-area{
  grid-area:schedule;
  background:var(--sched-bg);
  background-size:cover;background-position:center;background-repeat:no-repeat;
  border-left:2px solid var(--sched-border);
  display:flex;flex-direction:column;overflow:hidden;
  position:relative;
}
#schedule-area.has-bg::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(0,0,0,0.35) 0%,rgba(0,0,0,0.55) 100%);
  z-index:0;pointer-events:none;
}
#schedule-area.has-bg .schedule-header,
#schedule-area.has-bg #events-list{
  position:relative;z-index:1;
}
#schedule-area.has-bg .schedule-header{
  background:rgba(0,0,0,0.3);
}
.schedule-header{
  background:var(--sched-hdr-bg);
  padding:16px 20px;
  font-size:14px;font-weight:800;text-transform:uppercase;letter-spacing:1.2px;
  border-bottom:2px solid var(--hdr-border);display:flex;align-items:center;gap:8px;
}
.schedule-header::before{content:'';width:10px;height:10px;border-radius:50%;background:var(--accent-bright);animation:blink 2s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.3}}
#events-list{flex:1;overflow-y:auto;padding:12px 0}
#events-list::-webkit-scrollbar{width:4px}
#events-list::-webkit-scrollbar-track{background:transparent}
#events-list::-webkit-scrollbar-thumb{background:var(--sched-border);border-radius:2px}
.event-item{
  padding:12px 20px;border-bottom:1px solid rgba(255,255,255,0.06);
  transition:background 0.2s;
}
.event-item:hover{background:rgba(255,255,255,0.04)}
.event-item.today .ei-day{color:var(--accent-bright)}
.event-item.today{
  border-left:3px solid var(--accent-bright);
  background:rgba(255,255,255,0.03);
  position:relative;
  animation:event-today-glow 2.4s ease-in-out infinite;
}
@keyframes event-today-glow{
  0%,100%{box-shadow:inset 0 0 0 0 rgba(255,255,255,0)}
  50%{box-shadow:inset 3px 0 12px -2px var(--accent-bright)}
}
.event-item.today .ei-name::after{
  content:'\2728';
  display:inline-block;
  margin-left:6px;
  font-size:13px;
  animation:today-star-spin 3s ease-in-out infinite;
}
.event-item.soon .ei-day{color:var(--accent-warm)}
.event-item.soon{border-left:3px solid var(--accent-warm)}
.ei-day{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.8px;color:#64a4b8;margin-bottom:3px}
.ei-name{font-size:14px;font-weight:700;line-height:1.3;margin-bottom:2px}
.ei-meta{font-size:11px;color:rgba(255,255,255,0.45);display:flex;flex-wrap:wrap;gap:6px}
.ei-meta span{display:flex;align-items:center;gap:3px}
.no-events{
  padding:40px 20px;text-align:center;color:rgba(255,255,255,0.3);
  font-size:13px;line-height:1.6;
}

/* ── ADMIN PANEL (hidden, toggle with ?manage) ── */
#admin-panel{
  display:none;position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:100;
  align-items:center;justify-content:center;
}
#admin-panel.show{display:flex}
.admin-box{
  background:#132030;border:1px solid #1b708d;border-radius:16px;
  width:600px;max-width:95vw;max-height:85vh;overflow-y:auto;padding:28px;
}
.admin-box h2{font-size:20px;font-weight:800;margin-bottom:20px;color:#4ade80}
.admin-section{margin-bottom:24px}
.admin-section h3{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:0.8px;color:#64a4b8;margin-bottom:12px}
.admin-img-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.admin-img-thumb{
  position:relative;aspect-ratio:16/9;border-radius:8px;overflow:hidden;
  background:#0d2233;border:1px solid #1b3a4d;
}
.admin-img-thumb img{width:100%;height:100%;object-fit:cover}
.admin-img-thumb .del-btn{
  position:absolute;top:4px;right:4px;
  background:rgba(220,38,38,0.85);color:#fff;border:none;border-radius:4px;
  padding:2px 6px;font-size:11px;cursor:pointer;font-weight:700;
}
.admin-img-caption{
  width:100%;padding:4px 6px;background:rgba(0,0,0,0.5);
  font-size:11px;color:rgba(255,255,255,0.7);border:none;outline:none;
}
.upload-zone{
  border:2px dashed #1b708d;border-radius:10px;padding:24px;text-align:center;
  cursor:pointer;color:rgba(255,255,255,0.5);font-size:14px;transition:all 0.2s;
}
.upload-zone:hover{border-color:#4ade80;color:#4ade80;background:rgba(74,222,128,0.05)}
.btn-save{
  background:#145466;color:#fff;border:none;border-radius:8px;
  padding:10px 24px;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;
}
.btn-save:hover{background:#1b708d}
.btn-close{
  background:transparent;color:rgba(255,255,255,0.5);border:1px solid rgba(255,255,255,0.2);
  border-radius:8px;padding:10px 24px;font-family:inherit;font-size:14px;cursor:pointer;margin-left:8px;
}
.status-msg{font-size:13px;color:#4ade80;margin-top:8px;min-height:18px}

/* ── MISC ── */
.hidden{display:none!important}

/* ── THEMES ── */
body.theme-winter{
  --bg-base:#0a1628; --hdr-grad-1:#0c2540; --hdr-grad-2:#143a5c; --hdr-grad-3:#1e5a8a;
  --hdr-border:#2d7ab5; --accent:#2d7ab5; --accent-bright:#7dd3fc; --accent-warm:#e0f2fe;
  --sched-bg:#0a1c30; --sched-border:#1e3a52; --sched-hdr-bg:#0c2540;
}
body.theme-fall{
  --bg-base:#1f1108; --hdr-grad-1:#3d1f0d; --hdr-grad-2:#8a4a1f; --hdr-grad-3:#c2702f;
  --hdr-border:#d4843f; --accent:#d4843f; --accent-bright:#fbbf24; --accent-warm:#f59e0b;
  --sched-bg:#1f1108; --sched-border:#4a2a14; --sched-hdr-bg:#3d1f0d;
}
body.theme-halloween{
  --bg-base:#0d0814; --hdr-grad-1:#1a0d2e; --hdr-grad-2:#3d1a5c; --hdr-grad-3:#6b2d8a;
  --hdr-border:#a855f7; --accent:#a855f7; --accent-bright:#fb923c; --accent-warm:#f97316;
  --sched-bg:#0d0814; --sched-border:#2d1a44; --sched-hdr-bg:#1a0d2e;
}
body.theme-spring{
  --bg-base:#0a1f14; --hdr-grad-1:#0d3322; --hdr-grad-2:#15573a; --hdr-grad-3:#2d8a5f;
  --hdr-border:#4ade80; --accent:#4ade80; --accent-bright:#fbcfe8; --accent-warm:#fde047;
  --sched-bg:#0a1f14; --sched-border:#1a4530; --sched-hdr-bg:#0d3322;
}
body.theme-summer{
  --bg-base:#0c1e2e; --hdr-grad-1:#0e3a4d; --hdr-grad-2:#1670875; --hdr-grad-3:#0ea5e9;
  --hdr-border:#38bdf8; --accent:#38bdf8; --accent-bright:#fde047; --accent-warm:#fb923c;
  --sched-bg:#0c1e2e; --sched-border:#1a3a4d; --sched-hdr-bg:#0e3a4d;
}
body.theme-show{
  --bg-base:#1a0a14; --hdr-grad-1:#2e0d22; --hdr-grad-2:#5c1540; --hdr-grad-3:#a8245f;
  --hdr-border:#d4af37; --accent:#d4af37; --accent-bright:#f4d35e; --accent-warm:#fff4c2;
  --sched-bg:#1a0a14; --sched-border:#3a1a2e; --sched-hdr-bg:#2e0d22;
}
body.theme-seuss{
  --bg-base:#0a1230; --hdr-grad-1:#e8344f; --hdr-grad-2:#e8344f; --hdr-grad-3:#c8102e;
  --hdr-border:#fcd34d; --accent:#fcd34d; --accent-bright:#fde047; --accent-warm:#60a5fa;
  --sched-bg:#0a1230; --sched-border:#1e3a6f; --sched-hdr-bg:#0d6e3f;
  --seuss-yellow:#fcd34d; --seuss-blue:#3b82f6; --seuss-green:#16a34a; --seuss-red:#e8344f; --seuss-purple:#9333ea;
}
body.theme-jungle{
  --bg-base:#0a1f0e; --hdr-grad-1:#1a3d0f; --hdr-grad-2:#2d6b1a; --hdr-grad-3:#3d8a22;
  --hdr-border:#86c936; --accent:#86c936; --accent-bright:#b5f542; --accent-warm:#fbbf24;
  --sched-bg:#061408; --sched-border:#1a4010; --sched-hdr-bg:#1a3d0f;
}
body.theme-jungle header{ background:linear-gradient(135deg,#1a3d0f,#2d6b1a); }
body.theme-jungle #schedule-area{ background:var(--sched-bg);display:flex;flex-direction:column;padding:0;overflow:hidden }
body.theme-jungle #schedule-area .schedule-header{ display:none }
body.theme-jungle #events-list{ display:none !important }
body.theme-jungle #jungle-img-panel{ display:flex }
body.theme-jungle .schedule-header{
  background:transparent;border-bottom:none;justify-content:center;
}

/* ── JUNGLE SIGNPOST ── */
body.theme-jungle #schedule-area{ background:var(--sched-bg);display:flex;flex-direction:column;padding:0;overflow:hidden }
body.theme-jungle #schedule-area .schedule-header{ display:none }
body.theme-jungle #events-list{ display:none !important }
body.theme-jungle #jungle-img-panel{ display:flex }

/* Bamboo pole */
.jungle-signpost-wrap{
  flex:1;display:flex;flex-direction:column;align-items:center;
  padding:8px 0 20px;position:relative;overflow-y:auto;
}
.jungle-pole{
  position:absolute;top:0;bottom:20px;left:50%;width:14px;
  transform:translateX(-50%);
  background:repeating-linear-gradient(
    180deg,
    #8fbe3a 0px, #6a9c28 28px,
    #4a7a18 30px, #6a9c28 32px
  );
  border-radius:4px;z-index:0;
  box-shadow:inset -3px 0 6px rgba(0,0,0,0.3), 2px 0 4px rgba(0,0,0,0.2);
}
.jungle-pole::before{
  content:'';position:absolute;top:0;left:2px;width:4px;height:100%;
  background:rgba(255,255,255,0.15);border-radius:2px;
}

/* Leaf-tipped planks */
.jungle-plank{
  position:relative;z-index:1;
  width:82%;max-width:275px;
  margin:8px 0;padding:10px 16px 10px 20px;
  border-radius:6px 20px 20px 6px;
  border:2px solid rgba(0,0,0,0.35);
  font-family:'DM Sans',system-ui,sans-serif;
  color:#1a1a1a;
  box-shadow:3px 4px 0 rgba(0,0,0,0.3);
}
.jungle-plank:nth-child(odd){ transform:rotate(-2deg); border-radius:20px 6px 6px 20px; }
.jungle-plank:nth-child(even){ transform:rotate(1.5deg); }
.jungle-plank::before{
  content:'🌿';position:absolute;
  right:-10px;top:50%;transform:translateY(-50%);
  font-size:20px;
}
.jungle-plank:nth-child(odd)::before{
  content:'🌿';left:-10px;right:auto;transform:translateY(-50%) scaleX(-1);
}
.jungle-plank.today{
  box-shadow:3px 4px 0 rgba(0,0,0,0.3), 0 0 0 3px #fbbf24, 0 0 20px 4px rgba(251,191,36,0.4);
  animation:jungle-today-bounce 2.5s ease-in-out infinite;z-index:2;
}
@keyframes jungle-today-bounce{
  0%,100%{transform:rotate(-2deg) translateY(0) scale(1)}
  50%{transform:rotate(-2deg) translateY(-4px) scale(1.03)}
}
.jungle-plank.today:nth-child(even){
  animation-name:jungle-today-bounce-even;
}
@keyframes jungle-today-bounce-even{
  0%,100%{transform:rotate(1.5deg) translateY(0) scale(1)}
  50%{transform:rotate(1.5deg) translateY(-4px) scale(1.03)}
}
.jungle-plank .ei-day{ font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:0.6px;color:#1a1a1a;opacity:0.75;margin-bottom:2px }
.jungle-plank .ei-name{ font-size:15px;font-weight:800;line-height:1.2;margin-bottom:3px;color:#1a1a1a }
.jungle-plank .ei-meta{ font-size:11px;font-weight:600;color:#1a1a1a;opacity:0.8;display:flex;gap:8px;flex-wrap:wrap }
.jungle-today-star{
  position:absolute;top:-10px;right:-6px;font-size:20px;
  animation:today-star-spin 3s ease-in-out infinite;
  filter:drop-shadow(0 2px 3px rgba(0,0,0,0.3));
}
body.theme-seuss .hdr-title{ font-family:'Baloo 2','DM Sans',system-ui,sans-serif; letter-spacing:0 }

/* ── SIGNPOST EVENTS (Seuss theme schedule) ── */
body.theme-seuss #schedule-area{ background:var(--sched-bg) }
body.theme-seuss .schedule-header{
  background:transparent;border-bottom:none;justify-content:center;
  font-family:'Baloo 2','DM Sans',system-ui,sans-serif;font-size:16px;
}
body.theme-seuss .schedule-header::before{ display:none }
.signpost-wrap{
  flex:1;display:flex;flex-direction:column;align-items:center;
  padding:8px 0 20px;position:relative;overflow-y:auto;
}
.signpost-pole{
  position:absolute;top:0;bottom:20px;left:50%;width:10px;
  transform:translateX(-50%);
  background:linear-gradient(90deg,#8a5a2e,#b07840,#8a5a2e);
  border-radius:3px;z-index:0;
}
.signpost-plank{
  position:relative;z-index:1;
  width:84%;max-width:280px;
  margin:7px 0;padding:10px 16px;
  border-radius:4px 14px 14px 4px;
  border:3px solid #1a1a1a;
  font-family:'Baloo 2','DM Sans',system-ui,sans-serif;
  color:#1a1a1a;
  box-shadow:3px 4px 0 rgba(0,0,0,0.25);
}
.signpost-plank:nth-child(odd){ transform:rotate(-2.5deg); border-radius:14px 4px 4px 14px; }
.signpost-plank:nth-child(even){ transform:rotate(2deg); }
.signpost-plank.today{
  box-shadow:3px 4px 0 rgba(0,0,0,0.25), 0 0 0 3px #fde047, 0 0 24px 4px rgba(253,224,71,0.45);
  animation:plank-today-bounce 2.2s ease-in-out infinite;
  z-index:2;
}
@keyframes plank-today-bounce{
  0%,100%{transform:rotate(-2.5deg) translateY(0) scale(1)}
  50%{transform:rotate(-2.5deg) translateY(-4px) scale(1.04)}
}
.signpost-plank.today:nth-child(even){
  animation-name:plank-today-bounce-even;
}
@keyframes plank-today-bounce-even{
  0%,100%{transform:rotate(2deg) translateY(0) scale(1)}
  50%{transform:rotate(2deg) translateY(-4px) scale(1.04)}
}
.today-star{
  position:absolute;top:-10px;right:-8px;
  font-size:22px;
  animation:today-star-spin 3s ease-in-out infinite;
  filter:drop-shadow(0 2px 3px rgba(0,0,0,0.3));
}
@keyframes today-star-spin{
  0%,100%{transform:rotate(-12deg) scale(1)}
  50%{transform:rotate(12deg) scale(1.15)}
}
.signpost-plank .ei-day{ font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:0.6px;color:#1a1a1a;opacity:0.7;margin-bottom:2px }
.signpost-plank .ei-name{ font-size:15px;font-weight:800;line-height:1.2;margin-bottom:3px;color:#1a1a1a }
.signpost-plank .ei-meta{ font-size:11px;font-weight:600;color:#1a1a1a;opacity:0.8;display:flex;gap:8px;flex-wrap:wrap }

/* ── DECORATION LAYER ── */
#theme-decorations{
  position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden;
}
.deco-item{
  position:absolute;top:-40px;
  animation:deco-fall linear infinite;
  opacity:0.85;
}
@keyframes deco-fall{
  0%{transform:translateY(-5vh) translateX(0) rotate(0deg)}
  100%{transform:translateY(105vh) translateX(var(--drift,30px)) rotate(360deg)}
}
.deco-sparkle{
  position:absolute;
  animation:deco-twinkle ease-in-out infinite;
}
@keyframes deco-twinkle{
  0%,100%{opacity:0;transform:scale(0.5)}
  50%{opacity:1;transform:scale(1)}
}
.theme-badge{
  position:absolute;top:14px;right:14px;z-index:60;
  background:rgba(0,0,0,0.4);backdrop-filter:blur(4px);
  padding:4px 12px;border-radius:20px;
  font-size:11px;font-weight:700;color:rgba(255,255,255,0.7);
  letter-spacing:0.5px;display:none;
}


/* ── LOBBY JUNGLE: Hanging signboard ── */
#jungle-img-panel {
  display: none;
  flex: 1;
  position: relative;
  overflow: hidden;
  background: linear-gradient(180deg, #0a2a0e 0%, #0d1f08 100%);
}
body.theme-jungle #jungle-img-panel { display: block }
body.theme-jungle #events-list { display: none !important }
body.theme-jungle .schedule-header { display: none }

.sp-img-wrap {
  position: absolute;
  bottom: 0;
  right: -5%;
  width: 105%;
  height: 100%;
  display: flex;
  align-items: flex-end;
  justify-content: center;
}
.sp-img-wrap img {
  width: 100%;
  max-height: 100%;
  object-fit: contain;
  object-position: bottom center;
  filter: drop-shadow(0 4px 24px rgba(0,0,0,0.7));
}
/* Plank text overlays — positioned as % of image */
.sp-planks {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  pointer-events: none;
}
.sp-plank {
  position: absolute;
  /* horizontally: board is ~32%-93% of image width, centered at ~62% */
  left: 37%;
  width: 55%;
  text-align: center;
  transform: translateY(-50%);
}
/* Plank vertical positions as % from top of image */
.sp-plank-1 { top: 33.7% }
.sp-plank-2 { top: 41.5% }
.sp-plank-3 { top: 51.3% }
.sp-plank-4 { top: 60.5% }

.sp-plank-day {
  font-size: 9px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.7px;
  color: #7a4e18;
  line-height: 1;
  margin-bottom: 1px;
}
.sp-plank-name {
  font-size: 13px;
  font-weight: 800;
  color: #2a1200;
  line-height: 1.2;
}
.sp-plank-meta {
  font-size: 9px;
  font-weight: 600;
  color: #6a3e10;
  margin-top: 1px;
}

.sp-today-pill {

  background: #fbbf24;
