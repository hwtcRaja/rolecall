<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>On-Call Signup — Horizon West Theater Company</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
 --teal:#145466;--teal-dark:#0d3d4d;--teal-mid:#1b708d;--teal-light:#E8F4F8;--teal-50:#E8F4F8;--teal-400:#1b708d;--teal-600:#145466;
 --gray-50:#F7F7F5;--gray-200:#D9D9D4;--gray-400:#9B9B94;--gray-600:#5F5E5A;--gray-800:#2C2C28;
 --amber-50:#fefce8;--amber-border:#fde047;--amber-text:#a16207;
 --bg:#FAFAF8;--surface:#FFFFFF;--border:rgba(0,0,0,0.08);--border-md:rgba(0,0,0,0.14);
 --text:#1A1A17;--text-muted:#5F5E5A;--text-hint:#9B9B94;--radius:10px;
}
*{box-sizing:border-box}
body{margin:0;font-family:'DM Sans',-apple-system,sans-serif;background:var(--bg);color:var(--text);padding:24px 16px 60px}
.wrap{max-width:640px;margin:0 auto}
.header{text-align:center;margin-bottom:28px}
.header h1{font-size:22px;font-weight:800;color:var(--teal-dark);margin:0 0 6px}
.header p{font-size:14px;color:var(--text-muted);margin:0}
.card{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:14px}
.shift-date{font-size:15px;font-weight:700;color:var(--teal-dark)}
.shift-time{font-size:13px;color:var(--text-muted);margin-top:2px}
.shift-notes{font-size:12px;color:var(--text-hint);margin-top:6px;font-style:italic}
.btn{font-family:inherit;font-size:13px;font-weight:700;border-radius:8px;padding:9px 18px;cursor:pointer;border:none}
.btn-primary{background:var(--teal-400);color:#fff}
.btn-primary:hover{background:var(--teal-600)}
.btn-primary:disabled{background:var(--gray-200);color:var(--text-hint);cursor:default}
.requested-pill{display:inline-block;background:var(--amber-50);color:var(--amber-text);border:1.5px solid var(--amber-border);padding:4px 12px;border-radius:20px;font-size:12px;font-weight:700}
.empty{text-align:center;color:var(--text-muted);font-size:14px;padding:40px 16px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.45);display:flex;align-items:center;justify-content:center;padding:20px;z-index:1000}
.modal{background:var(--surface);border-radius:14px;width:100%;max-width:420px;padding:24px}
.modal h2{font-size:16px;font-weight:800;margin:0 0 6px;color:var(--teal-dark)}
.modal .sub{font-size:13px;color:var(--text-muted);margin-bottom:16px}
label{font-size:12px;font-weight:600;display:block;margin-bottom:4px;color:var(--text)}
input,textarea,select{width:100%;padding:9px 12px;border:1.5px solid var(--border-md);border-radius:8px;font-family:inherit;font-size:13px;margin-bottom:12px;background:#fff}
.modal-actions{display:flex;gap:8px;justify-content:flex-end}
.btn-secondary{background:var(--gray-50);color:var(--text);border:1.5px solid var(--border-md)}
.success-box{text-align:center;padding:32px 16px}
.success-box .check{font-size:40px;color:var(--teal-400);margin-bottom:10px}
</style>
</head>
<body>
<div class="wrap">
 <div class="header">
  <h1>On-Call Signup</h1>
  <p>Horizon West Theater Company Board — pick an open week below and let us know you can cover it.</p>
 </div>
 <div id="content"><div class="empty">Loading open shifts…</div></div>
</div>

<script>
async function api(path, method, body){
 const opts = { method: method||'GET', headers: {'Content-Type':'application/json'} }
 if(body) opts.body = JSON.stringify(body)
 const res = await fetch(path, opts)
 try { return await res.json() } catch(e) { return null }
}
function escHtml(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, c=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])) }
function fmt12h(t){ var p=(t||'00:00').split(':'), h=parseInt(p[0]), m=parseInt(p[1]||0), ap=h>=12?'PM':'AM'; h=h%12||12; return h+(m?':'+String(m).padStart(2,'0'):'')+' '+ap }
function formatDate(d){
 if(!d) return ''
 var dt = new Date(d+'T12:00:00')
 return dt.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'})
}

let _shifts = []
let _boardMembers = []

async function loadBoardMembers(){
 try { _boardMembers = await api('/api/public/oncall/board-members') } catch(e) { _boardMembers = [] }
 if(!Array.isArray(_boardMembers)) _boardMembers = []
}

async function loadShifts(){
 const el = document.getElementById('content')
 let rows
 try { rows = await api('/api/public/oncall/open-shifts') } catch(e) { rows = null }
 if(!Array.isArray(rows)){ el.innerHTML = '<div class="empty">Couldn\'t load shifts right now — try refreshing.</div>'; return }
 _shifts = rows
 if(!rows.length){ el.innerHTML = '<div class="empty">No open weeks right now — check back soon!</div>'; return }
 el.innerHTML = rows.map(s => `
  <div class="card">
   <div class="row">
    <div>
     <div class="shift-date">Week of ${formatDate(s.start_date)} – ${formatDate(s.end_date)}</div>
     <div class="shift-time">Standard coverage hours (8:00 AM – 10:00 PM)</div>
     ${s.notes ? `<div class="shift-notes">${escHtml(s.notes)}</div>` : ''}
    </div>
    ${s.has_pending_request
      ? '<span class="requested-pill">Requested</span>'
      : `<button class="btn btn-primary" onclick="openSignupModal('${s.id}')">Sign Up</button>`}
   </div>
  </div>
 `).join('')
}

function openSignupModal(shiftId){
 const shift = _shifts.find(s => s.id === shiftId)
 if(!shift) return
 if(!_boardMembers.length){ alert('The board roster isn\'t available right now — please try again in a moment.'); return }
 const overlay = document.createElement('div')
 overlay.className = 'overlay'
 overlay.innerHTML = `
  <div class="modal">
   <h2>Sign Up for This Week</h2>
   <div class="sub">Week of ${formatDate(shift.start_date)} – ${formatDate(shift.end_date)}</div>
   <label>Your Name</label>
   <select id="su-board-member" onchange="onBoardMemberChange()">
    <option value="">Select your name…</option>
    ${_boardMembers.map(m => `<option value="${m.id}" data-has-phone="${m.has_phone?'1':'0'}">${escHtml(m.name)}</option>`).join('')}
   </select>
   <div id="su-phone-note" style="display:none;font-size:12px;color:var(--text-muted);margin:-8px 0 12px">We'll use the phone number already on file for you.</div>
   <div id="su-phone-wrap" style="display:none">
    <label>Your Phone (+1...)</label>
    <input type="tel" id="su-phone" placeholder="+14075550100">
   </div>
   <label>Notes (optional)</label>
   <textarea id="su-notes" rows="2" placeholder="Anything staff should know"></textarea>
   <div class="modal-actions">
    <button class="btn btn-secondary" onclick="this.closest('.overlay').remove()">Cancel</button>
    <button class="btn btn-primary" id="su-submit" onclick="submitSignup('${shiftId}')">Request This Week</button>
   </div>
  </div>`
 overlay.addEventListener('click', e => { if(e.target === overlay) overlay.remove() })
 document.body.appendChild(overlay)
}

function onBoardMemberChange(){
 const sel = document.getElementById('su-board-member')
 const member = _boardMembers.find(m => m.id === sel.value)
 const phoneWrap = document.getElementById('su-phone-wrap')
 const note = document.getElementById('su-phone-note')
 if(!member){ phoneWrap.style.display='none'; note.style.display='none'; return }
 if(member.has_phone){ phoneWrap.style.display='none'; note.style.display='block' }
 else { phoneWrap.style.display='block'; note.style.display='none' }
}

async function submitSignup(shiftId){
 const boardMemberId = document.getElementById('su-board-member').value
 const member = _boardMembers.find(m => m.id === boardMemberId)
 const phoneEl = document.getElementById('su-phone')
 const phone = phoneEl ? phoneEl.value.trim() : ''
 const notes = document.getElementById('su-notes').value.trim()
 if(!boardMemberId){ alert('Please select your name'); return }
 if(member && !member.has_phone && !phone){ alert('Please enter a phone number'); return }
 const btn = document.getElementById('su-submit')
 btn.disabled = true; btn.textContent = 'Submitting…'
 const res = await api('/api/public/oncall/signup', 'POST', { shift_id: shiftId, board_member_id: boardMemberId, phone, notes })
 if(res && res.ok){
  document.querySelector('.overlay')?.remove()
  document.getElementById('content').innerHTML = `
   <div class="card success-box">
    <div class="check">✓</div>
    <div style="font-size:16px;font-weight:700;margin-bottom:6px">Request sent!</div>
    <div style="font-size:13px;color:var(--text-muted)">Staff will confirm your week shortly. Thanks for covering for HWTC!</div>
   </div>`
 } else {
  btn.disabled = false; btn.textContent = 'Request This Week'
  alert((res && res.error) || 'Something went wrong — please try again.')
 }
}

loadBoardMembers()
loadShifts()
</script>
</body>
</html>
