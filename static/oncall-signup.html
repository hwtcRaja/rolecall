<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>On-Call Sign-Up · Horizon West Theater Company</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;800&family=Playfair+Display:wght@700&display=swap" rel="stylesheet"/>
<style>
:root{--ink:#1f2a30;--muted:#5f6b72;--line:#dfe5e8;--bg:#f4f7f8;--brand:#16728b;--brand-dark:#0f5566;--soft:#e3f1f5;--ok:#166534;--okbg:#dcfce7;--open:#b45309;--openbg:#fff7ed;--closed:#475569;--closedbg:#e2e8f0;--bad:#991b1b}
*{box-sizing:border-box}
body{margin:0;font-family:'DM Sans',-apple-system,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit;font-size:15px}
.hero{background:linear-gradient(135deg,var(--brand-dark),var(--brand));color:#fff;padding:28px 20px 26px;text-align:center}
.hero .logo{height:58px;display:block;margin:0 auto 10px;mix-blend-mode:screen}
.hero h1{font-family:'Playfair Display',Georgia,serif;font-size:clamp(24px,4vw,34px);margin:0 0 6px}
.hero p{margin:0 auto;max-width:620px;opacity:.9;line-height:1.5}
.wrap{max-width:980px;margin:-14px auto 40px;padding:0 14px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:14px}
.nav{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.nav h2{flex:1;margin:0;font-size:20px;color:var(--brand-dark)}
.btn{border:none;border-radius:10px;padding:9px 14px;font-weight:700;cursor:pointer;background:var(--soft);color:var(--brand-dark)}
.btn-p{background:var(--brand);color:#fff}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin:4px 0 12px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px}
table.cal{width:100%;border-collapse:collapse;table-layout:fixed}
.cal th{font-size:12px;color:var(--muted);font-weight:700;padding:6px 0;text-transform:uppercase}
.cal td{border:1px solid var(--line);vertical-align:top;height:74px;padding:4px;font-size:12px;position:relative}
.cal td.other{color:#b6c0c6}
.cal td[onclick]{cursor:pointer}
.cal td.today .n{background:var(--brand);color:#fff;border-radius:999px;padding:0 6px}
.cal .n{font-weight:700;font-size:12.5px;display:inline-block}
.tag{display:block;margin-top:4px;border-radius:6px;padding:3px 5px;font-size:11.5px;font-weight:700;line-height:1.25}
.t-open{background:var(--openbg);color:var(--open);border:1.5px dashed #fdba74;cursor:pointer}
.t-open:hover{background:#ffedd5}
.t-req{background:#ede9fe;color:#5b21b6}
.t-cov{background:var(--okbg);color:var(--ok)}
.t-closed{background:var(--closedbg);color:var(--closed)}
.weeks{display:none}
@media(max-width:640px){
  table.cal{display:none}
  .weeks{display:block}
}
.week{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;background:#fff}
.week .d{flex:1}
.week .d strong{display:block}
.week .s{font-size:13px;color:var(--muted)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;padding:14px;z-index:20}
.modal .box{background:#fff;border-radius:14px;max-width:460px;width:100%;padding:20px}
label{font-size:13px;font-weight:700;display:block;margin:10px 0 4px}
select,input,textarea{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fff}
.err{color:var(--bad);font-weight:700;margin-top:8px}
</style>
</head>
<body>
<div class="hero"><img class="logo" src="/static/images/hwtc_logo_white.png" alt="Horizon West Theater Company" onerror="this.style.display='none'"/>
<h1>On-Call Sign-Up</h1><p>Board members take the HWTC phone one week at a time (Sunday–Saturday). Pick an open week to sign up. Grey days are when we're closed.</p></div>
<div class="wrap">
  <div class="card">
    <div class="nav"><button class="btn" onclick="move(-1)">←</button><h2 id="mlabel"></h2><button class="btn" onclick="move(1)">→</button></div>
    <div class="legend"><span><i style="background:var(--openbg);border:1.5px dashed #fdba74"></i>Open: tap to sign up</span><span><i style="background:#ede9fe"></i>Requested</span><span><i style="background:var(--okbg)"></i>Covered</span><span><i style="background:var(--closedbg)"></i>Closed</span></div>
    <div id="cal"></div>
  </div>
  <div class="card"><h2 style="margin:0 0 8px;font-size:17px;color:var(--brand-dark)">Open weeks</h2><div id="openlist"></div></div>
</div>
<div class="modal" id="modal"><div class="box" id="mbox"></div></div>
<script>
var D = null, OFF = 0, MEMBERS = null
function esc(x){ return String(x==null?'':x).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;') }
function dt(s){ var m = s.split('-'); return new Date(+m[0], +m[1]-1, +m[2]) }
function iso(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0') }
function fmt(s, o){ return dt(s).toLocaleDateString('en-US', o || {month:'short', day:'numeric'}) }
function t12(t){ t=(t||'').slice(0,5); if(t.length<5) return ''; var h=+t.slice(0,2), m=t.slice(3,5); return ((h%12)||12)+(m!=='00'?':'+m:'')+(h>=12?'pm':'am') }
function shiftOn(ds){ return (D.shifts||[]).filter(function(s){ return s.start_date <= ds && s.end_date >= ds }) }
function closedOn(ds){ return (D.closures||[]).find(function(c){ return c.start_date <= ds && c.end_date >= ds }) }
function move(n){ OFF += n; render() }
// For weeks with closed days: which days still need covering, as short ranges
function workDays(s){
  var out = [], d = dt(s.start_date), end = dt(s.end_date)
  while(d <= end){ var ds = iso(d); if((s.closed_days||[]).indexOf(ds) < 0) out.push(ds); d.setDate(d.getDate()+1) }
  return out
}
function ranges(days){
  var out = [], cur = null
  days.forEach(function(ds){
    if(cur){ var nx = dt(cur[1]); nx.setDate(nx.getDate()+1); if(iso(nx) === ds){ cur[1] = ds; return } out.push(cur) }
    cur = [ds, ds]
  })
  if(cur) out.push(cur)
  var f = function(x){ return dt(x).toLocaleDateString('en-US',{weekday:'short', month:'short', day:'numeric'}) }
  var fw = function(x){ return dt(x).toLocaleDateString('en-US',{weekday:'short'}) }
  return out.map(function(r){ return r[0]===r[1] ? f(r[0]) : (dt(r[0]).getMonth()===dt(r[1]).getMonth() ? f(r[0])+' – '+fw(r[1])+' '+dt(r[1]).getDate() : f(r[0])+' – '+f(r[1])) }).join(', ')
}
function partialNote(s){
  var cd = s.closed_days || []; if(!cd.length) return ''
  var cl = (D.closures||[]).find(function(c){ return cd.some(function(x){ return c.start_date <= x && c.end_date >= x }) })
  var wd = workDays(s)
  return '<span style="display:inline-block;background:#fef3c7;color:#92400e;font-weight:800;font-size:11.5px;border-radius:999px;padding:1px 8px;margin-right:6px">Partial week · '+wd.length+' day'+(wd.length===1?'':'s')+'</span>'
    + 'On call '+ranges(wd)+(cl&&cl.label?' (closed for '+esc(cl.label)+')':' (closed the other days)')
}
function tagFor(s, ds){
  var range = fmt(s.start_date)+' – '+fmt(s.end_date)
  if(s.status === 'covered') return '<span class="tag t-cov">'+esc(s.who)+'</span>'
  if(s.status === 'closed') return ''
  if(s.status === 'requested') return '<span class="tag t-req">Requested</span>'
  if(s.past) return ''
  return '<span class="tag t-open" onclick="pick(\''+s.id+'\')" title="'+esc(range)+'">'+((s.closed_days||[]).length ? 'Open · partial week' : 'Open · sign up')+'</span>'
}
function render(){
  var today = dt(D.today), first = new Date(today.getFullYear(), today.getMonth() + OFF, 1)
  document.getElementById('mlabel').textContent = first.toLocaleDateString('en-US', {month:'long', year:'numeric'})
  var start = new Date(first); start.setDate(1 - first.getDay())   // back to Sunday
  var h = '<table class="cal"><thead><tr>'+['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(function(d){ return '<th>'+d+'</th>' }).join('')+'</tr></thead><tbody>'
  var d = new Date(start)
  for(var w = 0; w < 6; w++){
    h += '<tr>'
    for(var i = 0; i < 7; i++){
      var ds = iso(d), other = d.getMonth() !== first.getMonth(), cl = closedOn(ds)
      var sh = shiftOn(ds), st = sh.length ? sh[0].status : ''
      var tint = cl ? 'var(--closedbg)' : (sh.length && sh[0].past) ? '' : st==='open' ? '#fffaf3' : st==='covered' ? '#f3fbf5' : st==='requested' ? '#f7f5ff' : ''
      var cell = '<span class="n">'+d.getDate()+'</span>'
      if(cl) cell += '<span class="tag t-closed">Closed'+(cl.label?' · '+esc(cl.label):'')+'</span>'
      else if(i === 0) sh.forEach(function(s){ cell += tagFor(s, ds) })    // label each week once, on its Sunday
      h += '<td class="'+(other?'other ':'')+(ds===D.today?'today':'')+'"'+(tint?' style="background:'+tint+'"':'')+(st==='open'&&!cl&&!sh[0].past?' onclick="pick(\''+sh[0].id+'\')" title="Sign up for this week"':'')+'>'+cell+'</td>'
      d.setDate(d.getDate()+1)
    }
    h += '</tr>'
    if(d.getMonth() !== first.getMonth() && d > first) break
  }
  h += '</tbody></table>'
  // phone layout: one row per week of this month
  var wk = new Date(start), rows = ''
  while(wk.getMonth() === first.getMonth() || wk < first){
    var ws = iso(wk), we = new Date(wk); we.setDate(we.getDate()+6)
    var s = shiftOn(ws)[0], cdays = s ? s.closed_days : []
    var cl2 = (D.closures||[]).filter(function(c){ return c.end_date >= ws && c.start_date <= iso(we) })
    var right = s ? (s.status==='covered' ? '<span class="tag t-cov">'+esc(s.who)+'</span>' : s.status==='closed' ? '<span class="tag t-closed">Closed</span>' : s.status==='requested' ? '<span class="tag t-req">Requested</span>' : (s.past?'':'<button class="btn btn-p" onclick="pick(\''+s.id+'\')">Sign up</button>')) : ''
    if(s && s.closed_days && s.closed_days.length && s.status==='open' && !s.past){ rows += '<div class="week"><div class="d"><strong>'+fmt(ws)+' – '+fmt(iso(we))+'</strong><div class="s">'+partialNote(s)+'</div></div>'+right+'</div>'; wk.setDate(wk.getDate()+7); if(wk.getMonth() !== first.getMonth() && wk > first) break; continue }
    rows += '<div class="week"><div class="d"><strong>'+fmt(ws)+' – '+fmt(iso(we))+'</strong>'
      + (cl2.length ? '<div class="s">Closed '+cl2.map(function(c){ return (c.label?esc(c.label)+': ':'')+fmt(c.start_date)+(c.end_date!==c.start_date?'–'+fmt(c.end_date):'') }).join(', ')+'</div>' : '')+'</div>'+right+'</div>'
    wk.setDate(wk.getDate()+7)
    if(wk.getMonth() !== first.getMonth() && wk > first) break
  }
  document.getElementById('cal').innerHTML = h + '<div class="weeks">'+rows+'</div>'
  // the list of open weeks
  var open = (D.shifts||[]).filter(function(s){ return s.status==='open' && !s.past })
  document.getElementById('openlist').innerHTML = open.length ? open.slice(0, 12).map(function(s){
      return '<div class="week"><div class="d"><strong>'+fmt(s.start_date,{weekday:'short',month:'short',day:'numeric'})+' – '+fmt(s.end_date,{weekday:'short',month:'short',day:'numeric'})+'</strong>'
        + '<div class="s">'+(s.closed_days.length ? partialNote(s)+' · '+t12(s.start_time)+'–'+t12(s.end_time) : t12(s.start_time)+'–'+t12(s.end_time)+' each day')+'</div></div>'
        + '<button class="btn btn-p" onclick="pick(\''+s.id+'\')">Sign up</button></div>' }).join('')
    : '<div class="s" style="color:var(--muted)">Every upcoming week is covered. Thank you!</div>'
}
async function pick(id){
  var s = D.shifts.find(function(x){ return x.id===id }); if(!s) return
  if(!MEMBERS){ try{ MEMBERS = await (await fetch('/api/public/oncall/board-members')).json() }catch(e){ MEMBERS = [] } }
  var box = document.getElementById('mbox')
  box.innerHTML = '<h2 style="margin:0 0 4px;color:var(--brand-dark)">Sign up for on-call</h2>'
    + '<div style="color:var(--muted)">'+fmt(s.start_date,{weekday:'long',month:'long',day:'numeric'})+' – '+fmt(s.end_date,{weekday:'long',month:'long',day:'numeric'})+' · '+t12(s.start_time)+'–'+t12(s.end_time)+' each day</div>'
    + (s.closed_days.length ? '<div style="margin-top:8px;background:#fef3c7;border-radius:8px;padding:8px 10px;font-size:13px;color:#78350f">'+partialNote(s)+'. You won\'t get calls on the closed days.</div>' : '')
    + '<label>Your name</label><select id="m-who" onchange="whoChanged()"><option value="">Choose…</option>'+MEMBERS.map(function(m){ return '<option value="'+m.id+'" data-phone="'+(m.has_phone?1:0)+'">'+esc(m.name)+'</option>' }).join('')+'</select>'
    + '<div id="m-phone-w" style="display:none"><label>Your phone number</label><input id="m-phone" type="tel" placeholder="(407) 555-0123"/></div>'
    + '<label>Notes (optional)</label><textarea id="m-notes" rows="2"></textarea>'
    + '<div style="display:flex;gap:8px;margin-top:14px"><button class="btn" onclick="closeM()">Cancel</button><button class="btn btn-p" style="flex:1" onclick="send(\''+id+'\')">Request this week</button></div><div id="m-err" class="err"></div>'
  document.getElementById('modal').style.display = 'flex'
}
function whoChanged(){ var o = document.getElementById('m-who').selectedOptions[0]; document.getElementById('m-phone-w').style.display = (o && o.value && o.dataset.phone==='0') ? '' : 'none' }
function closeM(){ document.getElementById('modal').style.display = 'none' }
async function send(id){
  var who = document.getElementById('m-who').value
  if(!who){ document.getElementById('m-err').textContent = 'Choose your name.'; return }
  var r = await (await fetch('/api/public/oncall/signup', {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({shift_id:id, board_member_id:who, phone:(document.getElementById('m-phone')||{}).value||'', notes:document.getElementById('m-notes').value})})).json()
  if(r.error){ document.getElementById('m-err').textContent = r.error; return }
  document.getElementById('mbox').innerHTML = '<h2 style="margin:0 0 6px;color:var(--brand-dark)">Thanks!</h2><p>Your request was sent. Once it\'s approved, calls that week will ring you.</p><button class="btn btn-p" onclick="closeM();load()">Done</button>'
}
async function load(){ D = await (await fetch('/api/public/oncall/calendar')).json(); render() }
document.getElementById('modal').addEventListener('click', function(e){ if(e.target.id==='modal') closeM() })
load()
</script>
</body>
</html>
