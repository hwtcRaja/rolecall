<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Program Ads</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1f2a30; --muted:#5f6b72; --line:#dfe5e8; --paper:#ffffff; --bg:#f4f7f8;
  --brand:#16728b; --brand-dark:#0f5566; --brand-soft:#e3f1f5; --gold:#f4b740; --error:#b42318;
  --show-accent:#16728b;
}
*{box-sizing:border-box}
body{margin:0;font-family:'DM Sans',-apple-system,sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
a{color:var(--brand)}
button,input,textarea,select{font-family:inherit;font-size:15px}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

.site-header{background:#fff;border-bottom:1px solid var(--line);padding:10px 20px;display:flex;justify-content:center}
.site-header img{height:56px;display:block}

.hero{position:relative;color:#fff;background:var(--show-accent);background-size:cover;background-position:center 30%;min-height:220px;display:flex;align-items:flex-end;padding:0 20px 34px}
.hero::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 30%,rgba(0,0,0,0.7) 100%);pointer-events:none}
.hero-inner{position:relative;z-index:1;max-width:1040px;width:100%;margin:0 auto}
.hero h1{margin:0;font-family:'Playfair Display',Georgia,serif;font-weight:800;font-size:clamp(28px,4.4vw,42px);line-height:1.1;text-shadow:0 2px 18px rgba(0,0,0,0.45)}
.hero p{margin:8px 0 0;font-size:15px;opacity:0.92;text-shadow:0 1px 8px rgba(0,0,0,0.5)}

.wrap{max-width:1040px;margin:0 auto;padding:26px 20px 120px;display:grid;grid-template-columns:1fr 330px;gap:26px;align-items:start}
@media(max-width:880px){.wrap{grid-template-columns:1fr}}

.intro{font-size:15.5px;line-height:1.65;color:var(--muted);margin:0 0 22px;max-width:62ch;white-space:pre-line}
.section{margin-bottom:30px}
.section h2{font-family:'Playfair Display',Georgia,serif;font-size:24px;margin:0 0 4px}
.section .sub{font-size:14px;color:var(--muted);margin:0 0 14px}

/* Ad tiles: each shows how much of a program page the ad takes up */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px}
.tile{background:var(--paper);border:1.5px solid var(--line);border-radius:14px;padding:14px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:10px;transition:border-color .15s}
.tile:hover{border-color:var(--brand)}
.tile[aria-pressed="true"]{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.tile[disabled]{opacity:0.5;cursor:not-allowed}
.page{width:74px;aspect-ratio:5.5/8.5;border:1.5px solid #b9c5ca;border-radius:3px;background:#fff;position:relative;overflow:hidden;align-self:center}
.page .fill{position:absolute;left:0;right:0;bottom:0;background:var(--brand);opacity:0.85}
.page .fill.q{right:50%}
.tile-name{font-weight:800;font-size:16px}
.tile-meta{font-size:13px;color:var(--muted);line-height:1.5}
.tile-price{font-weight:700;font-size:14.5px;color:var(--brand-dark)}
.tile-left{font-size:12px;font-weight:700;color:#b45309}

.list{display:grid;gap:10px}
.row-item{background:var(--paper);border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;align-items:center;gap:14px;cursor:pointer;text-align:left;width:100%}
.row-item:hover{border-color:var(--brand)}
.row-item .grow{flex:1}

/* the form for the chosen item */
.panel{background:var(--paper);border:1.5px solid var(--brand);border-radius:14px;padding:18px;margin:14px 0 4px}
.panel h3{margin:0 0 12px;font-size:17px}
.field{margin-bottom:14px}
.field label{display:block;font-size:13.5px;font-weight:700;margin-bottom:6px}
.field .hint{font-size:12.5px;color:var(--muted);margin-top:5px;line-height:1.5}
.field input[type=text],.field input[type=email],.field input[type=tel],.field textarea{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
.field textarea{min-height:92px;resize:vertical;line-height:1.5}
.field input:focus,.field textarea:focus{border-color:var(--brand);outline:none}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:none;background:#fff;padding:10px 14px;cursor:pointer;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--brand);color:#fff}
.drop{border:2px dashed #b9c5ca;border-radius:12px;padding:18px;text-align:center;font-size:14px;color:var(--muted);cursor:pointer;background:#fbfdfd}
.drop.over{border-color:var(--brand);background:var(--brand-soft)}
.drop.done{border-style:solid;border-color:var(--brand);color:var(--ink)}
.count{font-size:12px;color:var(--muted);text-align:right;margin-top:4px}
.count.over{color:var(--error);font-weight:700}
.btn{border:none;border-radius:10px;padding:12px 18px;font-weight:700;cursor:pointer;font-size:15px}
.btn-primary{background:var(--brand);color:#fff}
.btn-primary:hover{background:var(--brand-dark)}
.btn-primary[disabled]{opacity:0.55;cursor:not-allowed}
.btn-ghost{background:transparent;color:var(--muted)}
.error{color:var(--error);font-size:13.5px;margin-top:8px}

/* order summary */
.summary{position:sticky;top:18px;background:var(--paper);border:1.5px solid var(--line);border-radius:14px;padding:18px}
.summary h2{font-family:'Playfair Display',Georgia,serif;font-size:21px;margin:0 0 12px}
.sum-item{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.sum-item .grow{flex:1;line-height:1.45}
.sum-item small{display:block;color:var(--muted);font-size:12.5px}
.sum-item button{border:none;background:none;color:var(--muted);cursor:pointer;font-size:12.5px;text-decoration:underline;padding:0}
.total{display:flex;justify-content:space-between;font-weight:800;font-size:17px;padding:12px 0 14px}
.empty{font-size:14px;color:var(--muted);padding:6px 0 12px}
.closed{background:var(--paper);border:1.5px solid var(--line);border-radius:14px;padding:26px;text-align:center;font-size:15px;color:var(--muted)}
@media(max-width:880px){.summary{position:static}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="site-header"><img src="/static/images/hwtc_logo_teal.png" alt="Horizon West Theater Company" onerror="this.style.display='none'"/></header>
<div id="hero"></div>
<main id="app"><div class="wrap"><div>Loading…</div></div></main>

<script>
var SLUG = location.pathname.replace(/^\/(playbill|program-ads)\//,'').replace(/\/$/,'')
var DATA = null, CART = [], CHOSEN = null, DRAFT = {}
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;') }
function money(c){ return '$'+((c||0)/100).toFixed(2).replace(/\.00$/,'') }
function cartKey(){ return 'hwtc_program_ads_cart_'+SLUG }
function saveCart(){ try{ localStorage.setItem(cartKey(), JSON.stringify(CART)) }catch(e){} }
function loadCart(){ try{ CART = JSON.parse(localStorage.getItem(cartKey())||'[]') }catch(e){ CART = [] } }
async function api(path, method, body){
  var r = await fetch(path, {method: method||'GET', headers: body?{'Content-Type':'application/json'}:{}, body: body?JSON.stringify(body):undefined})
  try{ return await r.json() }catch(e){ return {error:'Something went wrong. Please try again.'} }
}

function hero(prod, sub){
  var img = prod && prod.image_url
  document.getElementById('hero').innerHTML = '<div class="hero"'+(img?' style="background-image:url(\''+esc(img)+'\')"':'')+'><div class="hero-inner">'
    + '<h1>'+esc(prod ? prod.name+' program ads' : 'Program ads')+'</h1>'+(sub?'<p>'+esc(sub)+'</p>':'')+'</div></div>'
  document.title = (prod ? prod.name+' · ' : '')+'Program ads & well wishes'
}
function fmtDeadline(d){
  if(!d) return ''
  try{ return new Date(d+'T12:00:00').toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'}) }catch(e){ return d }
}

async function boot(){
  if(SLUG === 'confirmation') return showConfirmation()
  var d = await api('/api/public/playbill/'+encodeURIComponent(SLUG))
  if(d.error){ hero(null); document.getElementById('app').innerHTML = '<div class="wrap"><div class="closed">'+esc(d.error)+'</div></div>'; return }
  DATA = d
  var p = d.production
  hero(p, d.open && p.playbill_deadline ? 'Orders close '+fmtDeadline(p.playbill_deadline) : '')
  if(!d.open){ document.getElementById('app').innerHTML = '<div class="wrap"><div class="closed">'+esc(d.closed_reason)+'</div></div>'; return }
  loadCart()
  // drop anything from an old visit that isn't offered anymore
  CART = CART.filter(function(it){ return d.products.some(function(x){ return x.id===it.product_id }) })
  render()
}

function priceText(p){
  var bw = p.price_bw_cents, co = p.price_color_cents
  if(bw!=null && co!=null) return money(bw)+' black & white · '+money(co)+' color'
  return money(bw!=null?bw:co)
}
function inCart(pid){ return CART.filter(function(x){ return x.product_id===pid }).length }

function render(){
  var d = DATA, prods = d.products || []
  var ads = prods.filter(function(p){ return p.kind==='ad' })
  var wishes = prods.filter(function(p){ return p.kind==='well_wish' })
  var grams = prods.filter(function(p){ return p.kind==='castgram' })
  var h = '<div class="wrap"><div>'
  if(d.production.playbill_intro) h += '<p class="intro">'+esc(d.production.playbill_intro)+'</p>'
  if(!prods.length) h += '<div class="closed">Nothing is available to order yet. Check back soon.</div>'
  if(ads.length){
    h += '<section class="section"><h2>Ads</h2><p class="sub">Promote your business or say congratulations in the show program. Pick a size.'+(d.production.playbill_specs?' Artwork specs are below the size you pick.':'')+'</p><div class="tiles">'
      + ads.map(function(p){
          var left = p.remaining==null ? null : p.remaining - inCart(p.id)
          var frac = Math.max(0.1, Math.min(1, p.page_fraction || 1))
          var fill = frac===0.25 ? '<div class="fill q" style="height:50%"></div>' : '<div class="fill" style="height:'+(frac*100)+'%"></div>'
          return '<button class="tile" aria-pressed="'+(CHOSEN===p.id)+'" '+(left===0?'disabled':'')+' onclick="choose(\''+p.id+'\')">'
            + '<div class="page" aria-hidden="true">'+fill+'</div>'
            + '<div><div class="tile-name">'+esc(p.name)+'</div>'
            + (p.dimensions?'<div class="tile-meta">'+esc(p.dimensions)+'</div>':'')
            + '<div class="tile-price">'+esc(priceText(p))+'</div>'
            + (left===0?'<div class="tile-left">Sold out</div>':(left!=null && left<=3?'<div class="tile-left">'+left+' left</div>':''))+'</div></button>'
            + (CHOSEN===p.id ? '' : '')
        }).join('') + '</div>'
      + (ads.some(function(p){ return p.id===CHOSEN }) ? formHTML(ads.find(function(p){ return p.id===CHOSEN })) : '')
      + '</section>'
  }
  function listSection(title, sub, items){
    if(!items.length) return ''
    return '<section class="section"><h2>'+title+'</h2><p class="sub">'+sub+'</p><div class="list">'
      + items.map(function(p){
          var left = p.remaining==null ? null : p.remaining - inCart(p.id)
          return '<button class="row-item" '+(left===0?'disabled':'')+' onclick="choose(\''+p.id+'\')" aria-pressed="'+(CHOSEN===p.id)+'">'
            + '<div class="grow"><div class="tile-name">'+esc(p.name)+'</div>'+(p.description?'<div class="tile-meta">'+esc(p.description)+'</div>':'')+'</div>'
            + '<div class="tile-price">'+esc(priceText(p))+'</div></button>'
            + (CHOSEN===p.id ? formHTML(p) : '')
        }).join('') + '</div></section>'
  }
  h += listSection('Well wishes', 'A short message printed in the show program for someone in the show.', wishes)
  h += listSection('Cast grams', 'A personal note delivered to a cast member during the run.', grams)
  h += '</div>' + summaryHTML() + '</div>'
  document.getElementById('app').innerHTML = h
  wireDrop()
}

function choose(pid){
  CHOSEN = CHOSEN===pid ? null : pid
  var p = (DATA.products||[]).find(function(x){ return x.id===pid }) || {}
  DRAFT = {product_id: pid, color_mode: p.price_bw_cents!=null ? 'bw' : 'color'}
  render()
  var el = document.getElementById('item-form'); if(el) el.scrollIntoView({behavior:'smooth', block:'nearest'})
}

function formHTML(p){
  var both = p.price_bw_cents!=null && p.price_color_cents!=null
  var h = '<div class="panel" id="item-form"><h3>'+esc(p.name)+(p.dimensions?' <span style="font-weight:500;color:var(--muted);font-size:14px">'+esc(p.dimensions)+'</span>':'')+'</h3>'
  if(p.description && p.kind==='ad') h += '<p class="tile-meta" style="margin:-4px 0 14px">'+esc(p.description)+'</p>'
  if(both){
    h += '<div class="field"><label>Print</label><div class="seg" role="group">'
      + '<button type="button" aria-pressed="'+(DRAFT.color_mode==='bw')+'" onclick="setColor(\'bw\')">Black & white '+money(p.price_bw_cents)+'</button>'
      + '<button type="button" aria-pressed="'+(DRAFT.color_mode==='color')+'" onclick="setColor(\'color\')">Color '+money(p.price_color_cents)+'</button></div></div>'
  }
  if(p.kind==='castgram'){
    h += '<div class="field"><label for="f-recipient">Who is it for?</label><input type="text" id="f-recipient" maxlength="120" placeholder="Cast member\'s name" value="'+esc(DRAFT.recipient||'')+'" oninput="DRAFT.recipient=this.value"/></div>'
  }
  if(p.kind==='ad'){
    h += '<div class="field"><label for="f-business">Business or name on the ad</label><input type="text" id="f-business" maxlength="120" value="'+esc(DRAFT.business_name||'')+'" oninput="DRAFT.business_name=this.value"/></div>'
  }
  if(p.kind!=='ad' || p.char_limit){
    h += '<div class="field"><label for="f-message">'+(p.kind==='ad'?'Ad text':'Your message')+'</label>'
      + '<textarea id="f-message" '+(p.char_limit?'maxlength="'+(p.char_limit+50)+'"':'')+' oninput="DRAFT.message=this.value;updateCount('+(p.char_limit||0)+')" placeholder="'+(p.kind==='castgram'?'Break a leg! We\'re so proud of you.':p.kind==='well_wish'?'Congratulations to the whole cast and crew!':'')+'">'+esc(DRAFT.message||'')+'</textarea>'
      + (p.char_limit?'<div class="count" id="f-count"></div>':'')
      + (p.kind==='well_wish'?'<div class="hint">Sign it the way you want it printed, e.g. "Love, Mom & Dad".</div>':'')+'</div>'
  }
  if(p.artwork && p.artwork!=='none'){
    h += '<div class="field"><label>Artwork'+(p.artwork==='optional'?' (optional)':'')+'</label>'
      + '<div class="drop'+(DRAFT.artwork_id?' done':'')+'" id="f-drop" tabindex="0" role="button" onclick="document.getElementById(\'f-file\').click()" onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();this.click()}">'
      + (DRAFT.artwork_id ? 'Uploaded: <strong>'+esc(DRAFT.artwork_name)+'</strong><br><span style="font-size:12.5px">Click to replace</span>' : 'Drop your file here or click to choose<br><span style="font-size:12.5px">PDF, PNG or JPG, up to 15 MB</span>')
      + '</div><input type="file" id="f-file" accept=".pdf,.png,.jpg,.jpeg" style="display:none" onchange="uploadArt(this.files[0])"/>'
      + (DATA.production.playbill_specs ? '<div class="hint" style="white-space:pre-line">'+esc(DATA.production.playbill_specs)+'</div>' : '')
      + '</div>'
  }
  h += '<div class="field"><label for="f-notes">Notes for us (optional)</label><textarea id="f-notes" style="min-height:64px" oninput="DRAFT.notes=this.value" placeholder="Anything we should know about your '+(p.kind==='ad'?'ad':'order')+'">'+esc(DRAFT.notes||'')+'</textarea></div>'
  h += '<div id="f-error" class="error" role="alert"></div>'
  h += '<div style="display:flex;gap:8px;align-items:center"><button class="btn btn-primary" onclick="addToOrder()">Add to order</button><button class="btn btn-ghost" onclick="CHOSEN=null;render()">Cancel</button></div></div>'
  setTimeout(function(){ updateCount(p.char_limit||0) }, 0)
  return h
}
function setColor(m){ DRAFT.color_mode = m; render() }
function updateCount(limit){
  var el = document.getElementById('f-count'); if(!el || !limit) return
  var n = (DRAFT.message||'').length
  el.textContent = n+' / '+limit+' characters'
  el.className = 'count'+(n>limit?' over':'')
}
function wireDrop(){
  var el = document.getElementById('f-drop'); if(!el) return
  ;['dragenter','dragover'].forEach(function(e){ el.addEventListener(e, function(ev){ ev.preventDefault(); el.classList.add('over') }) })
  ;['dragleave','drop'].forEach(function(e){ el.addEventListener(e, function(ev){ ev.preventDefault(); el.classList.remove('over') }) })
  el.addEventListener('drop', function(ev){ var f = ev.dataTransfer.files && ev.dataTransfer.files[0]; if(f) uploadArt(f) })
}
async function uploadArt(file){
  if(!file) return
  var drop = document.getElementById('f-drop'), err = document.getElementById('f-error')
  if(file.size > 15*1024*1024){ err.textContent = 'That file is over 15 MB. Please send a smaller version.'; return }
  drop.innerHTML = 'Uploading '+esc(file.name)+'…'
  var fd = new FormData(); fd.append('file', file)
  try{
    var r = await fetch('/api/public/playbill/artwork', {method:'POST', body: fd}); var d = await r.json()
    if(!d.ok){ err.textContent = d.error || 'Upload failed. Try again.'; render(); return }
    DRAFT.artwork_id = d.artwork_id; DRAFT.artwork_name = d.filename
  }catch(e){ err.textContent = 'Upload failed. Check your connection and try again.' }
  render()
}
function addToOrder(){
  var p = (DATA.products||[]).find(function(x){ return x.id===CHOSEN }); if(!p) return
  var err = document.getElementById('f-error')
  var msg = (DRAFT.message||'').trim()
  if(p.kind==='castgram' && !(DRAFT.recipient||'').trim()){ err.textContent = 'Add who your cast gram is for.'; return }
  if(p.kind!=='ad' && !msg){ err.textContent = 'Write your message.'; return }
  if(p.char_limit && msg.length > p.char_limit){ err.textContent = 'Your message is '+(msg.length-p.char_limit)+' characters over the limit.'; return }
  if(p.artwork==='required' && !DRAFT.artwork_id){ err.textContent = 'Upload your artwork.'; return }
  var both = p.price_bw_cents!=null && p.price_color_cents!=null
  var price = (DRAFT.color_mode==='color' ? p.price_color_cents : p.price_bw_cents); if(price==null) price = p.price_bw_cents!=null ? p.price_bw_cents : p.price_color_cents
  CART.push({product_id: p.id, name: p.name, kind: p.kind, color_mode: DRAFT.color_mode, color_label: both ? (DRAFT.color_mode==='color'?'Color':'Black & white') : '',
    price_cents: price, message: msg, recipient: (DRAFT.recipient||'').trim(), business_name: (DRAFT.business_name||'').trim(),
    notes: (DRAFT.notes||'').trim(), artwork_id: DRAFT.artwork_id||'', artwork_name: DRAFT.artwork_name||''})
  saveCart(); CHOSEN = null; DRAFT = {}; render()
}
function removeItem(i){ CART.splice(i,1); saveCart(); render() }

function summaryHTML(){
  var total = CART.reduce(function(t,x){ return t+(x.price_cents||0) }, 0)
  var h = '<aside class="summary" aria-label="Your order"><h2>Your order</h2>'
  if(!CART.length) h += '<div class="empty">Pick an ad size, a well wish or a cast gram to get started.</div>'
  CART.forEach(function(x, i){
    h += '<div class="sum-item"><div class="grow"><strong>'+esc(x.name)+'</strong>'
      + (x.color_label?'<small>'+esc(x.color_label)+'</small>':'')
      + (x.recipient?'<small>For '+esc(x.recipient)+'</small>':'')
      + (x.business_name?'<small>'+esc(x.business_name)+'</small>':'')
      + (x.artwork_name?'<small>Artwork: '+esc(x.artwork_name)+'</small>':'')
      + (x.message?'<small>“'+esc(x.message.length>60?x.message.slice(0,60)+'…':x.message)+'”</small>':'')
      + '<button onclick="removeItem('+i+')">Remove</button></div><div>'+money(x.price_cents)+'</div></div>'
  })
  if(CART.length){
    h += '<div class="total"><span>Total</span><span>'+money(total)+'</span></div>'
      + '<div class="field"><label for="c-name">Your name</label><input type="text" id="c-name" autocomplete="name"/></div>'
      + '<div class="field"><label for="c-email">Email</label><input type="email" id="c-email" autocomplete="email"/><div class="hint">Your receipt goes here, and we\'ll use it if we have questions.</div></div>'
      + '<div class="field"><label for="c-phone">Phone (optional)</label><input type="tel" id="c-phone" autocomplete="tel"/></div>'
      + '<div id="c-error" class="error" role="alert"></div>'
      + '<button class="btn btn-primary" style="width:100%;margin-top:6px" id="c-pay" onclick="checkout()">Pay '+money(total)+'</button>'
      + '<div class="hint" style="font-size:12px;color:var(--muted);margin-top:8px;text-align:center">Secure checkout with Square</div>'
  }
  return h + '</aside>'
}
async function checkout(){
  var name = document.getElementById('c-name').value.trim(), email = document.getElementById('c-email').value.trim(), phone = document.getElementById('c-phone').value.trim()
  var err = document.getElementById('c-error'), btn = document.getElementById('c-pay')
  if(!name || email.indexOf('@')<0){ err.textContent = 'Enter your name and email.'; return }
  btn.disabled = true; btn.textContent = 'Starting checkout…'
  var res = await api('/api/public/playbill/'+encodeURIComponent(SLUG)+'/checkout','POST',{name:name, email:email, phone:phone,
    items: CART.map(function(x){ return {product_id:x.product_id, color_mode:x.color_mode, message:x.message, recipient:x.recipient, business_name:x.business_name, notes:x.notes, artwork_id:x.artwork_id} })})
  if(res.error){ err.textContent = res.error; btn.disabled = false; btn.textContent = 'Try again'; return }
  CART = []; saveCart()
  if(res.free){ location.href = '/program-ads/confirmation?order='+encodeURIComponent(res.cart_id); return }
  location.href = res.payment_url
}

async function showConfirmation(){
  var id = new URLSearchParams(location.search).get('order') || ''
  hero(null, '')
  var tries = 0, d
  async function poll(){
    d = await api('/api/public/playbill/order/'+encodeURIComponent(id))
    if(d.error){ document.getElementById('app').innerHTML = '<div class="wrap"><div class="closed">'+esc(d.error)+'</div></div>'; return }
    hero({name: d.production_name}, d.status==='paid' ? 'Thank you for supporting the show!' : 'Confirming your payment…')
    var items = (d.items||[]).map(function(x){ return '<div class="sum-item"><div class="grow"><strong>'+esc(x.name)+'</strong>'+(x.recipient?'<small>For '+esc(x.recipient)+'</small>':'')+'</div><div>'+money(x.price_cents)+'</div></div>' }).join('')
    document.getElementById('app').innerHTML = '<div class="wrap" style="grid-template-columns:1fr;max-width:620px"><div class="summary" style="position:static">'
      + '<h2>'+(d.status==='paid'?'Your order is in':'Almost done')+'</h2>'
      + '<p style="color:var(--muted);font-size:15px;line-height:1.6;margin:0 0 12px">'+(d.status==='paid'
          ? 'A receipt is on its way to your email. We\'ll be in touch if we have questions about your artwork or message.'
          : 'We\'re waiting for Square to confirm your payment. This usually takes a few seconds.')+'</p>'
      + items + '<div style="margin-top:14px"><a href="/program-ads/'+esc(d.slug)+'">Order something else</a></div></div></div>'
    if(d.status!=='paid' && tries++ < 10) setTimeout(poll, 3000)
  }
  poll()
}
boot()
</script>
</body>
</html>
