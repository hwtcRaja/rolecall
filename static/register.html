<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register — Horizon West Theatre Company</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',-apple-system,sans-serif;background:#f0f4f8;min-height:100vh;color:#1a2332}
.header{background:linear-gradient(135deg,#0d3d4d 0%,#145466 60%,#1b708d 100%);padding:24px;text-align:center}
.header img{height:48px;mix-blend-mode:screen;margin-bottom:12px;display:block;margin-left:auto;margin-right:auto}
.header h1{color:#fff;font-size:20px;font-weight:700;margin-bottom:4px}
.header p{color:rgba(255,255,255,0.75);font-size:13px}
.container{max-width:580px;margin:0 auto;padding:24px 16px 60px}
.card{background:#fff;border-radius:14px;box-shadow:0 2px 12px rgba(0,0,0,0.08);overflow:hidden;margin-bottom:16px}
.card-header{padding:18px 22px;border-bottom:1px solid #e5e7eb}
.card-header h2{font-size:17px;font-weight:700;color:#0d3d4d}
.card-body{padding:20px 22px}
.badge{display:inline-flex;align-items:center;padding:4px 12px;border-radius:20px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:0.4px}
.badge-open{background:#dcfce7;color:#166534}
.badge-interest{background:#fef3c7;color:#92400e}
.badge-closed{background:#fee2e2;color:#991b1b}
.badge-draft{background:#f3f4f6;color:#6b7280}
.capacity-bar{background:#e5e7eb;border-radius:20px;height:8px;margin:10px 0 4px;overflow:hidden}
.capacity-fill{height:100%;border-radius:20px;background:#145466;transition:width 0.3s}
.capacity-fill.near-full{background:#f59e0b}
.capacity-fill.full{background:#dc2626}
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:0.4px;color:#6b7280;margin-bottom:6px}
.form-group input,.form-group select,.form-group textarea{
  width:100%;padding:10px 14px;border:1.5px solid #d1d5db;border-radius:8px;
  font-family:inherit;font-size:14px;outline:none;transition:border-color 0.2s;background:#fff}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:#145466}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:480px){.form-row{grid-template-columns:1fr}}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:13px 24px;border-radius:10px;
  font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;border:none;transition:all 0.15s;width:100%}
.btn-primary{background:#145466;color:#fff}
.btn-primary:hover{background:#0d3d4d}
.btn-primary:disabled{opacity:0.6;cursor:not-allowed}
.section-divider{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.6px;color:#145466;
  margin:20px 0 14px;padding-top:16px;border-top:1px solid #e5e7eb}
.price-tag{font-size:28px;font-weight:800;color:#0d3d4d;margin:10px 0 4px}
.price-tag span{font-size:14px;font-weight:400;color:#6b7280}
.alert{border-radius:10px;padding:14px 18px;font-size:13px;line-height:1.5;margin-bottom:16px}
.alert-success{background:#dcfce7;color:#166534;border:1px solid #bbf7d0}
.alert-error{background:#fee2e2;color:#991b1b;border:1px solid #fecaca}
.alert-info{background:#e0f2fe;color:#075985;border:1px solid #bae6fd}
.alert-waitlist{background:#fef3c7;color:#92400e;border:1px solid #fde68a}
#loading{text-align:center;padding:60px 20px;color:#6b7280;font-size:15px}
.spinner{width:32px;height:32px;border:3px solid #e5e7eb;border-top-color:#145466;
  border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 16px}
@keyframes spin{to{transform:rotate(360deg)}}
.instructor-card{display:flex;gap:14px;align-items:flex-start;padding:14px 0}
.instructor-avatar{width:56px;height:56px;border-radius:50%;background:#e0f2fe;display:flex;
  align-items:center;justify-content:center;font-size:20px;font-weight:800;color:#145466;flex-shrink:0;overflow:hidden}
.instructor-avatar img{width:100%;height:100%;object-fit:cover}
.required{color:#dc2626}
.hint{font-size:11px;color:#9ca3af;margin-top:3px}
.program-images{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin:12px 0}
.program-images img{width:100%;height:120px;object-fit:cover;border-radius:8px}
.program-info{font-size:14px;color:#374151;line-height:1.7;margin:10px 0}
.program-info h3{font-size:15px;font-weight:700;color:#0d3d4d;margin:14px 0 6px}
</style>
</head>
<body>
<div class="header">
  <img src="/static/images/hwtc_logo_white.png" alt="HWTC" onerror="this.style.display='none'"/>
  <h1 id="page-title">Program Registration</h1>
  <p>Horizon West Theatre Company</p>
</div>
<div class="container">
  <div id="loading"><div class="spinner"></div>Loading...</div>
  <div id="app" style="display:none"></div>
</div>
<script>
const pathParts = location.pathname.split('/').filter(Boolean)
const slug = pathParts[1] || ''
const isConfirmation = pathParts[2] === 'confirmation'
const urlParams = new URLSearchParams(location.search)
const regId = urlParams.get('reg')
let program = null

async function apiFetch(path, method, body){
  const opts = {method: method||'GET', headers:{'Content-Type':'application/json'}}
  if(body) opts.body = JSON.stringify(body)
  const r = await fetch(path, opts)
  return r.json()
}

function escHtml(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;') }
function fmtDate(d){ if(!d) return ''; try{ const dt=new Date(d+'T12:00:00'); return dt.toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'}) } catch(e){ return d } }
function fmtPrice(cents){ if(!cents) return 'Free'; return '$'+(cents/100).toFixed(2) }
function show(msg, type){ document.getElementById('form-alert').innerHTML = '<div class="alert alert-'+type+'" style="margin-bottom:12px">'+escHtml(msg)+'</div>' }

async function init(){
  if(isConfirmation && regId){ showConfirmation(); return }
  const data = await apiFetch('/api/public/program/'+slug)
  if(data.error){ showErr(data.error); return }
  program = data
  document.getElementById('page-title').textContent = program.name
  renderPage()
}

function showErr(msg){
  document.getElementById('loading').style.display='none'
  document.getElementById('app').style.display=''
  document.getElementById('app').innerHTML='<div class="alert alert-error">'+escHtml(msg)+'</div>'
}

function renderPage(){
  const el = document.getElementById('app')
  document.getElementById('loading').style.display='none'
  el.style.display=''
  const status = program.registration_status || 'draft'
  const badgeMap = {open:'badge-open',interest_list:'badge-interest',closed:'badge-closed',draft:'badge-draft'}
  const labelMap = {open:'Open',interest_list:'Interest List',closed:'Closed',draft:'Coming Soon'}
  const spotsLeft = program.spots_remaining
  const images = Array.isArray(program.program_images) ? program.program_images : []
  const customFields = Array.isArray(program.custom_fields) ? program.custom_fields : []
  const formType = program.registration_form_type || 'youth'

  // Capacity bar
  var capHTML = ''
  if(program.capacity){
    const pct = Math.round((program.registration_count/program.capacity)*100)
    const cls = pct>=90?'full':pct>=70?'near-full':''
    capHTML = '<div class="capacity-bar"><div class="capacity-fill '+cls+'" style="width:'+Math.min(pct,100)+'%"></div></div>'
      + '<div style="font-size:12px;color:#6b7280">'+program.registration_count+' / '+program.capacity+' spots filled'
      + (spotsLeft===0?'<strong style="color:#dc2626"> &middot; Full</strong>':spotsLeft<=3&&spotsLeft!==null?'<strong style="color:#f59e0b"> &middot; Only '+spotsLeft+' left!</strong>':'')+'</div>'
  }

  // Instructor
  var instrHTML = ''
  if(program.instructor_name){
    const photo = program.instructor_photo
      ? '<img src="'+escHtml(program.instructor_photo)+'" alt="'+escHtml(program.instructor_name)+'">'
      : program.instructor_name.charAt(0)
    instrHTML = '<div class="section-divider">Your Instructor</div>'
      + '<div class="instructor-card">'
      + '<div class="instructor-avatar">'+photo+'</div>'
      + '<div><div style="font-weight:700;font-size:15px">'+escHtml(program.instructor_name)+'</div>'
      + (program.instructor_bio?'<div style="font-size:13px;color:#6b7280;margin-top:4px;line-height:1.5">'+escHtml(program.instructor_bio)+'</div>':'')
      + '</div></div>'
  }

  // Program info (rich text stored as HTML)
  var infoHTML = ''
  if(program.program_info){
    infoHTML = '<div class="section-divider">About This Program</div><div class="program-info">'+program.program_info+'</div>'
  }

  // Images
  var imagesHTML = ''
  if(images.length){
    imagesHTML = '<div class="program-images">'
      + images.map(function(url){ return '<img src="'+escHtml(url)+'" alt="Program photo" loading="lazy">' }).join('')
      + '</div>'
  }

  // Action section
  var actionHTML = ''
  if(status==='open' && spotsLeft!==0){
    actionHTML = buildRegistrationForm(formType, customFields)
  } else if(status==='open' && spotsLeft===0){
    actionHTML = buildWaitlistForm(formType, customFields)
  } else if(status==='interest_list'){
    actionHTML = buildInterestForm()
  } else {
    actionHTML = '<div class="card"><div class="card-body"><div class="alert alert-info">Registrations are not currently open. Check back soon!</div></div></div>'
  }

  el.innerHTML =
    '<div class="card">'
    + '<div class="card-header"><div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px"><h2>'+escHtml(program.name)+'</h2><span class="badge '+(badgeMap[status]||'badge-draft')+'">'+(labelMap[status]||status)+'</span></div></div>'
    + '<div class="card-body">'
    + (program.description?'<p style="font-size:14px;color:#374151;margin-bottom:14px;line-height:1.6">'+escHtml(program.description)+'</p>':'')
    + (program.start_date?'<div style="font-size:13px;color:#6b7280;margin-bottom:8px"><strong style="color:#1a2332">Dates:</strong> '+fmtDate(program.start_date)+(program.end_date&&program.end_date!==program.start_date?' &rarr; '+fmtDate(program.end_date):'')+'</div>':'')
    + capHTML
    + (program.price?'<div class="price-tag">'+fmtPrice(program.price)+'<span> per participant</span></div>':'<div style="margin:10px 0;font-size:14px;font-weight:700;color:#166534">Free</div>')
    + imagesHTML
    + infoHTML
    + instrHTML
    + '</div></div>'
    + actionHTML
}

function customFieldInputs(fields){
  if(!fields||!fields.length) return ''
  return fields.map(function(f){
    var id = 'cf-'+f.name.replace(/\s+/g,'-').toLowerCase()
    var req = f.required ? '<span class="required">*</span>' : ''
    var input = ''
    if(f.type==='select' && f.options){
      input = '<select id="'+id+'"><option value="">Select...</option>'+f.options.map(function(o){ return '<option value="'+escHtml(o)+'">'+escHtml(o)+'</option>' }).join('')+'</select>'
    } else if(f.type==='textarea'){
      input = '<textarea id="'+id+'" rows="3" placeholder="'+(f.placeholder||'')+'"></textarea>'
    } else if(f.type==='checkbox'){
      input = '<label style="display:flex;align-items:center;gap:8px;cursor:pointer"><input type="checkbox" id="'+id+'" style="accent-color:#145466"/> '+escHtml(f.label||f.name)+'</label>'
    } else {
      input = '<input type="'+(f.type||'text')+'" id="'+id+'" placeholder="'+(f.placeholder||'')+'"/>'
    }
    return '<div class="form-group"><label>'+escHtml(f.name)+' '+req+'</label>'+input+(f.hint?'<div class="hint">'+escHtml(f.hint)+'</div>':'')+'</div>'
  }).join('')
}

function getCustomFieldValues(fields){
  if(!fields||!fields.length) return {}
  var vals = {}
  fields.forEach(function(f){
    var id = 'cf-'+f.name.replace(/\s+/g,'-').toLowerCase()
    var el = document.getElementById(id)
    if(!el) return
    vals[f.name] = el.type==='checkbox' ? el.checked : el.value
  })
  return vals
}

function buildRegistrationForm(formType, customFields){
  var isYouth = formType==='youth' || !formType
  var participantSection = isYouth
    ? '<div class="section-divider">Participant Information</div>'
      + '<div class="form-row"><div class="form-group"><label>First Name <span class="required">*</span></label><input id="f-first" placeholder="First name"/></div>'
      + '<div class="form-group"><label>Last Name <span class="required">*</span></label><input id="f-last" placeholder="Last name"/></div></div>'
      + '<div class="form-row"><div class="form-group"><label>Date of Birth <span class="required">*</span></label><input id="f-dob" type="date"/></div>'
      + '<div class="form-group"><label>T-Shirt Size</label><select id="f-shirt"><option value="">Select...</option><option>YXS</option><option>YS</option><option>YM</option><option>YL</option><option>YXL</option><option>AS</option><option>AM</option><option>AL</option><option>AXL</option></select></div></div>'
      + '<div class="section-divider">Parent / Guardian Information</div>'
      + '<div class="form-group"><label>Full Name <span class="required">*</span></label><input id="f-contact-name" placeholder="Parent or guardian name"/></div>'
      + '<div class="form-row"><div class="form-group"><label>Email <span class="required">*</span></label><input id="f-email" type="email" placeholder="your@email.com"/></div>'
      + '<div class="form-group"><label>Phone</label><input id="f-phone" type="tel" placeholder="(555) 555-5555"/></div></div>'
      + '<div class="section-divider">Emergency Contact</div>'
      + '<div class="form-row"><div class="form-group"><label>Name</label><input id="f-ec-name" placeholder="Emergency contact"/></div>'
      + '<div class="form-group"><label>Phone</label><input id="f-ec-phone" type="tel" placeholder="(555) 555-5555"/></div></div>'
    : '<div class="section-divider">Your Information</div>'
      + '<div class="form-row"><div class="form-group"><label>First Name <span class="required">*</span></label><input id="f-first" placeholder="First name"/></div>'
      + '<div class="form-group"><label>Last Name <span class="required">*</span></label><input id="f-last" placeholder="Last name"/></div></div>'
      + '<div class="form-row"><div class="form-group"><label>Age</label><input id="f-age" type="number" min="0" max="120" placeholder="Your age"/></div>'
      + '<div class="form-group"><label>T-Shirt Size</label><select id="f-shirt"><option value="">Select...</option><option>XS</option><option>S</option><option>M</option><option>L</option><option>XL</option><option>XXL</option></select></div></div>'
      + '<div class="form-group"><label>Email <span class="required">*</span></label><input id="f-email" type="email" placeholder="your@email.com"/></div>'
      + '<div class="form-group"><label>Phone</label><input id="f-phone" type="tel" placeholder="(555) 555-5555"/></div>'

  return '<div class="card"><div class="card-header"><h2>Register</h2></div><div class="card-body">'
    + '<div id="form-alert"></div>'
    + participantSection
    + (customFields.length ? '<div class="section-divider">Additional Information</div>'+customFieldInputs(customFields) : '')
    + (isYouth
        ? '<div id="sibling-list"></div>'
          + '<button type="button" id="add-sibling-btn" style="margin:4px 0 16px;padding:8px 16px;background:#e0f2fe;color:#145466;border:1.5px solid #145466;border-radius:8px;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer">+ Add Another Child</button>'
        : '')
    + '<div class="form-group" style="margin-top:8px"><label>Notes / Special Needs</label><textarea id="f-notes" rows="2" placeholder="Anything we should know..."></textarea></div>'
    + (program.price > 0 ? '<div id="payment-options-section">'+buildPaymentOptions(program)+'</div>' : '')
    + '<button class="btn btn-primary" style="margin-top:8px" id="submit-btn">'+(program.price ? 'Continue to Payment &rarr;' : 'Complete Registration')+'</button>'
    + '</div></div>'
}

function buildWaitlistForm(formType, customFields){
  var isYouth = formType==='youth' || !formType
  return '<div class="card"><div class="card-header"><h2>Join the Waitlist</h2></div><div class="card-body">'
    + '<div class="alert alert-waitlist" style="margin-bottom:16px">This program is currently full. Join the waitlist and we will contact you if a spot opens up.</div>'
    + '<div id="form-alert"></div>'
    + (isYouth
      ? '<div class="form-row"><div class="form-group"><label>Child First Name <span class="required">*</span></label><input id="f-first" placeholder="First name"/></div>'
        + '<div class="form-group"><label>Child Last Name <span class="required">*</span></label><input id="f-last" placeholder="Last name"/></div></div>'
        + '<div class="form-group"><label>Parent / Guardian Name <span class="required">*</span></label><input id="f-contact-name" placeholder="Your name"/></div>'
      : '<div class="form-row"><div class="form-group"><label>First Name <span class="required">*</span></label><input id="f-first" placeholder="First name"/></div>'
        + '<div class="form-group"><label>Last Name</label><input id="f-last" placeholder="Last name"/></div></div>'
    )
    + '<div class="form-row"><div class="form-group"><label>Email <span class="required">*</span></label><input id="f-email" type="email" placeholder="your@email.com"/></div>'
    + '<div class="form-group"><label>Phone</label><input id="f-phone" type="tel" placeholder="(555) 555-5555"/></div></div>'
    + '<button class="btn btn-primary" style="margin-top:8px" id="submit-btn">Join Waitlist</button>'
    + '</div></div>'
}

function buildInterestForm(){
  return '<div class="card"><div class="card-header"><h2>Join the Interest List</h2></div><div class="card-body">'
    + '<p style="font-size:13px;color:#6b7280;margin-bottom:16px">Registrations are not open yet. Add your name and we will email you when they open.</p>'
    + '<div id="form-alert"></div>'
    + '<div class="form-group"><label>Your Name <span class="required">*</span></label><input id="f-contact-name" placeholder="Your name"/></div>'
    + '<div class="form-group"><label>Email <span class="required">*</span></label><input id="f-email" type="email" placeholder="your@email.com"/></div>'
    + '<div class="form-row"><div class="form-group"><label>Phone</label><input id="f-phone" type="tel" placeholder="(555) 555-5555"/></div>'
    + '<div class="form-group"><label>Participant Name</label><input id="f-first" placeholder="Who is registering?"/></div></div>'
    + '<div class="form-group"><label>Age</label><input id="f-age" type="number" placeholder="Age" min="0" max="120"/></div>'
    + '<button class="btn btn-primary" style="margin-top:8px" id="submit-btn">Join Interest List</button>'
    + '</div></div>'
}

// ── Discount / sibling state ──────────────────────────────────
var _promoResult = null   // last validated promo {valid, discount_amount, label, _code, ...}
var _siblingCount = 0

function buildPaymentOptions(prog){
  const price = prog.price || 0
  const deposit = prog.deposit_amount || 0
  const hasDeposit = deposit > 0 && deposit < price
  const sibCount = document.querySelectorAll('.sibling-block').length
  const numParticipants = 1 + sibCount
  const hasSibDiscount = prog.sibling_discount_enabled && sibCount > 0
  const sibDiscType = prog.sibling_discount_type || 'percent'
  const sibDiscVal = prog.sibling_discount_value || 0

  // Promo discount
  let promoDiscount = 0
  let promoLabel = ''
  if(_promoResult && _promoResult.valid){
    promoDiscount = _promoResult.discount_amount || 0
    promoLabel = _promoResult.label || ''
  }

  // Auto sibling discount
  let sibDiscount = 0
  if(hasSibDiscount){
    const perSib = sibDiscType==='percent' ? Math.floor(price * sibDiscVal / 100) : Math.min(sibDiscVal, price)
    sibDiscount = perSib * sibCount
  }

  const basket = price * numParticipants
  const totalDiscount = promoDiscount + sibDiscount
  const finalPrice = Math.max(0, basket - totalDiscount)

  let html = '<div style="border-top:1px solid #e5e7eb;margin-top:16px;padding-top:16px">'

  // Discount code input
  const codeVal = (_promoResult && _promoResult._code) ? escHtml(_promoResult._code) : ''
  const codeBorder = _promoResult ? (_promoResult.valid ? '#86efac' : '#fca5a5') : '#d1d5db'
  const codeMsg = _promoResult
    ? (_promoResult.valid
        ? '<span style="color:#166534;font-weight:600">✓ '+escHtml(promoLabel)+'</span>'
        : '<span style="color:#dc2626">'+escHtml(_promoResult.error||'Invalid code')+'</span>')
    : ''
  html += '<div class="form-group"><label>Discount / Coupon Code</label>'
    + '<div style="display:flex;gap:8px">'
    + '<input id="f-discount-code" value="'+codeVal+'" placeholder="Enter code" style="flex:1;padding:10px 14px;border:1.5px solid '+codeBorder+';border-radius:8px;font-family:inherit;font-size:14px;outline:none;text-transform:uppercase"/>'
    + '<button type="button" id="apply-discount-btn" style="padding:10px 16px;background:#f3f4f6;border:1.5px solid #d1d5db;border-radius:8px;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap">Apply</button>'
    + '</div>'
    + '<div id="discount-result" style="margin-top:6px;font-size:13px">'+codeMsg+'</div>'
    + '</div>'

  // Order summary (when price > 0)
  if(price > 0){
    html += '<div style="background:#f8fafc;border:1px solid #e5e7eb;border-radius:10px;padding:14px;margin-bottom:14px">'
      + '<div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;color:#6b7280;margin-bottom:10px">Order Summary</div>'

    // Base line
    if(numParticipants === 1){
      html += summaryLine('Program fee', price)
    } else {
      html += summaryLine('Program fee &times; '+numParticipants+' participants', basket)
        + '<div style="font-size:12px;color:#9ca3af;margin:-4px 0 8px 4px">$'+(price/100).toFixed(2)+' each</div>'
    }

    // Auto sibling discount
    if(hasSibDiscount && sibDiscount > 0){
      const sl = sibDiscType==='percent'
        ? 'Sibling discount ('+sibDiscVal+'% &times; '+sibCount+')'
        : 'Sibling discount ($'+(sibDiscVal/100).toFixed(2)+' &times; '+sibCount+')'
      html += summaryLine(sl, -sibDiscount, '#166534')
    }

    // Promo discount
    if(promoDiscount > 0){
      html += summaryLine('Code: '+escHtml(_promoResult._code||''), -promoDiscount, '#166534')
    }

    // Total
    html += '<div style="border-top:1px solid #d1d5db;margin:8px 0"></div>'
      + summaryLine('<strong>Total</strong>', finalPrice, null, true)
      + '</div>'
  }

  // Payment plan
  if(hasDeposit && finalPrice > 0){
    const balance = finalPrice - deposit
    html += '<div class="form-group" style="margin-top:4px"><label>Payment Option</label>'
      + '<div style="display:flex;flex-direction:column;gap:8px">'
      + '<label style="display:flex;align-items:flex-start;gap:10px;padding:12px 14px;border:1.5px solid #d1d5db;border-radius:8px;cursor:pointer">'
      + '<input type="radio" name="payment-type" value="full" checked style="margin-top:2px;accent-color:#145466"/>'
      + '<div><div style="font-weight:600;font-size:14px">Pay in full — $'+(finalPrice/100).toFixed(2)+'</div>'
      + '<div style="font-size:12px;color:#6b7280">One payment today</div></div></label>'
      + '<label style="display:flex;align-items:flex-start;gap:10px;padding:12px 14px;border:1.5px solid #d1d5db;border-radius:8px;cursor:pointer">'
      + '<input type="radio" name="payment-type" value="deposit" style="margin-top:2px;accent-color:#145466"/>'
      + '<div><div style="font-weight:600;font-size:14px">Pay deposit — $'+(deposit/100).toFixed(2)+' today</div>'
      + '<div style="font-size:12px;color:#6b7280">Remaining $'+(balance/100).toFixed(2)+' due before program starts</div></div></label>'
      + '</div></div>'
  }

  html += '</div>'
  return html
}

function summaryLine(label, cents, color, bold){
  const neg = cents < 0
  const abs = Math.abs(cents)
  const val = (neg ? '−' : '') + '$' + (abs/100).toFixed(2)
  const st = color ? ' style="color:'+color+'"' : ''
  const bst = bold ? 'font-weight:700;' : ''
  return '<div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;font-size:14px;'+bst+'">'
    + '<span'+st+'>'+label+'</span><span'+st+'>'+val+'</span></div>'
}

function refreshCheckout(){
  var po = document.getElementById('payment-options-section')
  if(po && program) po.innerHTML = buildPaymentOptions(program)
}

document.addEventListener('click', function(e){
  if(e.target && e.target.id === 'apply-discount-btn'){
    applyDiscount(); return
  }
  if(e.target && e.target.id === 'add-sibling-btn'){
    addSiblingBlock(); return
  }
  if(e.target && e.target.id==='submit-btn'){
    e.preventDefault()
    const status = program && program.registration_status
    if(status==='interest_list') submitInterest()
    else submitRegistration()
  }
})

async function applyDiscount(){
  const codeEl = document.getElementById('f-discount-code')
  const code = (codeEl||{}).value||''
  if(!code.trim()){
    _promoResult = null
    refreshCheckout()
    return
  }
  const numRegs = 1 + document.querySelectorAll('.sibling-block').length
  const res = await apiFetch('/api/public/program/'+slug+'/validate-discount','POST',{
    code: code.trim().toUpperCase(), num_registrations: numRegs
  })
  res._code = code.trim().toUpperCase()
  _promoResult = res
  refreshCheckout()
  // Re-focus code input after DOM rebuild
  var el = document.getElementById('f-discount-code')
  if(el) el.value = res._code
}

function addSiblingBlock(){
  _siblingCount++
  const idx = _siblingCount
  const container = document.getElementById('sibling-list')
  if(!container) return
  const block = document.createElement('div')
  block.className = 'sibling-block'
  block.dataset.idx = idx
  block.style.cssText = 'border:1.5px solid #e5e7eb;border-radius:10px;padding:14px;margin-bottom:12px;position:relative'
  block.innerHTML = '<div style="font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:0.4px;color:#145466;margin-bottom:10px">Child #'+(idx+1)+'</div>'
    + '<button type="button" class="sib-remove-btn" style="position:absolute;top:10px;right:10px;background:none;border:none;font-size:18px;cursor:pointer;color:#9ca3af">&times;</button>'
    + '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">'
    + '<div><label style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.4px;color:#6b7280;display:block;margin-bottom:4px">First Name</label>'
    + '<input class="sib-first" placeholder="First name" style="width:100%;padding:9px 12px;border:1.5px solid #d1d5db;border-radius:8px;font-family:inherit;font-size:13px;outline:none;box-sizing:border-box"/></div>'
    + '<div><label style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.4px;color:#6b7280;display:block;margin-bottom:4px">Last Name</label>'
    + '<input class="sib-last" placeholder="Last name" style="width:100%;padding:9px 12px;border:1.5px solid #d1d5db;border-radius:8px;font-family:inherit;font-size:13px;outline:none;box-sizing:border-box"/></div>'
    + '</div>'
    + '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px">'
    + '<div><label style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.4px;color:#6b7280;display:block;margin-bottom:4px">Date of Birth</label>'
    + '<input type="date" class="sib-dob" style="width:100%;padding:9px 12px;border:1.5px solid #d1d5db;border-radius:8px;font-family:inherit;font-size:13px;outline:none;box-sizing:border-box"/></div>'
    + '<div><label style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.4px;color:#6b7280;display:block;margin-bottom:4px">T-Shirt Size</label>'
    + '<select class="sib-shirt" style="width:100%;padding:9px 12px;border:1.5px solid #d1d5db;border-radius:8px;font-family:inherit;font-size:13px;outline:none">'
    + '<option value="">Select...</option><option>YXS</option><option>YS</option><option>YM</option><option>YL</option><option>YXL</option><option>AS</option><option>AM</option><option>AL</option><option>AXL</option></select></div>'
    + '</div>'
  block.querySelector('.sib-remove-btn').addEventListener('click', function(){
    block.remove()
    refreshCheckout()
  })
  container.appendChild(block)
  refreshCheckout()
}

function getSiblings(){
  var result = []
  document.querySelectorAll('.sibling-block').forEach(function(b){
    result.push({
      first_name: (b.querySelector('.sib-first')||{}).value||'',
      last_name: (b.querySelector('.sib-last')||{}).value||'',
      dob: (b.querySelector('.sib-dob')||{}).value||'',
      shirt_size: (b.querySelector('.sib-shirt')||{}).value||'',
    })
  })
  return result
}

async function submitRegistration(){
  const btn = document.getElementById('submit-btn')
  const email = (document.getElementById('f-email')||{}).value||''
  const firstName = (document.getElementById('f-first')||{}).value||''
  const formType = (program && program.registration_form_type) || 'youth'
  const isYouth = formType==='youth' || !formType
  const contactName = isYouth
    ? ((document.getElementById('f-contact-name')||{}).value||'')
    : firstName + ' ' + ((document.getElementById('f-last')||{}).value||'')

  if(!email.trim() || !firstName.trim() || (isYouth && !contactName.trim())){
    show('Please fill in all required fields.','error'); return
  }
  btn.disabled=true; btn.textContent='Submitting...'
  document.getElementById('form-alert').innerHTML=''

  const customFields = (program && program.custom_fields) || []
  const payload = {
    type: program.spots_remaining===0 ? 'waitlist' : 'registration',
    registration_form_type: formType,
    guardian_name: isYouth ? contactName : (firstName+' '+((document.getElementById('f-last')||{}).value||'')).trim(),
    guardian_email: email.trim(),
    guardian_phone: ((document.getElementById('f-phone')||{}).value||'').trim(),
    child_first_name: isYouth ? firstName.trim() : firstName.trim(),
    child_last_name: isYouth ? ((document.getElementById('f-last')||{}).value||'').trim() : ((document.getElementById('f-last')||{}).value||'').trim(),
    child_dob: ((document.getElementById('f-dob')||{}).value)||'',
    participant_age: ((document.getElementById('f-age')||{}).value)||'',
    shirt_size: ((document.getElementById('f-shirt')||{}).value)||'',
    emergency_contact_name: ((document.getElementById('f-ec-name')||{}).value||'').trim(),
    emergency_contact_phone: ((document.getElementById('f-ec-phone')||{}).value||'').trim(),
    notes: ((document.getElementById('f-notes')||{}).value||'').trim(),
    custom_field_values: getCustomFieldValues(customFields),
    siblings: getSiblings(),
    discount_code: (_promoResult && _promoResult.valid) ? (_promoResult._code||'') : '',
    payment_type: (document.querySelector('input[name="payment-type"]:checked')||{}).value||'full',
  }

  const res = await apiFetch('/api/public/program/'+slug+'/register','POST',payload)
  if(res.error){ show(res.error,'error'); btn.disabled=false; btn.textContent=program.price?'Continue to Payment \u2192':'Complete Registration'; return }

  if(res.type==='payment_required'){
    btn.textContent='Redirecting to payment...'
    if(res.use_deposit){
      btn.textContent = 'Redirecting to pay deposit...'
    }
    window.location.href = res.payment_url
  } else if(res.type==='waitlisted'){
    document.getElementById('app').innerHTML='<div class="card"><div class="card-body" style="text-align:center;padding:40px 24px"><div style="font-size:48px;margin-bottom:16px">\u23f3</div><h2 style="color:#92400e;margin-bottom:8px">You\'re on the waitlist!</h2><p style="color:#6b7280;font-size:14px">You are <strong>#'+res.position+'</strong> on the waitlist. We will email you at '+escHtml(email)+' if a spot opens up.</p></div></div>'
  } else {
    document.getElementById('app').innerHTML='<div class="card"><div class="card-body" style="text-align:center;padding:40px 24px"><div style="font-size:48px;margin-bottom:16px">\u2713</div><h2 style="color:#166534;margin-bottom:8px">Registration Confirmed!</h2><p style="color:#6b7280;font-size:14px">A confirmation will be sent to '+escHtml(email)+'.</p></div></div>'
  }
}

async function submitInterest(){
  const btn = document.getElementById('submit-btn')
  const email = (document.getElementById('f-email')||{}).value||''
  const name = (document.getElementById('f-contact-name')||{}).value||''
  if(!email.trim()||!name.trim()){ show('Name and email are required.','error'); return }
  btn.disabled=true; btn.textContent='Submitting...'
  const res = await apiFetch('/api/public/program/'+slug+'/register','POST',{
    type:'interest', name:name.trim(), email:email.trim(),
    phone:((document.getElementById('f-phone')||{}).value||'').trim(),
    child_name:((document.getElementById('f-first')||{}).value||'').trim(),
    child_age:((document.getElementById('f-age')||{}).value||'').trim(),
  })
  if(res.error){ show(res.error,'error'); btn.disabled=false; btn.textContent='Join Interest List'; return }
  document.getElementById('app').innerHTML='<div class="card"><div class="card-body" style="text-align:center;padding:40px 24px"><div style="font-size:48px;margin-bottom:16px">\u2713</div><p style="font-size:15px;color:#374151">You\'re on the interest list! We\'ll email <strong>'+escHtml(email)+'</strong> when registrations open.</p></div></div>'
}

async function showConfirmation(){
  document.getElementById('loading').style.display='none'
  const el = document.getElementById('app')
  el.style.display=''
  const [reg, pData] = await Promise.all([
    apiFetch('/api/public/program/'+slug+'/registration/'+regId),
    apiFetch('/api/public/program/'+slug)
  ])
  const pName = pData && pData.name ? pData.name : 'the program'
  if(reg.status==='confirmed'){
    el.innerHTML='<div class="card"><div class="card-body" style="text-align:center;padding:40px 24px"><div style="font-size:48px;margin-bottom:16px">\u2713</div><h2 style="color:#166534;margin-bottom:8px">Registration Confirmed!</h2><p style="color:#6b7280;font-size:14px">'+escHtml(reg.child_first_name||'')+(reg.child_first_name?' is registered for ':'You are registered for ')+'<strong>'+escHtml(pName)+'</strong>.</p></div></div>'
  } else if(reg.status==='pending_payment'){
    el.innerHTML='<div class="card"><div class="card-body" style="text-align:center;padding:40px 24px"><div style="font-size:48px;margin-bottom:16px">\u23f3</div><h2 style="color:#92400e;margin-bottom:8px">Payment Pending</h2><p style="color:#6b7280;font-size:14px">Waiting to confirm your payment. Check your email for a receipt.</p></div></div>'
  } else {
    el.innerHTML='<div class="card"><div class="card-body"><div class="alert alert-info">Registration status: '+escHtml(reg.status||'')+'</div></div></div>'
  }
}

init()
</script>
