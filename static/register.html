<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register — Horizon West Theater Company</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',-apple-system,sans-serif;background:#f0f4f8;min-height:100vh;color:#1a2332}
.header{background:linear-gradient(135deg,#0d3d4d 0%,#145466 60%,#1b708d 100%);padding:24px;text-align:center;position:relative}
.header img{height:64px;mix-blend-mode:screen;margin-bottom:10px;display:block;margin-left:auto;margin-right:auto}
.header h1{color:#fff;font-size:20px;font-weight:700;margin-bottom:4px}
.header p{color:rgba(255,255,255,0.75);font-size:13px}
.container{max-width:580px;margin:0 auto;padding:24px 16px 60px}
.card{background:#fff;border-radius:14px;box-shadow:0 2px 12px rgba(0,0,0,0.08);overflow:hidden;margin-bottom:16px}
.card-header{padding:18px 22px;border-bottom:1px solid #e5e7eb}
.card-header h2{font-size:17px;font-weight:700;color:#0d3d4d}
.card-body{padding:20px 22px}
.badge{display:inline-flex;align-items:center;padding:4px 12px;border-radius:20px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:0.4px}
.badge-open{background:#dcfce7;color:#166534}
.badge-interest{background:#fef3c7;color:#92400e}
.badge-closed{background:#fee2e2;color:#991b1b}
.badge-draft{background:#f3f4f6;color:#6b7280}
.capacity-bar{background:#e5e7eb;border-radius:20px;height:8px;margin:10px 0 4px;overflow:hidden}
.capacity-fill{height:100%;border-radius:20px;background:#145466;transition:width 0.3s}
.capacity-fill.near-full{background:#f59e0b}
.capacity-fill.full{background:#dc2626}
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:0.4px;color:#6b7280;margin-bottom:6px}
.form-group input,.form-group select,.form-group textarea{
  width:100%;padding:10px 14px;border:1.5px solid #d1d5db;border-radius:8px;
  font-family:inherit;font-size:14px;outline:none;transition:border-color 0.2s;background:#fff}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:#145466}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:480px){.form-row{grid-template-columns:1fr}}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:13px 24px;border-radius:10px;
  font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;border:none;transition:all 0.15s;width:100%}
.btn-primary{background:#145466;color:#fff}
.btn-primary:hover{background:#0d3d4d}
.btn-primary:disabled{opacity:0.6;cursor:not-allowed}
.section-divider{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.6px;color:#145466;
  margin:20px 0 14px;padding-top:16px;border-top:1px solid #e5e7eb}
.price-tag{font-size:28px;font-weight:800;color:#0d3d4d;margin:10px 0 4px}
.price-tag span{font-size:14px;font-weight:400;color:#6b7280}
.alert{border-radius:10px;padding:14px 18px;font-size:13px;line-height:1.5;margin-bottom:16px}
.alert-success{background:#dcfce7;color:#166534;border:1px solid #bbf7d0}
.alert-error{background:#fee2e2;color:#991b1b;border:1px solid #fecaca}
.alert-info{background:#e0f2fe;color:#075985;border:1px solid #bae6fd}
.alert-waitlist{background:#fef3c7;color:#92400e;border:1px solid #fde68a}
#loading{text-align:center;padding:60px 20px;color:#6b7280;font-size:15px}
.spinner{width:32px;height:32px;border:3px solid #e5e7eb;border-top-color:#145466;
  border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 16px}
@keyframes spin{to{transform:rotate(360deg)}}
.instructor-card{display:flex;gap:14px;align-items:flex-start;padding:14px 0}
.instructor-avatar{width:56px;height:56px;border-radius:50%;background:#e0f2fe;display:flex;
  align-items:center;justify-content:center;font-size:20px;font-weight:800;color:#145466;flex-shrink:0;overflow:hidden}
.instructor-avatar img{width:100%;height:100%;object-fit:cover}
.required{color:#dc2626}
.hint{font-size:11px;color:#9ca3af;margin-top:3px}
.program-images{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin:12px 0}
.program-images img{width:100%;height:120px;object-fit:cover;border-radius:8px}
.program-info{font-size:14px;color:#374151;line-height:1.7;margin:10px 0}
.program-info p{margin:0 0 0.8em}
.program-info p:last-child{margin-bottom:0}
.program-info h1,.program-info h2,.program-info h3{font-weight:700;color:#0d3d4d;margin:1em 0 0.4em;line-height:1.3}
.program-info h1{font-size:18px}
.program-info h2{font-size:16px}
.program-info h3{font-size:15px}
.program-info ul,.program-info ol{padding-left:1.5em;margin:0.5em 0 0.8em}
.program-info li{margin-bottom:0.3em}
.program-info strong{font-weight:700}
.program-info em{font-style:italic}
.program-info u{text-decoration:underline}
.program-info s{text-decoration:line-through}
.program-info a{color:#145466;text-decoration:underline}
.program-info br{display:block;content:'';margin-top:0.4em}
</style>
</head>
<body>
<div class="header">
  <img src="/static/images/hwtc_logo_white.png" alt="HWTC" onerror="this.style.display='none'"/>
  <h1 id="page-title">Registration</h1>
  <div id="header-cart" style="display:none;position:absolute;top:16px;right:16px">
    <button onclick="toggleCartDrawer()" style="background:rgba(255,255,255,0.15);border:1.5px solid rgba(255,255,255,0.4);border-radius:10px;padding:8px 14px;cursor:pointer;display:flex;align-items:center;gap:8px;color:#fff;font-family:inherit;font-size:13px;font-weight:700">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
      <span id="cart-header-count">0</span>
    </button>
  </div>
</div>
<div id="cart-drawer" style="display:none;position:fixed;top:0;right:0;width:340px;max-width:95vw;height:100vh;background:var(--surface,#fff);box-shadow:-4px 0 24px rgba(0,0,0,0.18);z-index:9999;overflow-y:auto;padding:20px">
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">
    <div style="font-size:16px;font-weight:800;color:#0d3d4d">Your Cart</div>
    <button onclick="toggleCartDrawer()" style="background:none;border:none;font-size:24px;cursor:pointer;color:#6b7280;line-height:1">×</button>
  </div>
  <div id="cart-drawer-items"></div>
  <div id="cart-drawer-footer" style="margin-top:16px"></div>
</div>
<div id="cart-drawer-overlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.3);z-index:9998" onclick="toggleCartDrawer()"></div>
<div class="container">
  <div id="loading"><div class="spinner"></div>Loading...</div>
  <div id="app" style="display:none"></div>
</div>
<script>
const pathParts = location.pathname.split('/').filter(Boolean)
// pathParts[0] = 'register', pathParts[1] = slug OR 'production', pathParts[2] = slug (if production)
const isProduction = pathParts[1] === 'production'
const slug = isProduction ? (pathParts[2] || '') : (pathParts[1] || '')
const isConfirmation = isProduction ? pathParts[3] === 'confirmation' : pathParts[2] === 'confirmation'
const apiBase = isProduction ? '/api/public/production/' : '/api/public/program/'
const urlParams = new URLSearchParams(location.search)
const regId = urlParams.get('reg')
let program = null

async function apiFetch(path, method, body){
  const opts = {method: method||'GET', headers:{'Content-Type':'application/json'}}
  if(body) opts.body = JSON.stringify(body)
  const r = await fetch(path, opts)
  return r.json()
}

function escHtml(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;') }
function fmtDate(d){ if(!d) return ''; try{ var dt=new Date(d+'T12:00:00'); return dt.toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'}) } catch(e){ return d } }
function fmtPrice(cents){ if(!cents) return 'Free'; return '$'+(cents/100).toFixed(2) }
function show(msg, type){ document.getElementById('form-alert').innerHTML = '<div class="alert alert-'+type+'" style="margin-bottom:12px">'+escHtml(msg)+'</div>' }

function fmtTime(t){
  if(!t) return ''
  try{
    var parts = t.split(':')
    var h = parseInt(parts[0]), m = parts[1]
    var ampm = h >= 12 ? 'PM' : 'AM'
    h = h % 12 || 12
    return h + (m && m!=='00' ? ':'+m : '') + ' ' + ampm
  }catch(e){ return t }
}

function buildScheduleHTML(prog){
  var type = prog.schedule_type || 'date_range'
  var startTime = prog.meeting_start_time ? fmtTime(prog.meeting_start_time) : ''
  var endTime = prog.meeting_end_time ? fmtTime(prog.meeting_end_time) : ''
  var timeStr = startTime ? (startTime + (endTime ? ' \u2013 ' + endTime : '')) : ''
  var lines = []
  // Skip dates when sessions are enabled — each session has its own date
  if(!prog.sessions_enabled){
    if(type === 'single' && prog.single_date){
      lines.push('\uD83D\uDCC5 ' + fmtDate(prog.single_date))
    } else if(type === 'recurring'){
      var days = Array.isArray(prog.meeting_days) ? prog.meeting_days : []
      if(days.length) lines.push('\uD83D\uDCC5 Every ' + days.join(', '))
      if(prog.start_date) lines.push('\uD83D\uDDD3 ' + fmtDate(prog.start_date) + (prog.end_date && prog.end_date !== prog.start_date ? ' \u2013 ' + fmtDate(prog.end_date) : ''))
    } else {
      if(prog.start_date) lines.push('\uD83D\uDCC5 ' + fmtDate(prog.start_date) + (prog.end_date && prog.end_date !== prog.start_date ? ' \u2013 ' + fmtDate(prog.end_date) : ''))
    }
  }
  if(timeStr) lines.push('\uD83D\uDD50 ' + timeStr)
  if(prog.schedule_notes) lines.push('\u2139\uFE0F ' + escHtml(prog.schedule_notes))
  if(!lines.length) return ''
  return '<div style="font-size:13px;color:#6b7280;margin-bottom:10px;display:flex;flex-direction:column;gap:3px">'
    + lines.map(function(l){ return '<div>'+l+'</div>' }).join('')
    + '</div>'
}

async function init(){
  if(isConfirmation && regId){ showConfirmation(); return }
  const data = await apiFetch(apiBase+slug)
  if(data.error){ showErr(data.error); return }
  program = data
  document.getElementById('page-title').textContent = program.name
  if(isProduction){
    document.querySelector('.header h1') && (document.querySelector('.header h1').textContent = program.name)
  }
  // Load sessions if enabled (programs only for now)
  if(program.sessions_enabled && !isProduction){
    const sd = await apiFetch('/api/public/program/'+slug+'/sessions')
    program._sessions = Array.isArray(sd) ? sd : []
  }
  renderPage()
  updateHeaderCart()
}

function showErr(msg){
  document.getElementById('loading').style.display='none'
  document.getElementById('app').style.display=''
  document.getElementById('app').innerHTML='<div class="alert alert-error">'+escHtml(msg)+'</div>'
}

function renderPage(){
  const el = document.getElementById('app')
  document.getElementById('loading').style.display='none'
  el.style.display=''
  updateHeaderCart()

  const status = program.registration_status || 'draft'
  const badgeMap = {open:'badge-open',interest_list:'badge-interest',closed:'badge-closed',draft:'badge-draft'}
  const labelMap = {open:'Open',interest_list:'Interest List',closed:'Closed',draft:'Coming Soon'}
  const spotsLeft = program.spots_remaining
  const images = Array.isArray(program.program_images) ? program.program_images : []
  const uniqueImages = images.filter(function(u,i,a){ return a.indexOf(u)===i })
  const customFields = Array.isArray(program.custom_fields) ? program.custom_fields : []
  const formType = program.registration_form_type || 'youth'

  // Capacity bar — only show if show_capacity_public is not explicitly false
  var showCap = program.show_capacity_public !== false
  var showAlmost = program.show_almost_sold_out !== false
  var capHTML = ''
  if(showCap && program.sessions_enabled && program._sessions && program._sessions.length){
    var totalCap = 0, totalEnrolled = 0, hasAnyCap = false
    program._sessions.forEach(function(s){
      if(s.capacity){ hasAnyCap = true; totalCap += parseInt(s.capacity||0) }
      totalEnrolled += parseInt(s.enrolled_count||0)
    })
    if(hasAnyCap){
      var pctSess = Math.round((totalEnrolled/totalCap)*100)
      var clsSess = pctSess>=90?'full':pctSess>=70?'near-full':''
      var spotsLeftSess = totalCap - totalEnrolled
      capHTML = '<div class="capacity-bar"><div class="capacity-fill '+clsSess+'" style="width:'+Math.min(pctSess,100)+'%"></div></div>'
        + '<div style="font-size:12px;color:#6b7280">'+totalEnrolled+' / '+totalCap+' spots filled across sessions'
        + (spotsLeftSess<=0?'<strong style="color:#dc2626"> &middot; All Full</strong>'
          :showAlmost&&pctSess>=90?'<strong style="color:#d97706"> &middot; Almost Sold Out!</strong>'
          :spotsLeftSess<=5?'<strong style="color:#f59e0b"> &middot; Only '+spotsLeftSess+' left!</strong>':'')+'</div>'
    }
  } else if(showCap && program.capacity){
    const pct = Math.round(((program.registration_count||0)/program.capacity)*100)
    const cls = pct>=90?'full':pct>=70?'near-full':''
    capHTML = '<div class="capacity-bar"><div class="capacity-fill '+cls+'" style="width:'+Math.min(pct,100)+'%"></div></div>'
      + '<div style="font-size:12px;color:#6b7280">'+(program.registration_count||0)+' / '+program.capacity+' spots filled'
      + (spotsLeft===0?'<strong style="color:#dc2626"> &middot; Full</strong>'
        :showAlmost&&pct>=90?'<strong style="color:#d97706"> &middot; Almost Sold Out!</strong>'
        :spotsLeft<=3&&spotsLeft!==null?'<strong style="color:#f59e0b"> &middot; Only '+spotsLeft+' left!</strong>':'')+'</div>'
  }

  // Instructor
  var instrHTML = ''
  if(program.instructor_name){
    const photo = program.instructor_photo
      ? '<img src="'+escHtml(program.instructor_photo)+'" alt="'+escHtml(program.instructor_name)+'">'
      : program.instructor_name.charAt(0)
    instrHTML = '<div class="section-divider">Your Instructor</div>'
      + '<div class="instructor-card">'
      + '<div class="instructor-avatar">'+photo+'</div>'
      + '<div><div style="font-weight:700;font-size:15px">'+escHtml(program.instructor_name)+'</div>'
      + (program.instructor_bio?'<div style="font-size:13px;color:#6b7280;margin-top:4px;line-height:1.5">'+escHtml(program.instructor_bio)+'</div>':'')
      + '</div></div>'
  }

  // Program info (rich text stored as HTML)
  var infoHTML = ''
  if(program.program_info){
    infoHTML = '<div class="section-divider">About This '+(isProduction?'Production':'Program')+'</div><div class="program-info">'+program.program_info+'</div>'
  }
  if(program.registration_note){
    infoHTML += '<div style="font-size:12px;color:#6b7280;font-style:italic;margin-top:8px;padding:8px 12px;background:#f8fafc;border-left:3px solid #d1d5db;border-radius:0 6px 6px 0;line-height:1.5">'+escHtml(program.registration_note)+'</div>'
  }

  // Cover image / photo gallery — deduplicate, show cover at top, rest in body
  var imagesHTML = uniqueImages.length > 1
    ? '<div class="program-images" style="margin-bottom:8px">'
      + uniqueImages.slice(1).map(function(url){ return '<img src="'+escHtml(url)+'" alt="Program photo" loading="lazy">' }).join('')
      + '</div>'
    : ''

  // Action section
  var actionHTML = ''
  if(status==='open' && spotsLeft!==0){
    actionHTML = buildRegistrationForm(formType, customFields, showCap, showAlmost)
  } else if(status==='open' && spotsLeft===0){
    actionHTML = buildWaitlistForm(formType, customFields)
  } else if(status==='interest_list'){
    actionHTML = buildInterestForm()
  } else {
    actionHTML = '<div class="card"><div class="card-body"><div class="alert alert-info">Registrations are not currently open. Check back soon!</div></div></div>'
  }

  el.innerHTML =
    '<div class="card">'
    + (uniqueImages.length ? '<div style="overflow:hidden;border-radius:14px 14px 0 0"><img src="'+escHtml(uniqueImages[0])+'" alt="'+escHtml(program.name)+'" style="width:100%;max-height:260px;object-fit:cover;display:block"></div>' : '')
    + '<div class="card-header"><div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px"><h2>'+escHtml(program.name)+'</h2><span class="badge '+(badgeMap[status]||'badge-draft')+'">'+(labelMap[status]||status)+'</span></div></div>'
    + '<div class="card-body">'
    + (program.description?'<p style="font-size:14px;color:#374151;margin-bottom:14px;line-height:1.6">'+escHtml(program.description)+'</p>':'')
    + buildScheduleHTML(program)
    + (program.program_location ? '<div style="font-size:13px;color:#6b7280;margin-bottom:8px">'+escHtml(program.program_location)+'</div>' : '')
    + capHTML
    + (program.price?'<div class="price-tag">'+fmtPrice(program.price)+'<span> per participant</span></div>':'<div style="margin:10px 0;font-size:14px;font-weight:700;color:#166534">Free</div>')
    + imagesHTML
    + infoHTML
    + instrHTML
    + '</div></div>'
    + actionHTML
}

function customFieldInputs(fields){
  if(!fields||!fields.length) return ''
  return fields.map(function(f){
    var id = 'cf-'+f.name.replace(/\s+/g,'-').toLowerCase()
    var req = f.required ? '<span class="required">*</span>' : ''
    var input = ''
    if(f.type==='select' && f.options){
      input = '<select id="'+id+'"><option value="">Select...</option>'+f.options.map(function(o){ return '<option value="'+escHtml(o)+'">'+escHtml(o)+'</option>' }).join('')+'</select>'
    } else if(f.type==='textarea'){
      input = '<textarea id="'+id+'" rows="3" placeholder="'+(f.placeholder||'')+'"></textarea>'
    } else if(f.type==='checkbox'){
      input = '<label style="display:flex;align-items:center;gap:8px;cursor:pointer"><input type="checkbox" id="'+id+'" style="accent-color:#145466"/> '+escHtml(f.label||f.name)+'</label>'
    } else {
      input = '<input type="'+(f.type||'text')+'" id="'+id+'" placeholder="'+(f.placeholder||'')+'"/>'
    }
    return '<div class="form-group"><label>'+escHtml(f.name)+' '+req+'</label>'+input+(f.hint?'<div class="hint">'+escHtml(f.hint)+'</div>':'')+'</div>'
  }).join('')
}

function getCustomFieldValues(fields){
  if(!fields||!fields.length) return {}
  var vals = {}
  fields.forEach(function(f){
    var id = 'cf-'+f.name.replace(/\s+/g,'-').toLowerCase()
    var el = document.getElementById(id)
    if(!el) return
    vals[f.name] = el.type==='checkbox' ? el.checked : el.value
  })
  return vals
}

function buildRegistrationForm(formType, customFields, showCap, showAlmost){
  showCap = showCap !== false
  showAlmost = showAlmost !== false
  var isYouth = formType==='youth' || !formType
  var ff = (program && program.form_fields) || {}
  function on(key, def){ return ff.hasOwnProperty(key) ? ff[key] : (def !== undefined ? def : false) }

  // Session picker (when enabled, shown at top of form)
  var sessionPickerHTML = ''
  if(program.sessions_enabled && program._sessions && program._sessions.length){
    var sessions = program._sessions
    var basePrice = program.price || 0
    var isBookingMode = !!program.booking_mode
    var maxPerReg = program.max_sessions_per_reg || 0
    function fmtTimeSess(t){ if(!t) return ''; try{ var pp=t.split(':'),h=parseInt(pp[0]),m=pp[1],a=h>=12?'PM':'AM'; h=h%12||12; return h+(m&&m!=='00'?':'+m:'')+' '+a }catch(e){ return t } }

    var today = new Date(); today.setHours(0,0,0,0)
    var allPast = sessions.length > 0 && sessions.every(function(s){ return s.start_date && new Date(s.start_date+'T12:00:00') < today })
    var allUnavailable = sessions.length > 0 && sessions.every(function(s){
      var past = s.start_date && new Date(s.start_date+'T12:00:00') < today
      var full = s.capacity && (s.enrolled_count||0) >= s.capacity
      return past || full
    })

    if(allPast){
      sessionPickerHTML = '<div style="background:#fef2f2;border:1.5px solid #fecaca;border-radius:10px;padding:20px 18px;margin-bottom:16px;text-align:center">'
        + '<div style="font-size:14px;font-weight:700;color:#991b1b;margin-bottom:4px">Registration Closed</div>'
        + '<div style="font-size:13px;color:#b91c1c">All sessions for this program have already taken place.</div>'
        + '</div>'
      setTimeout(function(){ var b=document.getElementById('submit-btn'); if(b){b.disabled=true;b.textContent='Registration Closed'} },100)
    } else if(allUnavailable){
      sessionPickerHTML = '<div style="background:#fef3c7;border:1.5px solid #fde68a;border-radius:10px;padding:20px 18px;margin-bottom:16px;text-align:center">'
        + '<div style="font-size:14px;font-weight:700;color:#92400e;margin-bottom:4px">No Available Sessions</div>'
        + '<div style="font-size:13px;color:#b45309">All sessions are either full or have already taken place. Please contact us to be added to a waitlist.</div>'
        + '</div>'
      setTimeout(function(){ var b=document.getElementById('submit-btn'); if(b){b.disabled=true;b.textContent='No Sessions Available'} },100)
    } else if(isBookingMode){
      // Group by date for a visual calendar-style grid
      var byDate = {}
      sessions.forEach(function(s){
        var d = s.start_date || 'Ongoing'
        if(!byDate[d]) byDate[d] = []
        byDate[d].push(s)
      })
      sessionPickerHTML = '<div class="section-divider">Choose Your Time Slot</div>'
        + '<div style="font-size:13px;color:#6b7280;margin-bottom:12px">Select a time slot. Each slot is '+(maxPerReg===1?'a single reservation':maxPerReg>1?'up to '+maxPerReg+' slots':'one reservation per booking')+'.</div>'
        + Object.keys(byDate).sort().map(function(date){
            var label = date === 'Ongoing' ? 'Available Slots' : (function(){ try{ return new Date(date+'T12:00:00').toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'}) }catch(e){ return date } })()

                  var enrolled = s.enrolled_count || 0
                  var cap = s.capacity || null
                  var spotsLeft = cap ? cap - enrolled : null
                  var isFull = spotsLeft !== null && spotsLeft <= 0
                  var isPast = s.start_date && new Date(s.start_date+'T12:00:00') < new Date(new Date().toDateString())
                  var isDisabled = isFull || isPast
                  var pct = cap ? (enrolled / cap) : 0
                  var isAlmost = !isDisabled && pct >= 0.9 && cap
                  var timeStr = s.start_time ? fmtTimeSess(s.start_time)+(s.end_time?' – '+fmtTimeSess(s.end_time):'') : s.name
                  return '<label class="booking-slot-label" style="display:flex;flex-direction:column;align-items:center;padding:10px 8px;border:2px solid '+(isDisabled?'#e5e7eb':isAlmost?'#fbbf24':'#d1d5db')+';border-radius:10px;cursor:'+(isDisabled?'not-allowed':'pointer')+';text-align:center;background:'+(isDisabled?'#f9fafb':isAlmost?'#fffbeb':'#fff')+';opacity:'+(isDisabled?'0.5':'1')+'">'

                    + '<div style="font-size:13px;font-weight:700;color:'+(isDisabled?'#9ca3af':'#0d3d4d')+'">'+escHtml(timeStr)+'</div>'

      + (on('photo_consent',false) ? '<div class="form-group" style="background:#f8fafc;border:1.5px solid #e5e7eb;border-radius:8px;padding:12px 14px"><label style="display:flex;align-items:flex-start;gap:10px;cursor:pointer;font-size:13px;font-weight:400;text-transform:none;letter-spacing:0;margin:0"><input type="checkbox" id="f-photo-consent" style="margin-top:2px;accent-color:#145466"/> I give permission for my photos/videos to be used in HWTC marketing and social media.</label></div>' : '')

  return '<div class="card"><div class="card-header"><h2>Register</h2></div><div class="card-body">'

// ── Discount / sibling state ──────────────────────────────────
var _promoResult = null   // last validated promo {valid, discount_amount, label, _code, ...}
var _siblingCount = 0

function buildPaymentOptions(prog){
  const price = prog.price || 0
  const deposit = prog.deposit_amount || 0
  const hasDeposit = deposit > 0 && deposit < price
  const sibCount = document.querySelectorAll('.sibling-block').length
  const numParticipants = 1 + sibCount
  const hasSibDiscount = prog.sibling_discount_enabled && sibCount > 0
  const sibDiscType = prog.sibling_discount_type || 'percent'
  const sibDiscVal = prog.sibling_discount_value || 0

  // Promo discount
  let promoDiscount = 0
  let promoLabel = ''
  if(_promoResult && _promoResult.valid){
    promoDiscount = _promoResult.discount_amount || 0
    promoLabel = _promoResult.label || ''
  }

  // Auto sibling discount
  let sibDiscount = 0
  if(hasSibDiscount){
    const perSib = sibDiscType==='percent' ? Math.floor(price * sibDiscVal / 100) : Math.min(sibDiscVal, price)
    sibDiscount = perSib * sibCount
  }

  // Compute effective price per participant from sessions if enabled
  var effectivePrice = price
  if(program.sessions_enabled && selectedSessionIds.length > 0){
    var sessionTotal = 0
    ;(program._sessions||[]).forEach(function(s){
      if(selectedSessionIds.indexOf(s.id) !== -1){
        sessionTotal += (s.price_override !== null && s.price_override !== undefined) ? s.price_override : (program.price||0)
      }
    })
    effectivePrice = sessionTotal
  }
  const basket = effectivePrice * numParticipants
  const totalDiscount = promoDiscount + sibDiscount
  const finalPrice = Math.max(0, basket - totalDiscount)

  let html = '<div style="border-top:1px solid #e5e7eb;margin-top:16px;padding-top:16px">'

  // Discount code input
  const codeVal = (_promoResult && _promoResult._code) ? escHtml(_promoResult._code) : ''
  const codeBorder = _promoResult ? (_promoResult.valid ? '#86efac' : '#fca5a5') : '#d1d5db'
  const codeMsg = _promoResult
    ? (_promoResult.valid
        ? '<span style="color:#166534;font-weight:600">✓ '+escHtml(promoLabel)+'</span>'
        : '<span style="color:#dc2626">'+escHtml(_promoResult.error||'Invalid code')+'</span>')
    : ''
  html += '<div class="form-group"><label>Discount / Coupon Code</label>'
    + '<div style="display:flex;gap:8px">'
    + '<input id="f-discount-code" value="'+codeVal+'" placeholder="Enter code" style="flex:1;padding:10px 14px;border:1.5px solid '+codeBorder+';border-radius:8px;font-family:inherit;font-size:14px;outline:none;text-transform:uppercase"/>'
    + '<button type="button" id="apply-discount-btn" style="padding:10px 16px;background:#f3f4f6;border:1.5px solid #d1d5db;border-radius:8px;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap">Apply</button>'
    + '</div>'
    + '<div id="discount-result" style="margin-top:6px;font-size:13px">'+codeMsg+'</div>'
    + '</div>'

  // Order summary (when price > 0)
  if(price > 0){
    html += '<div style="background:#f8fafc;border:1px solid #e5e7eb;border-radius:10px;padding:14px;margin-bottom:14px">'
      + '<div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;color:#6b7280;margin-bottom:10px">Order Summary</div>'

    // Session line items
    if(program.sessions_enabled && selectedSessionIds.length > 0){
      var sessions = program._sessions || []
      selectedSessionIds.forEach(function(sid){
        var s = sessions.find(function(x){ return x.id===sid })
        if(!s) return
        var sp = (s.price_override !== null && s.price_override !== undefined) ? s.price_override : (program.price||0)
        if(numParticipants === 1){
          html += summaryLine(escHtml(s.name), sp)
        } else {
          html += summaryLine(escHtml(s.name)+' &times; '+numParticipants, sp*numParticipants)
        }
      })
    } else {
      // Base line
      if(numParticipants === 1){
        html += summaryLine((isProduction?'Production':'Program')+' fee', price)
      } else {
        html += summaryLine((isProduction?'Production':'Program')+' fee &times; '+numParticipants+' participants', basket)
          + '<div style="font-size:12px;color:#9ca3af;margin:-4px 0 8px 4px">$'+(price/100).toFixed(2)+' each</div>'
      }
    }

    // Auto sibling discount
    if(hasSibDiscount && sibDiscount > 0){
      const sl = sibDiscType==='percent'
        ? 'Sibling discount ('+sibDiscVal+'% &times; '+sibCount+')'
        : 'Sibling discount ($'+(sibDiscVal/100).toFixed(2)+' &times; '+sibCount+')'
      html += summaryLine(sl, -sibDiscount, '#166534')
    }

    // Promo discount
    if(promoDiscount > 0){
      html += summaryLine('Code: '+escHtml(_promoResult._code||''), -promoDiscount, '#166534')
    }

    // Total
    html += '<div style="border-top:1px solid #d1d5db;margin:8px 0"></div>'
      + summaryLine('<strong>Total</strong>', finalPrice, null, true)
      + '</div>'
  }

  // Payment plan
  if(hasDeposit && finalPrice > 0){
    const balance = finalPrice - deposit
    html += '<div class="form-group" style="margin-top:4px"><label>Payment Option</label>'
      + '<div style="display:flex;flex-direction:column;gap:8px">'
      + '<label style="display:flex;align-items:flex-start;gap:10px;padding:12px 14px;border:1.5px solid #d1d5db;border-radius:8px;cursor:pointer">'
      + '<input type="radio" name="payment-type" value="full" checked style="margin-top:2px;accent-color:#145466"/>'
      + '<div><div style="font-weight:600;font-size:14px">Pay in full — $'+(finalPrice/100).toFixed(2)+'</div>'
      + '<div style="font-size:12px;color:#6b7280">One payment today</div></div></label>'
      + '<label style="display:flex;align-items:flex-start;gap:10px;padding:12px 14px;border:1.5px solid #d1d5db;border-radius:8px;cursor:pointer">'
      + '<input type="radio" name="payment-type" value="deposit" style="margin-top:2px;accent-color:#145466"/>'
      + '<div><div style="font-weight:600;font-size:14px">Pay deposit — $'+(deposit/100).toFixed(2)+' today</div>'
      + '<div style="font-size:12px;color:#6b7280">Remaining $'+(balance/100).toFixed(2)+' due before program starts</div></div></label>'
      + '</div></div>'
  }

  html += '</div>'
  return html
}

function summaryLine(label, cents, color, bold){
  const neg = cents < 0
  const abs = Math.abs(cents)
  const val = (neg ? '−' : '') + '$' + (abs/100).toFixed(2)
  const st = color ? ' style="color:'+color+'"' : ''
  const bst = bold ? 'font-weight:700;' : ''

var selectedSessionIds = []

function buildSessionPicker(){
  var sessions = program._sessions || []
  function fmtTime(t){ if(!t) return ''; try{ var p=t.split(':'),h=parseInt(p[0]),m=p[1],a=h>=12?'PM':'AM'; h=h%12||12; return h+(m&&m!=='00'?':'+m:'')+' '+a }catch(e){ return t } }
  var basePrice = program.price || 0

  var html = '<div class="card" style="margin-bottom:12px"><div class="card-header"><h2>Choose Your Session(s)</h2>'
    + '<div style="font-size:13px;color:#6b7280;margin-top:4px">Select one or more sessions. Each session is priced separately.</div>'
    + '</div><div class="card-body" style="padding:12px 20px">'
    + sessions.map(function(s){
        var price = (s.price_override !== null && s.price_override !== undefined) ? s.price_override : basePrice
        var timeStr = (s.day_of_week ? s.day_of_week+' ' : '') + (s.start_time ? fmtTime(s.start_time)+(s.end_time?' – '+fmtTime(s.end_time):'') : '')
        var enrolled = s.enrolled_count || 0
        var spotsLeft = s.capacity ? s.capacity - enrolled : null
        var isFull = spotsLeft !== null && spotsLeft <= 0
        var isSelected = selectedSessionIds.indexOf(s.id) !== -1
        return '<label style="display:flex;align-items:center;gap:12px;padding:12px 14px;border:1.5px solid '+(isSelected?'#145466':isFull?'#e5e7eb':'#d1d5db')+';border-radius:10px;margin-bottom:8px;cursor:'+(isFull?'not-allowed':'pointer')+';background:'+(isSelected?'#f0f9ff':isFull?'#f9fafb':'#fff')+';">'
          + '<input type="checkbox" class="session-checkbox" data-sid="'+s.id+'" data-price="'+price+'" '+(isSelected?'checked ':'')+' '+(isFull?'disabled ':'')+' style="accent-color:#145466;width:16px;height:16px;flex-shrink:0"/>'
          + '<div style="flex:1">'
          + '<div style="font-weight:700;font-size:14px;color:'+(isFull?'#9ca3af':'#1a2332')+'">'+escHtml(s.name)+'</div>'
          + (timeStr ? '<div style="font-size:12px;color:#6b7280;margin-top:2px">'+escHtml(timeStr)+'</div>' : '')
          + (s.location ? '<div style="font-size:12px;color:#6b7280">'+escHtml(s.location)+'</div>' : '')
          + (isFull ? '<div style="font-size:12px;color:#dc2626;font-weight:600;margin-top:2px">Full</div>'
              : spotsLeft !== null && spotsLeft <= 5 ? '<div style="font-size:12px;color:#f59e0b;font-weight:600;margin-top:2px">Only '+spotsLeft+' spot'+(spotsLeft===1?'':'s')+' left</div>' : '')
          + '</div>'
          + '<div style="text-align:right;font-weight:700;font-size:14px;color:'+(isFull?'#9ca3af':'#145466')+'">'+( price > 0 ? '$'+(price/100).toFixed(2) : 'Free')+'</div>'
          + '</label>'
      }).join('')
    + '<div id="session-total" style="margin-top:4px;padding:10px 12px;background:#f8fafc;border-radius:8px;font-size:14px;font-weight:700;color:#0d3d4d;text-align:right;display:none"></div>'
    + '<button class="btn btn-primary" id="sessions-continue-btn" style="margin-top:12px" disabled>Continue with Selected Sessions</button>'
    + '</div></div>'
  return html
}

function updateSessionPicker(){
  var isBookingMode = program && program.booking_mode
  var maxPerReg = program && program.max_sessions_per_reg ? parseInt(program.max_sessions_per_reg) : 0

  selectedSessionIds = []
  var total = 0
  document.querySelectorAll('.session-checkbox:checked').forEach(function(cb){
    selectedSessionIds.push(cb.dataset.sid)
    total += parseInt(cb.dataset.price||0)
  })

  if(isBookingMode){
    // In booking mode, enforce max slots — if maxPerReg=1, uncheck others
    if(maxPerReg === 1 && selectedSessionIds.length > 1){
      // Keep only the last checked one
      var lastChecked = event && event.target ? event.target.dataset.sid : selectedSessionIds[selectedSessionIds.length-1]
      document.querySelectorAll('.session-checkbox:checked').forEach(function(cb){
        if(cb.dataset.sid !== lastChecked) cb.checked = false
      })
      selectedSessionIds = [lastChecked]
      total = parseInt(document.querySelector('.session-checkbox[data-sid="'+lastChecked+'"]').dataset.price||0)
    } else if(maxPerReg > 1 && selectedSessionIds.length > maxPerReg){
      // Uncheck the just-checked one
      if(event && event.target){ event.target.checked = false; return }
    }
    // Update slot styles
    document.querySelectorAll('.booking-slot-label').forEach(function(lbl){
      var cb = lbl.querySelector('.session-checkbox')
      if(!cb || cb.disabled) return
      lbl.style.borderColor = cb.checked ? '#145466' : '#d1d5db'
      lbl.style.background = cb.checked ? '#f0f9ff' : '#fff'
      var timeEl = lbl.querySelector('div')
      if(timeEl) timeEl.style.color = cb.checked ? '#145466' : '#0d3d4d'
    })
  } else {
    // Standard session — update label styles
    document.querySelectorAll('.session-label').forEach(function(lbl){
      var cb = lbl.querySelector('.session-checkbox')
      if(!cb || cb.disabled) return
      lbl.style.borderColor = cb.checked ? '#145466' : '#d1d5db'
      lbl.style.background = cb.checked ? '#f0f9ff' : '#fff'
    })
  }

  // Update session total display
  var totalEl = document.getElementById('session-total')
  if(totalEl){
    if(selectedSessionIds.length > 0){
      totalEl.style.display = ''
      totalEl.textContent = selectedSessionIds.length+' slot'+(selectedSessionIds.length===1?'':'s')+' selected'+(total>0?' — $'+(total/100).toFixed(2)+'/person':'')
    } else {
      totalEl.style.display = 'none'
    }
  }
  // Refresh payment options
  var paySection = document.getElementById('payment-options-section')
  if(paySection && program && program.price >= 0){
    paySection.innerHTML = buildPaymentOptions(program)
  }
}

function toggleCartDrawer(){
  var drawer = document.getElementById('cart-drawer')
  var overlay = document.getElementById('cart-drawer-overlay')
  if(!drawer) return
  var isOpen = drawer.style.display !== 'none'
  drawer.style.display = isOpen ? 'none' : ''
  overlay.style.display = isOpen ? 'none' : ''

}

function renderCartDrawer(){
  var items = cartGet()
  var itemsEl = document.getElementById('cart-drawer-items')
  var footerEl = document.getElementById('cart-drawer-footer')
  if(!itemsEl) return
  if(!items.length){
    itemsEl.innerHTML = '<div style="text-align:center;padding:30px;color:#6b7280;font-size:13px">Your cart is empty.</div>'
    if(footerEl) footerEl.innerHTML = ''
    return
  }
  var total = items.reduce(function(s,it){ return s+(it.price||0) },0)
  itemsEl.innerHTML = items.map(function(it,i){
    var sessionLine = ''
    if(it.session_ids && it.session_ids.length){
      // Try to resolve session names from program._sessions if available
      var sNames = []
      if(program && program._sessions){
        it.session_ids.forEach(function(sid){
          var s = program._sessions.find(function(x){ return x.id===sid })
          if(s) sNames.push(s.name)
        })
      }
      sessionLine = '<div style="font-size:11px;color:#6b7280;margin-top:2px">'
        + (sNames.length ? sNames.join(', ') : it.session_ids.length+' session'+(it.session_ids.length===1?'':'s')+' selected')
        + '</div>'
    }
    return '<div style="display:flex;align-items:flex-start;gap:10px;padding:12px 0;border-bottom:1px solid #e5e7eb">'
      + '<div style="flex:1">'
      + '<div style="font-size:13px;font-weight:700;color:#0d3d4d">'+escHtml(it.program_name||'')+'</div>'
      + '<div style="font-size:12px;color:#6b7280;margin-top:2px">'+escHtml((it.child_first_name||'')+(it.child_last_name?' '+it.child_last_name:''))+'</div>'
      + sessionLine
      + '<div style="font-size:13px;font-weight:700;color:#145466;margin-top:4px">$'+((it.price||0)/100).toFixed(2)+'</div>'
      + '</div>'
      + '<button onclick="removeCartItem('+i+')" style="background:none;border:none;cursor:pointer;color:#9ca3af;font-size:18px;padding:0;line-height:1" title="Remove">×</button>'
      + '</div>'
  }).join('')
  if(footerEl){
    footerEl.innerHTML = '<div style="border-top:2px solid #e5e7eb;padding-top:12px;margin-bottom:12px">'
      + '<div style="display:flex;justify-content:space-between;font-size:14px;font-weight:700;color:#0d3d4d">'
      + '<span>Total</span><span>$'+(total/100).toFixed(2)+'</span></div></div>'
      + '<a href="/register/cart" style="display:block;background:#145466;color:#fff;text-align:center;padding:12px;border-radius:10px;font-weight:700;font-size:14px;text-decoration:none">Checkout &rarr;</a>'
      + '<button onclick="toggleCartDrawer()" style="display:block;width:100%;margin-top:8px;background:none;border:none;color:#6b7280;font-size:13px;cursor:pointer;padding:6px">Continue registering</button>'
  }
}

function removeCartItem(index){
  var items = cartGet()
  items.splice(index,1)
  cartSave(items)
  updateHeaderCart()
  renderCartDrawer()
}

  var customFields = (program && program.custom_fields) || []
  return {
    program_id: program.id,
    program_name: program.name,
    slug: slug,
    is_production: isProduction,
    price: program.price || 0,
    registration_form_type: formType,
    child_first_name: ((document.getElementById('f-first')||{}).value||'').trim(),
    child_last_name: ((document.getElementById('f-last')||{}).value||'').trim(),
    child_dob: (document.getElementById('f-dob')||{}).value||'',
    shirt_size: (document.getElementById('f-shirt')||{}).value||'',
    notes: ((document.getElementById('f-notes')||{}).value||'').trim(),
    custom_field_values: getCustomFieldValues(customFields),
    siblings: getSiblings(),
    session_ids: selectedSessionIds,
    promo_code: (_promoResult && _promoResult.valid) ? (_promoResult._code||'') : '',
    payment_type: (document.querySelector('input[name="payment-type"]:checked')||{}).value||'full',
    // guardian (used if cart is otherwise empty)
    _guardian: {
      name: isYouth ? ((document.getElementById('f-contact-name')||{}).value||'').trim()
                    : (((document.getElementById('f-first')||{}).value||'')+' '+((document.getElementById('f-last')||{}).value||'')).trim(),
      email: ((document.getElementById('f-email')||{}).value||'').trim().toLowerCase(),
      phone: ((document.getElementById('f-phone')||{}).value||'').trim(),
      ec_name: ((document.getElementById('f-ec-name')||{}).value||'').trim(),
      ec_phone: ((document.getElementById('f-ec-phone')||{}).value||'').trim(),
    }
  }
}

function validateForm(){
  var formType = (program && program.registration_form_type) || 'youth'
  var isYouth = formType === 'youth' || !formType
  var email = (document.getElementById('f-email')||{}).value||''
  var firstName = (document.getElementById('f-first')||{}).value||''
  var contactName = isYouth ? ((document.getElementById('f-contact-name')||{}).value||'') : firstName
  if(!email.trim() || !firstName.trim() || (isYouth && !contactName.trim())){
    show('Please fill in all required fields.','error'); return false
  }
  return true
}

function addToCart(){
  if(!validateForm()) return
  var item = collectFormData()
  var g = item._guardian
  delete item._guardian
  guardianSave(g)
  var cart = cartGet()
  cart = cart.filter(function(c){ return c.program_id !== item.program_id })
  cart.push(item)
  cartSave(cart)
  updateHeaderCart()
  // Open the cart drawer to confirm
  var drawer = document.getElementById('cart-drawer')
  var overlay = document.getElementById('cart-drawer-overlay')
  if(drawer){ drawer.style.display=''; overlay.style.display=''; renderCartDrawer() }
  // Scroll back to top so they can register another
  window.scrollTo({top:0, behavior:'smooth'})
  renderPage()
}

function showAddedScreen(item, guardian){
  var price = item.price || 0
  var siblings = item.siblings || []
  var numParticipants = 1 + siblings.length
  var basket = price * numParticipants
  // Rough line total (exact discounts computed server-side)
  var lineTotal = basket
  var el = document.getElementById('app')
  el.innerHTML =
    '<div class="card"><div class="card-body" style="text-align:center;padding:40px 24px">'
    + '<div style="font-size:48px;margin-bottom:16px">✅</div>'
    + '<h2 style="color:#145466;font-size:20px;margin-bottom:8px">Added to Cart!</h2>'
    + '<p style="color:#374151;font-size:14px;margin-bottom:4px"><strong>'+escHtml(item.program_name)+'</strong></p>'
    + (numParticipants > 1 ? '<p style="color:#6b7280;font-size:13px;margin-bottom:4px">'+numParticipants+' participants</p>' : '')
    + (price > 0 ? '<p style="color:#6b7280;font-size:13px;margin-bottom:20px">$'+(lineTotal/100).toFixed(2)+'</p>' : '<p style="color:#166534;font-size:13px;font-weight:700;margin-bottom:20px">Free</p>')
    + '<div style="display:flex;flex-direction:column;gap:10px;max-width:320px;margin:0 auto">'
    + '<a href="/register/cart" class="btn btn-primary" style="text-decoration:none">🛒 Go to Cart &amp; Checkout &rarr;</a>'
    + '<a href="/api/public/programs" id="browse-more-btn" class="btn" style="background:#f3f4f6;color:#374151;text-decoration:none">+ Add Another Program</a>'
    + '</div>'
    + '<div style="margin-top:16px;font-size:12px;color:#9ca3af">'+cartCount()+' program'+(cartCount()===1?'':'s')+' in your cart</div>'
    + '</div></div>'

  // Browse more — load program list
  document.getElementById('browse-more-btn').addEventListener('click', function(e){
    e.preventDefault()
    showProgramBrowser()
  })
}

async function showProgramBrowser(){
  var el = document.getElementById('app')
  el.innerHTML = '<div id="loading" style="text-align:center;padding:40px;color:#6b7280"><div class="spinner"></div>Loading programs...</div>'
  var programs = await apiFetch('/api/public/programs')
  if(!Array.isArray(programs) || !programs.length){
    el.innerHTML = '<div class="card"><div class="card-body"><div class="alert alert-info">No other programs are currently open.</div></div></div>'
    return
  }
  var cartIds = cartGet().map(function(c){ return c.program_id })
  var html = '<div class="card"><div class="card-header"><h2>Browse Open Programs</h2></div><div class="card-body" style="padding:12px 22px">'
  programs.forEach(function(p){
    var inCart = cartIds.indexOf(p.id) !== -1
    var isCurrent = p.id === (program && program.id)
    if(isCurrent) return
    var spotsLeft = p.spots_remaining
    html += '<div style="display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid #e5e7eb">'
      + '<div>'
      + '<div style="font-weight:600;font-size:14px">'+escHtml(p.name)+'</div>'
      + '<div style="font-size:12px;color:#6b7280;margin-top:2px">'
      + (p.price ? '$'+(p.price/100).toFixed(2)+'/participant' : 'Free')
      + (spotsLeft !== null && spotsLeft <= 5 ? ' · <span style="color:#f59e0b;font-weight:600">Only '+spotsLeft+' left</span>' : '')
      + (spotsLeft === 0 ? ' · <span style="color:#dc2626;font-weight:600">Full</span>' : '')
      + '</div></div>'
      + '<div>'
      + (inCart
          ? '<span style="font-size:12px;color:#145466;font-weight:600">✓ In cart</span>'
          : (spotsLeft === 0
              ? '<span style="font-size:12px;color:#6b7280">Waitlist</span>'
              : '<a href="/register/'+escHtml(p.slug)+'" class="btn btn-primary btn-sm" style="font-size:12px;padding:6px 14px;text-decoration:none">Register</a>'))
      + '</div></div>'
  })
  html += '</div></div>'
    + '<div style="text-align:center;margin-top:8px">'
    + '<a href="/register/cart" class="btn btn-primary" style="text-decoration:none;display:inline-flex;width:auto;padding:12px 28px">🛒 Go to Cart &rarr;</a>'
    + '</div>'
  el.innerHTML = html
}

init()
</script>
</body>
</html>
