<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Confirm — Studio After Dark</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',-apple-system,sans-serif;background:#0b0714;color:rgba(255,255,255,0.85);line-height:1.6}
.top-bar{height:5px;background:linear-gradient(90deg,#7c3aed,#ec4899,#f472b6)}
.hero{padding:44px 24px 28px;text-align:center}
.presents{font-size:13px;font-weight:500;letter-spacing:0.25em;color:rgba(255,255,255,0.5);margin-bottom:16px}
.hero img{max-width:240px;width:80%;height:auto;filter:drop-shadow(0 0 20px rgba(236,72,153,0.3))}
.wrap{max-width:460px;margin:0 auto;padding:0 24px 60px}
.card{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.14);border-radius:16px;padding:32px 26px;text-align:center}
.category-pill{display:inline-block;font-size:12px;font-weight:700;padding:5px 16px;border-radius:20px;background:rgba(236,72,153,0.18);color:#f472b6;margin-bottom:14px;letter-spacing:0.05em;text-transform:uppercase}
.event-date{font-family:'Playfair Display',Georgia,serif;font-size:20px;font-weight:700;color:#fff;margin-bottom:6px}
.deadline-note{font-size:13.5px;color:rgba(255,255,255,0.55);margin-bottom:24px}
.btn{width:100%;padding:15px;background:linear-gradient(90deg,#ec4899,#f472b6);color:#fff;border:none;border-radius:12px;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer}
.btn:disabled{opacity:0.5}
.btn-secondary{width:100%;padding:13px;background:transparent;color:rgba(255,255,255,0.5);border:1.5px solid rgba(255,255,255,0.18);border-radius:12px;font-family:inherit;font-size:13.5px;font-weight:600;cursor:pointer;margin-top:10px}
.btn-secondary:disabled{opacity:0.5}
.status-msg{margin-top:12px;font-size:13px;text-align:center}
.status-msg.error{color:#f87171}
.qr-box{background:#fff;border-radius:14px;padding:22px;margin-top:8px}
#qr-canvas{display:flex;justify-content:center;margin-bottom:14px}
.code-text{font-family:monospace;font-size:20px;font-weight:800;letter-spacing:3px;color:#0d3d4d}
.code-hint{font-size:12px;color:#78716c;margin-top:10px}
.confirmed-note{color:#5eead4;font-weight:700;font-size:14px;margin-bottom:18px}
.expired-icon,.error-icon{font-size:32px;margin-bottom:12px}
.error-title{font-weight:700;font-size:16px;color:#fff}
.error-sub{color:rgba(255,255,255,0.6);font-size:13.5px;margin-top:6px}
</style>
</head>
<body>
<div class="top-bar"></div>
<div id="app">
<div class="hero">
 <img src="https://irp.cdn-website.com/ab1f5fdb/dms3rep/multi/opt/SADLogo-bd629fa1-1920w.png" alt="Studio After Dark"/>
</div>
<div class="wrap"><div class="card" style="color:rgba(255,255,255,0.4)">Loading…</div></div>
</div>

<script>
var pathParts = window.location.pathname.split('/').filter(Boolean)
var TOKEN = pathParts[pathParts.length-1]

function escH(s){ var d=document.createElement('div'); d.textContent=s==null?'':String(s); return d.innerHTML }
function formatEventDate(iso){
 var d = new Date(iso+'T12:00:00')
 return d.toLocaleDateString('en-US', {weekday:'long', month:'long', day:'numeric'})
}
function formatDeadline(iso){
 var d = new Date(iso)
 return d.toLocaleDateString('en-US', {weekday:'long', month:'long', day:'numeric'}) + ' at ' + d.toLocaleTimeString('en-US', {hour:'numeric', minute:'2-digit'})
}

async function boot(){
 var res = await fetch('/api/public/sad/confirm/'+encodeURIComponent(TOKEN))
 var data = await res.json()
 if(data.error){
  renderError(data.error)
  return
 }
 if(data.declined){
  renderDeclined(data)
  return
 }
 if(data.already_confirmed && data.checkin_code){
  renderQr(data)
  return
 }
 if(data.expired){
  renderExpired(data)
  return
 }
 renderConfirmPrompt(data)
}

function renderError(msg){
 document.querySelector('.wrap').innerHTML = `<div class="card">
  <div class="error-icon"></div>
  <div class="error-title">${escH(msg)}</div>
 </div>`
}

function renderExpired(data){
 document.querySelector('.wrap').innerHTML = `<div class="card">
  <div class="expired-icon"></div>
  <div class="error-title">The confirmation window has closed</div>
  <div class="error-sub">Sorry ${escH(data.volunteer_name||'')} — this link's deadline has passed, so we've given the spot to someone else. Watch for the next lottery!</div>
 </div>`
}

function renderDeclined(data){
 document.querySelector('.wrap').innerHTML = `<div class="card">
  <div class="error-title">You're all set — you've let us know you can't make it</div>
  <div class="error-sub">Thanks for telling us early so we could offer your spot to someone on the waitlist. Hope to see you at the next one!</div>
 </div>`
}

function renderConfirmPrompt(data){
 var performerNote = data.category === 'Performer'
  ? '<div style="font-size:12.5px;color:rgba(255,255,255,0.45);margin-bottom:18px">Performer order is picked live, at random, during the event itself — stick around all night!</div>'
  : ''
 document.querySelector('.wrap').innerHTML = `<div class="card">
  <div class="category-pill">${escH(data.category)}</div>
  <div class="event-date">${formatEventDate(data.event_date)}</div>
  <div class="deadline-note">Confirm by ${formatDeadline(data.confirm_deadline)}, or the spot goes to someone else.</div>
  ${performerNote}
  <button class="btn" id="confirm-btn" onclick="submitConfirm()">Yes, I'm Still In!</button>
  <button class="btn-secondary" id="decline-btn" onclick="submitDecline()">I Can't Attend</button>
  <div id="confirm-status"></div>
 </div>`
}

async function submitConfirm(){
 var btn = document.getElementById('confirm-btn')
 var declineBtn = document.getElementById('decline-btn')
 var statusEl = document.getElementById('confirm-status')
 btn.disabled = true; btn.textContent = 'Confirming…'
 if(declineBtn) declineBtn.disabled = true
 try{
  var res = await fetch('/api/public/sad/confirm/'+encodeURIComponent(TOKEN), {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({action:'confirm'})})
  var data = await res.json()
  if(!data.ok){
   statusEl.innerHTML = '<div class="status-msg error">'+escH(data.error||'Something went wrong.')+'</div>'
   btn.disabled = false; btn.textContent = "Yes, I'm Still In!"
   if(declineBtn) declineBtn.disabled = false
   return
  }
  var lookup = await (await fetch('/api/public/sad/confirm/'+encodeURIComponent(TOKEN))).json()
  renderQr(Object.assign({}, lookup, {checkin_code:data.checkin_code}))
 } catch(e){
  statusEl.innerHTML = '<div class="status-msg error">Something went wrong — please try again.</div>'
  btn.disabled = false; btn.textContent = "Yes, I'm Still In!"
  if(declineBtn) declineBtn.disabled = false
 }
}

async function submitDecline(){
 if(!confirm("Let us know you can't make it? This gives up your spot — it'll go to the next person on the waitlist, and you can't undo this.")) return
 var btn = document.getElementById('confirm-btn')
 var declineBtn = document.getElementById('decline-btn')
 var statusEl = document.getElementById('confirm-status')
 if(btn) btn.disabled = true
 declineBtn.disabled = true; declineBtn.textContent = 'Letting us know…'
 try{
  var res = await fetch('/api/public/sad/confirm/'+encodeURIComponent(TOKEN), {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({action:'decline'})})
  var data = await res.json()
  if(!data.ok){
   statusEl.innerHTML = '<div class="status-msg error">'+escH(data.error||'Something went wrong.')+'</div>'
   if(btn) btn.disabled = false
   declineBtn.disabled = false; declineBtn.textContent = "I Can't Attend"
   return
  }
  renderDeclined({})
 } catch(e){
  statusEl.innerHTML = '<div class="status-msg error">Something went wrong — please try again.</div>'
  if(btn) btn.disabled = false
  declineBtn.disabled = false; declineBtn.textContent = "I Can't Attend"
 }
}

function renderQr(data){
 document.querySelector('.wrap').innerHTML = `<div class="card">
  <div class="category-pill">${escH(data.category||'')}</div>
  <div class="event-date">${formatEventDate(data.event_date)}</div>
  <div class="confirmed-note">✓ You're confirmed!</div>
  <div class="qr-box">
   <div id="qr-canvas"></div>
   <div class="code-text">${escH(data.checkin_code)}</div>
   <div class="code-hint">Show this QR code (or this code) at the door. Bookmark this page — you can come back to it any time.</div>
  </div>
 </div>`
 new QRCode(document.getElementById('qr-canvas'), {
  text: data.checkin_code,
  width: 200, height: 200,
  colorDark: '#0d3d4d', colorLight: '#ffffff'
 })
}

boot()
</script>
</body>
</html>
