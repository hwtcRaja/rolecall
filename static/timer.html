<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>HWTC Timer</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0 }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: #fff; color: #111; height: 100vh; display: flex;
  flex-direction: column; overflow: hidden }
.header { background: linear-gradient(135deg,#0d3d4d,#145466);
  padding: 12px 16px; display: flex; align-items: center; justify-content: space-between }
.header-title { font-size: 13px; font-weight: 700; color: #fff }
.body { flex: 1; padding: 20px; display: flex; flex-direction: column; overflow: auto }
.section { display: none; flex-direction: column; flex: 1 }
.section.active { display: flex }
label { font-size: 11px; font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.4px; color: #6b7280; display: block; margin-bottom: 4px }
input, select { width: 100%; padding: 10px 12px; border: 1.5px solid #d1d5db;
  border-radius: 8px; font-family: inherit; font-size: 14px; margin-bottom: 12px; color: #111 }
input:focus, select:focus { outline: none; border-color: #145466 }
.btn { width: 100%; padding: 12px; border: none; border-radius: 8px;
  font-family: inherit; font-size: 15px; font-weight: 700; cursor: pointer; margin-bottom: 8px }
.btn-primary { background: #145466; color: #fff }
.btn-secondary { background: #f3f4f6; color: #374151 }
.btn-red { background: #dc2626; color: #fff }
.btn-row { display: flex; gap: 8px }
.btn-row .btn { margin-bottom: 0 }
.clock { font-size: 56px; font-weight: 900; color: #145466; text-align: center;
  letter-spacing: 2px; font-variant-numeric: tabular-nums; margin: 16px 0 8px }
.status-lbl { text-align: center; font-size: 12px; font-weight: 700;
  letter-spacing: 0.5px; margin-bottom: 20px }
.act-lbl { text-align: center; font-size: 13px; color: #6b7280; font-weight: 600; margin-bottom: 4px }
.final-time { font-size: 46px; font-weight: 900; color: #145466; text-align: center; margin: 8px 0 2px }
.final-hrs { font-size: 12px; color: #6b7280; text-align: center; margin-bottom: 16px }
.err { color: #dc2626; font-size: 12px; margin-bottom: 8px; text-align: center; display: none }
.success { background: #dcfce7; border-radius: 12px; padding: 28px 20px; text-align: center;
  flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px }
</style>
</head>
<body>
<div class="header">
  <div class="header-title">⏱ HWTC Remote Hours Timer</div>
</div>
<div class="body">

  <div class="section active" id="s-setup">
    <div style="flex:1">
      <div style="margin-bottom:12px">
        <label>Activity Description</label>
        <input id="t-activity" type="text" placeholder="e.g. Costume prep, Set design, Admin..."/>
      </div>
      <div>
        <label>Category</label>
        <select id="t-category">
          <option value="Admin">Admin / Office Work</option>
          <option value="Costumes">Costumes</option>
          <option value="Set Design">Set Design / Build</option>
          <option value="Grant Writing">Grant Writing</option>
          <option value="Marketing">Marketing / Social Media</option>
          <option value="Rehearsal Support">Rehearsal Support</option>
          <option value="Tech">Tech / AV / Lighting</option>
          <option value="Other">Other</option>
        </select>
      </div>
    </div>
    <div id="setup-err" class="err"></div>
    <button class="btn btn-primary" onclick="timerStart()">▶ Start Timer</button>
  </div>

  <div class="section" id="s-running">
    <div id="t-act-lbl" class="act-lbl"></div>
    <div class="clock" id="t-clock">00:00:00</div>
    <div class="status-lbl" id="t-status" style="color:#166534">● RUNNING</div>
    <div class="btn-row">
      <button class="btn btn-secondary" id="t-pause-btn" onclick="timerPause()">⏸ Pause</button>
      <button class="btn btn-red" onclick="timerStop()">⏹ Stop</button>
    </div>
  </div>

  <div class="section" id="s-submit">
    <div id="t-final-time" class="final-time"></div>
    <div id="t-final-hrs" class="final-hrs"></div>
    <div style="margin-bottom:12px">
      <label>Notes (optional)</label>
      <input id="t-notes" type="text" placeholder="Any additional details..."/>
    </div>
    <div id="submit-err" class="err"></div>
    <div class="btn-row" style="margin-top:auto">
      <button class="btn btn-secondary" onclick="timerResume()">↩ Resume</button>
      <button class="btn btn-primary" onclick="timerSubmit()">Submit ✓</button>
    </div>
  </div>

  <div class="section" id="s-success">
    <div class="success">
      <div style="font-size:48px">✅</div>
      <div style="font-size:18px;font-weight:800;color:#166534">Submitted!</div>
      <div id="t-success-msg" style="font-size:14px;color:#166534"></div>
      <button class="btn btn-primary" style="width:auto;padding:10px 24px;margin-top:8px" onclick="timerReset()">Log More Time</button>
      <button class="btn btn-secondary" style="width:auto;padding:10px 24px" onclick="window.close()">Close</button>
    </div>
  </div>

</div>
<script>
var _t={running:false,paused:false,startTs:null,elapsed:0,interval:null,activity:'',category:'',finalHours:0}
function show(id){ document.querySelectorAll('.section').forEach(function(s){s.classList.remove('active')}); document.getElementById(id).classList.add('active') }
function pad(n){ return n<10?'0'+n:String(n) }
function fmt(s){ var h=Math.floor(s/3600),m=Math.floor((s%3600)/60),ss=s%60; return pad(h)+':'+pad(m)+':'+pad(ss) }
function tick(){ if(!_t.running||_t.paused) return; var el=document.getElementById('t-clock'); if(el) el.textContent=fmt(_t.elapsed+Math.floor((Date.now()-_t.startTs)/1000)) }
function timerStart(){
  var act=document.getElementById('t-activity').value.trim()
  if(!act){var e=document.getElementById('setup-err');e.textContent='Please enter an activity';e.style.display='';return}
  document.getElementById('setup-err').style.display='none'
  _t.activity=act; _t.category=document.getElementById('t-category').value
  _t.running=true; _t.paused=false; _t.startTs=Date.now(); _t.elapsed=0
  clearInterval(_t.interval); _t.interval=setInterval(tick,1000)
  document.getElementById('t-act-lbl').textContent=act+' · '+_t.category
  document.getElementById('t-status').textContent='● RUNNING'; document.getElementById('t-status').style.color='#166534'
  document.getElementById('t-pause-btn').textContent='⏸ Pause'
  show('s-running')
}
function timerPause(){
  if(_t.paused){
    _t.startTs=Date.now(); _t.paused=false; _t.interval=setInterval(tick,1000)
    document.getElementById('t-pause-btn').textContent='⏸ Pause'
    document.getElementById('t-status').textContent='● RUNNING'; document.getElementById('t-status').style.color='#166534'
  } else {
    _t.elapsed+=Math.floor((Date.now()-_t.startTs)/1000); _t.paused=true; clearInterval(_t.interval)
    document.getElementById('t-pause-btn').textContent='▶ Resume'
    document.getElementById('t-status').textContent='⏸ PAUSED'; document.getElementById('t-status').style.color='#92400e'
  }
}
function timerStop(){
  clearInterval(_t.interval)
  if(!_t.paused) _t.elapsed+=Math.floor((Date.now()-_t.startTs)/1000)
  _t.running=false; _t.paused=false
  _t.finalHours=Math.max(0.25,Math.round((_t.elapsed/3600)*4)/4)
  document.getElementById('t-final-time').textContent=fmt(_t.elapsed)
  document.getElementById('t-final-hrs').textContent=_t.finalHours.toFixed(2)+'h (rounded to nearest 0.25)'
  document.getElementById('submit-err').style.display='none'
  show('s-submit')
}
function timerResume(){
  _t.running=true; _t.paused=true
  document.getElementById('t-pause-btn').textContent='▶ Resume'
  document.getElementById('t-status').textContent='⏸ PAUSED'; document.getElementById('t-status').style.color='#92400e'
  show('s-running')
}
async function timerSubmit(){
  var notes=document.getElementById('t-notes').value.trim()
  try{
    var r=await fetch('/api/my/hours/submit',{method:'POST',headers:{'Content-Type':'application/json'},
      credentials:'include',body:JSON.stringify({type:'independent',event:_t.activity,role:_t.category,
      hours:_t.finalHours,notes:notes,date:new Date().toISOString().slice(0,10)})})
    var d=await r.json()
    if(d.error){var e=document.getElementById('submit-err');e.textContent=d.error;e.style.display='';return}
    document.getElementById('t-success-msg').textContent=_t.finalHours.toFixed(2)+'h for "'+_t.activity+'" submitted!'
    try{localStorage.setItem('hwtc_hours_submitted',Date.now())}catch(e){}
    show('s-success')
  }catch(err){var e=document.getElementById('submit-err');e.textContent='Network error — try again';e.style.display=''}
}
function timerReset(){
  _t={running:false,paused:false,startTs:null,elapsed:0,interval:null,activity:'',category:'',finalHours:0}
  document.getElementById('t-activity').value=''; document.getElementById('t-clock').textContent='00:00:00'
  document.getElementById('t-notes').value=''; show('s-setup')
}
</script>
</body>
</html>
