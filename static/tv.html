<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="robots" content="noindex"/>
<title>HWTC Lobby Display</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden}
  body{font-family:'DM Sans',-apple-system,sans-serif;background:linear-gradient(160deg,#0d3d4d,#0a2a35 65%);color:#fff}
  #frame{position:fixed;inset:0;width:100%;height:100%;border:0;display:none;background:#0a2a35}
  .screen{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px}
  .logo{height:72px;margin-bottom:28px;opacity:0.9}
  .eyebrow{font-size:16px;font-weight:700;letter-spacing:0.15em;text-transform:uppercase;color:rgba(255,255,255,0.55);margin-bottom:10px}
  h1{font-size:44px;font-weight:800;margin-bottom:14px}
  p{font-size:20px;color:rgba(255,255,255,0.7);max-width:720px;line-height:1.5}
  .choices{display:flex;flex-direction:column;gap:18px;margin-top:36px;width:min(760px,90vw)}
  .choice{background:rgba(255,255,255,0.08);border:2px solid rgba(255,255,255,0.25);color:#fff;border-radius:16px;padding:26px 28px;font-family:inherit;font-size:30px;font-weight:700;cursor:pointer;text-align:left}
  .choice:focus,.choice:hover{outline:none;border-color:#5eead4;background:rgba(94,234,212,0.12)}
  #switcher{position:fixed;right:14px;bottom:12px;z-index:5;display:none;background:rgba(0,0,0,0.35);color:rgba(255,255,255,0.7);border:1px solid rgba(255,255,255,0.2);border-radius:10px;padding:8px 12px;font-family:inherit;font-size:13px;cursor:pointer}
</style>
</head>
<body>
<div id="screen" class="screen">
  <img class="logo" src="/static/images/hwtc_logo_white.png" alt="HWTC" onerror="this.style.display='none'"/>
  <div class="eyebrow">Lobby Display</div>
  <h1>Getting ready…</h1>
</div>
<iframe id="frame" title="Lobby display" allow="autoplay"></iframe>
<button id="switcher" onclick="showPicker()">Switch display</button>
<script>
// rolecall.hwtco.org/tv: leave this open on a lobby TV.
// - Normal days: shows the main lobby display.
// - Days with auditions or a Rising Stars rehearsal: asks which display this
//   TV should show (falls back to the main lobby if nobody answers).
// Checks every minute, so it adapts as the day changes.
var POLL_MS = 60000
var ASK_TIMEOUT_S = 60
var options = []
var currentKey = null
var pickedKey = null        // an explicit choice made on this TV today
var askedSig = null         // option set we already asked about
var askTimer = null
try{ var saved = JSON.parse(localStorage.getItem('hwtc_tv_pick')||'null'); if(saved && saved.day === dayStamp()) pickedKey = saved.key }catch(e){}

function dayStamp(){ var d = new Date(); return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate() }
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;') }
function sig(){ return options.map(function(o){ return o.key }).join('|') }
function lobbyOption(){ return options.find(function(o){ return o.kind === 'lobby' }) || {key:'lobby', name:'Main Lobby Display', url:'/lobby', kind:'lobby'} }
function stopAskTimer(){ if(askTimer){ clearInterval(askTimer); askTimer = null } }

function showDisplay(item){
  stopAskTimer()
  document.getElementById('switcher').style.display = options.length > 1 ? '' : 'none'
  if(currentKey === item.key) return
  currentKey = item.key
  document.getElementById('screen').style.display = 'none'
  var f = document.getElementById('frame')
  f.src = item.url
  f.style.display = 'block'
}

function showPicker(){
  currentKey = null
  stopAskTimer()
  document.getElementById('frame').style.display = 'none'
  document.getElementById('frame').removeAttribute('src')
  document.getElementById('switcher').style.display = 'none'
  var el = document.getElementById('screen')
  el.style.display = ''
  el.innerHTML = '<div class="eyebrow">Lobby Display</div><h1>What should this screen show?</h1>'
    + '<div class="choices">' + options.map(function(o, i){
        return '<button class="choice" onclick="pick('+i+')">'+esc(o.name)
          + (o.detail ? '<span style="display:block;font-size:18px;font-weight:500;opacity:0.7;margin-top:4px">'+esc(o.detail)+'</span>' : '')
          + '</button>'
      }).join('') + '</div>'
    + '<p id="ask-countdown" style="margin-top:28px;font-size:16px"></p>'
  var first = el.querySelector('.choice'); if(first) first.focus()
  askedSig = sig()
  var left = ASK_TIMEOUT_S
  var cd = document.getElementById('ask-countdown')
  cd.textContent = 'Showing the main lobby display in ' + left + 's if nothing is picked.'
  askTimer = setInterval(function(){
    left--
    if(left <= 0){ showDisplay(lobbyOption()); return }
    cd.textContent = 'Showing the main lobby display in ' + left + 's if nothing is picked.'
  }, 1000)
}

function pick(i){
  var o = options[i]; if(!o) return
  pickedKey = o.key
  try{ localStorage.setItem('hwtc_tv_pick', JSON.stringify({key:o.key, day:dayStamp()})) }catch(e){}
  showDisplay(o)
}

async function refresh(){
  try{
    var r = await fetch('/api/public/tv/active', {cache:'no-store'})
    var list = await r.json()
    options = Array.isArray(list) && list.length ? list : [lobbyOption()]
  }catch(e){
    if(currentKey === null && !askTimer) showDisplay(lobbyOption())
    return
  }
  if(askTimer) return                       // picker is up; let it finish
  if(options.length === 1){ showDisplay(options[0]); return }
  var chosen = options.find(function(o){ return o.key === pickedKey })
  if(chosen){ showDisplay(chosen); return }
  // Something new is available today (auditions, pick-up): ask once per change
  if(askedSig !== sig()){ showPicker(); return }
  // Already asked about this set and nobody picked: stay on the lobby
  if(currentKey === null || !options.find(function(o){ return o.key === currentKey })) showDisplay(lobbyOption())
  else document.getElementById('switcher').style.display = ''
}

refresh()
setInterval(refresh, POLL_MS)
</script>
</body>
</html>
